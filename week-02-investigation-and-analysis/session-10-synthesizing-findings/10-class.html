### Welcome to Chapter 5!

.pull-left[
.content-box-blue[
In Chapters 1&amp;ndash;4 you learned to analyze data that already exists. Chapter 5 asks the harder question: **where did that data come from, and is it trustworthy?**

A flawed collection method invalidates even the most sophisticated analysis.
]

.font90[We'll examine the design decisions that determine whether a dataset can answer the question it was meant to answer &amp;mdash; including how to audit data collection quality using a coding agent.]
]

### Survey Advantages &amp;amp; Disadvantages

.pull-left[
.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/></svg> Advantages**

- Quick and inexpensive to reach many people
- Standardized questions make answers comparable
- Can measure opinions and attitudes directly
]
]

.pull-right[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M432 256c0 17.7-14.3 32-32 32L48 288c-17.7 0-32-14.3-32-32s14.3-32 32-32l352 0c17.7 0 32 14.3 32 32z"/></svg> Disadvantages**

- People may not answer honestly or accurately
- Question wording can bias responses
- Cannot establish causation
]
]

### Designing a Good Survey

.pull-left[.font90[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Clear Questions&lt;/strong&gt;&lt;br&gt;
  Avoid ambiguous or confusing wording that could be interpreted differently.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Unbiased Wording&lt;/strong&gt;&lt;br&gt;
  Don't use leading questions like "Don't you agree that math is hard?"&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Representative Sample&lt;/strong&gt;&lt;br&gt;
  Ensure your respondents represent the population you're studying.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Test Your Survey&lt;/strong&gt;&lt;br&gt;
  Have someone else review questions to check for clarity and bias.&lt;/div&gt;
&lt;/div&gt;
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img08-1.png" alt="" width="55%" style="display: block; margin: auto;" /&gt;
]

### Observational Studies

.pull-left[.font85[
- **Two types:** *prospective* (follow subjects forward in time &amp;mdash; e.g., track sleep habits over a semester) and *retrospective* (examine existing records &amp;mdash; e.g., historical GPA data). No intervention in either case.

- **No treatment applied** &amp;mdash; the researcher is a passive observer. This is both the strength (studies the real world) and the limitation (cannot control confounders).

- Can reveal **associations but not causation**. The confounder problem: a third variable (e.g., motivation) may drive both the observed variables, creating a spurious correlation that looks real but isn't causal.
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img11-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
]

### Experiments (Controlling and Testing for Cause and Effect)

.pull-left[.font85[
- Researcher **applies a treatment or change** and then measures the outcome.

- **Random assignment is the key mechanism**: it distributes both known and unknown confounders equally across groups &amp;mdash; the only difference between groups is the treatment itself.

- Holding other factors constant (control) + random assignment = the confounders cancel out, making the treatment effect the only plausible explanation for any outcome difference.

- Designed to **establish causation** &amp;mdash; the gold standard is the randomized controlled trial (RCT). A statistically significant result means the effect is unlikely to be due to chance.
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img21-1.png" alt="" width="52%" style="display: block; margin: auto;" /&gt;
]

---

.content-box-blue[

**<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M144 0a80 80 0 1 1 0 160A80 80 0 1 1 144 0zM512 0a80 80 0 1 1 0 160A80 80 0 1 1 512 0zM0 298.7C0 239.8 47.8 192 106.7 192h42.7c15.9 0 31 3.5 44.6 9.7c-1.3 7.2-1.9 14.7-1.9 22.3c0 38.2 16.8 72.5 43.3 96c-.2 0-.4 0-.7 0H21.3C9.6 320 0 310.4 0 298.7zM405.3 320c-.2 0-.4 0-.7 0c26.6-23.5 43.3-57.8 43.3-96c0-7.6-.7-15-1.9-22.3c13.6-6.3 28.7-9.7 44.6-9.7h42.7C592.2 192 640 239.8 640 298.7c0 11.8-9.6 21.3-21.3 21.3H405.3zM224 224a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zM128 485.3C128 411.7 187.7 352 261.3 352H378.7C452.3 352 512 411.7 512 485.3c0 14.7-11.9 26.7-26.7 26.7H154.7c-14.7 0-26.7-11.9-26.7-26.7z"/></svg> Control Group**

.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M274.9 34.3c-28.1-28.1-73.7-28.1-101.8 0L34.3 173.1c-28.1 28.1-28.1 73.7 0 101.8L173.1 413.7c28.1 28.1 73.7 28.1 101.8 0L413.7 274.9c28.1-28.1 28.1-73.7 0-101.8L274.9 34.3zM200 224a24 24 0 1 1 48 0 24 24 0 1 1 -48 0zM96 200a24 24 0 1 1 0 48 24 24 0 1 1 0-48zM224 376a24 24 0 1 1 0-48 24 24 0 1 1 0 48zM352 200a24 24 0 1 1 0 48 24 24 0 1 1 0-48zM224 120a24 24 0 1 1 0-48 24 24 0 1 1 0 48zm96 328c0 35.3 28.7 64 64 64H576c35.3 0 64-28.7 64-64V256c0-35.3-28.7-64-64-64H461.7c11.6 36 3.1 77-25.4 105.5L320 413.8V448zM480 328a24 24 0 1 1 0 48 24 24 0 1 1 0-48z"/></svg> Random Assignment**

Subjects assigned to treatment or control by chance to ensure similar groups.
]

.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M177.9 494.1c-18.7 18.7-49.1 18.7-67.9 0L17.9 401.9c-18.7-18.7-18.7-49.1 0-67.9l50.7-50.7 48 48c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6l-48-48 41.4-41.4 48 48c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6l-48-48 41.4-41.4 48 48c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6l-48-48 41.4-41.4 48 48c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6l-48-48 50.7-50.7c18.7-18.7 49.1-18.7 67.9 0l92.1 92.1c18.7 18.7 18.7 49.1 0 67.9L177.9 494.1z"/></svg> Outcome Measurement**

]
]]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.font85[**Three requirements for valid causal inference:** (1) random assignment to balance confounders, (2) sufficient sample size (statistical power &amp;ge;0.80) to detect real effects, (3) blinding where possible to prevent placebo and experimenter bias.]

### Example: Music and Memory

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Research Question&lt;/strong&gt;&lt;br&gt;
  Does listening to music while studying improve memory?&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Experimental Design&lt;/strong&gt;&lt;br&gt;
  Randomly assign students to study with music or in silence.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Measurement&lt;/strong&gt;&lt;br&gt;
  Give both groups the same memory quiz and compare scores.&lt;/div&gt;
&lt;/div&gt;

--

.content-box-green[
If the music group scores differently, **we can attribute that to the music** since that's the only difference.

### Example: Basketball Colors

.pull-left[.font90[
.content-box-blue[
**Does the color of a basketball affect shooting accuracy?**
]

- Suppose we have a normal **orange basketball** and a **blue basketball**.

- In an experiment, we could have each participant take 10 shots with the orange ball and 10 shots with the blue ball **in a random order**, and measure how many shots they make with each.

- This example shows an experiment because **we purposely changed the condition** (ball color) for the participants.
]]

### Experiments: Advantages &amp;amp; Disadvantages

.pull-left[
.content-box-green[

### Example 2 &amp;mdash; Medical Study on Headache Sufferers

.pull-left[.font80[
- **Population:** All individuals who suffer from headaches

- **Sample Selection:** Recruit a representative group (e.g., 200 volunteers) for the clinical trial

- **Experimental Design:** Randomly assign volunteers to receive either the new headache medicine or a placebo

- **Measurement:** Compare headache relief outcomes between treatment and control groups

- **Generalization:** If results are statistically significant, extend conclusions to the broader population of headache sufferers

- **Key Point:** Proper sampling and clear results allow **valid inference from sample to population**
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img32-1.png" alt="" width="52%" style="display: block; margin: auto;" /&gt;
]

---
### Why Not Study the Whole Population?

.pull-left[.font85[
- A **census** surveys every member of a population &amp;mdash; most accurate but extremely time-consuming, costly, and hard to coordinate.

- Surveying everyone in the country would require massive resources and logistics.

- **Sampling enables inference**: with probability sampling, the Central Limit Theorem guarantees that sample statistics approximate population parameters &amp;mdash; with quantifiable uncertainty expressed as a **margin of error**.

- A well-designed sample of n=1,000 can estimate a population of 300 million with &amp;plusmn;3% margin of error &amp;mdash; *this is how national polls work*. Adding more respondents gives diminishing returns.
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img33-1.png" alt="" width="72%" style="display: block; margin: auto;" /&gt;
]

---
### The Key Idea of Sampling

.pull-left[.font85[
- A probability sample is an **unbiased estimator**: its statistics (mean, proportion) converge to population parameters as *n* grows. The sampling distribution describes how those statistics vary across repeated samples.

- A **biased sample produces systematically wrong estimates** &amp;mdash; and more data doesn't fix it. The 1936 Literary Digest poll collected 2.4 million responses and was still catastrophically wrong because of sampling bias.

- "Properly" versus "poorly" selected samples depends on *how we pick participants* &amp;mdash; stay tuned for sampling methods next!
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img34-1.png" alt="" width="72%" style="display: block; margin: auto;" /&gt;
]

---
### The Soup Analogy

.pull-left[.font85[
- **Whole Pot = Population:** The entire soup represents every individual in the group you care about.

- **Spoonful = Sample:** You taste just one spoonful rather than drinking the whole pot.

- **Well-Stirred Soup:** If it's mixed evenly, that spoonful reflects the flavor of the entire pot.

- **Un-Stirred Soup:** If salt or spices settle unevenly, your taste may mislead you about the true flavor.
]

.content-box-green[
.font85[**Key Insight:** A properly "mixed" sample gives an accurate picture of the population; a poorly chosen one can steer you wrong.]
]
]

.pull-right[
&lt;img src="10-class_files/figure-html/img35-1.png" alt="" width="50%" style="display: block; margin: auto;" /&gt;
]

### SRS Example

.pull-left[.font85[
- **Goal:** survey all students about the new library space

- **Population:** every enrolled student (via their ID numbers)

- **Sample size:** 30 students chosen at random

- **Method:** use a random-number generator on the full list of IDs

- **Invitation:** selected IDs receive an email with the survey link

- **Property:** each student had an **equal chance of selection** &amp;mdash; true simple random sampling
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img42-1.png" alt="" width="85%" style="display: block; margin: auto;" /&gt;
]

---
### Let's Code!!!

.font90[We can do random sampling in both Python and R. Population = 100 individuals. We'll compare SRS vs. biased sampling.]

**Create the population:**

```python
import random
population = list(range(1, 101))  # Population of 100 individuals labeled 1-100
print("Population mean:", sum(population)/len(population))
```

--

**Sample from the population:**

```python
random_sample = random.sample(population, 10)
print("Random sample:", random_sample)
print("Random sample mean:", sum(random_sample)/len(random_sample))
```

---
### Let's Code!!! Biased Sampling

```python
biased_sample = population[:10]   # just takes the FIRST 10 individuals
print("Biased sample:", biased_sample)
print("Biased sample mean:", sum(biased_sample)/len(biased_sample))
```

--

.font85[
- **Population mean = 50.5** (exact). Standard error = &amp;sigma;/&amp;radic;n = 29.0/&amp;radic;10 &amp;asymp; 9.2 &amp;mdash; the theoretical margin of error for n=10 samples.

- **SRS mean varies each run** (try `np.random.seed(42)` for reproducibility). Notice it clusters near 50.5 &amp;mdash; the *unbiased estimator* property.

- **Biased sample mean = 5.5 &amp;mdash; off by 45 points.** No amount of additional data from `population[:10]` fixes this; *the method is structurally wrong*.
]

--

.content-box-blue[
.font85[**Extend this:** run the SRS 1,000 times, collect all sample means, and plot the distribution. You'll see the sampling distribution of the mean &amp;mdash; roughly normal, centered at 50.5. *This is where "margin of error" comes from.*]
]

### How to Do It?

.pull-left[.font90[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Identify the strata (categories)&lt;/strong&gt;&lt;br&gt;
  For example, in a school survey, grade level might be a stratum. The population could be divided into strata: 9th, 10th, 11th, and 12th graders.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Sample proportionally within each stratum&lt;/strong&gt;&lt;br&gt;
  If the school has 25% of students in each grade, a stratified sample of 100 students might randomly pick 25 freshmen, 25 sophomores, 25 juniors, 25 seniors.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Randomly select individuals within each grade&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img48-1.png" alt="" width="68%" style="display: block; margin: auto;" /&gt;
]

---
### Why Stratify?

.pull-left[.font80[
- **Capture Subgroup Differences:** Stratifying splits the population into key subgroups (strata) so you can compare each group's patterns.

- **Guaranteed Representation:** Every stratum has members in your sample, so no group gets left out.

- **Improved Precision:** By making each stratum more alike internally, your overall estimate of the population becomes more accurate.

- **More Reliable Estimates:** When strata are more homogeneous than the full population, stratified sampling yields tighter, "more precise" results.

- **Ideal Use Case:** Best when you know certain subgroups might behave differently and you want to study them all fairly.
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img49-1.png" alt="" width="85%" style="display: block; margin: auto;" /&gt;
]

---
### Stratified Example

.pull-left[.font85[
- **Population:** All parents of students, with 60% having elementary-school children and 40% having high-school children

- **Strata:** Divide parents into two groups &amp;mdash; elementary and high-school

- **Sample:** randomly select 60 elementary and 40 high-school parents (total = 100)

- **Benefit:** matches population mix so both groups are properly represented (avoids, e.g., 80/20 splits by chance)
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img50-1.png" alt="" width="50%" style="display: block; margin: auto;" /&gt;
]

---
### Stratified vs. Simple Random Sampling

.font85[

| | Simple Random Sampling | Stratified Sampling |
|---|------------------------|---------------------|
| **How it selects** | Everyone has an equal chance, drawn from the whole population at once | Population first divided into subgroups, then random sampling within each |
| **Subgroup representation** | By chance &amp;mdash; small subgroups may be missed | Guaranteed for every stratum |
| **Precision** | Good | Better, when strata are internally homogeneous |
| **Complexity** | Simple to run | Requires knowing strata sizes and group lists |
| **Best for** | Homogeneous populations | Populations with distinct subgroups that may differ |

]

### Small Group Activity &amp;mdash; Possible Answer

.font80[
&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Identify Strata:&lt;/strong&gt; Define groups you want to compare.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Determine Stratum Sizes:&lt;/strong&gt; Find out how many students fall into each group (e.g., 300 Science, 200 Arts).&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Decide Sample Allocation:&lt;/strong&gt; Choose sample sizes for each stratum. Mirror the population proportions (e.g., 60% Science &amp;rarr; 60 of 100 total).&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Gather Sampling Frames:&lt;/strong&gt; Obtain lists of students in each group.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;5&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Random Selection Within Strata:&lt;/strong&gt; Use a random number generator or lottery method to pick the required number of students from each list.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;6&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Combine Samples:&lt;/strong&gt; Merge the selected students across all strata into your final survey sample.&lt;/div&gt;
&lt;/div&gt;
]

--

.content-box-green[
.font85[**Benefit:** Guarantees sufficient responses from each subgroup so you can accurately compare their study habits.]
]

### Biased Sampling (and How Samples Go Wrong)

.pull-left[.font90[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/></svg> Definition**

.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> Key Problem**

### Types of Biased Sampling

.pull-left[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M448 128l-177.6 0c1 5.2 1.6 10.5 1.6 16l0 16 32 0 144 0c8.8 0 16-7.2 16-16s-7.2-16-16-16zM224 144c0-17.7-14.3-32-32-32c0 0 0 0 0 0l-24 0c-66.3 0-120 53.7-120 120l0 48c0 52.5 33.7 97.1 80.7 113.4c-.5-3.1-.7-6.2-.7-9.4c0-20 9.2-37.9 23.6-49.7c-4.9-9-7.6-19.4-7.6-30.3c0-15.1 5.3-29 14-40c-8.8-11-14-24.9-14-40l0-40c0-13.3 10.7-24 24-24s24 10.7 24 24l0 40c0 8.8 7.2 16 16 16s16-7.2 16-16l0-40 0-40zM192 64s0 0 0 0c18 0 34.6 6 48 16l208 0c35.3 0 64 28.7 64 64s-28.7 64-64 64l-82 0c1.3 5.1 2 10.5 2 16c0 25.3-14.7 47.2-36 57.6c2.6 7 4 14.5 4 22.4c0 20-9.2 37.9-23.6 49.7c4.9 9 7.6 19.4 7.6 30.3c0 35.3-28.7 64-64 64l-64 0-24 0C75.2 448 0 372.8 0 280l0-48C0 139.2 75.2 64 168 64l24 0zm64 336c8.8 0 16-7.2 16-16s-7.2-16-16-16l-48 0-16 0c-8.8 0-16 7.2-16 16s7.2 16 16 16l64 0zm16-176c0 5.5-.7 10.9-2 16l2 0 32 0c8.8 0 16-7.2 16-16s-7.2-16-16-16l-32 0 0 16zm-24 64l-40 0c-8.8 0-16 7.2-16 16s7.2 16 16 16l48 0 16 0c8.8 0 16-7.2 16-16s-7.2-16-16-16l-24 0z"/></svg> Convenience Sampling**
Selecting based on accessibility rather than probability. Overrepresents certain demographics (e.g., online surveys oversample younger, more tech-savvy respondents).

**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 0c-25.3 0-47.2 14.7-57.6 36c-7-2.6-14.5-4-22.4-4c-35.3 0-64 28.7-64 64V261.5l-2.7-2.7c-25-25-65.5-25-90.5 0s-25 65.5 0 90.5L106.5 437c48 48 113.1 75 181 75H296h8c1.5 0 3-.1 4.5-.4c91.7-6.2 165-79.4 171.1-171.1c.3-1.5 .4-3 .4-4.5V160c0-35.3-28.7-64-64-64c-5.5 0-10.9 .7-16 2V96c0-35.3-28.7-64-64-64c-7.9 0-15.4 1.4-22.4 4C303.2 14.7 281.3 0 256 0zM240 96.1c0 0 0-.1 0-.1V64c0-8.8 7.2-16 16-16s16 7.2 16 16V95.9c0 0 0 .1 0 .1V232c0 13.3 10.7 24 24 24s24-10.7 24-24V96c0 0 0 0 0-.1c0-8.8 7.2-16 16-16s16 7.2 16 16v55.9c0 0 0 .1 0 .1v80c0 13.3 10.7 24 24 24s24-10.7 24-24V160.1c0 0 0-.1 0-.1c0-8.8 7.2-16 16-16s16 7.2 16 16V332.9c-.1 .6-.1 1.3-.2 1.9c-3.4 69.7-59.3 125.6-129 129c-.6 0-1.3 .1-1.9 .2H296h-8.5c-55.2 0-108.1-21.9-147.1-60.9L52.7 315.3c-6.2-6.2-6.2-16.4 0-22.6s16.4-6.2 22.6 0L119 336.4c6.9 6.9 17.2 8.9 26.2 5.2s14.8-12.5 14.8-22.2V96c0-8.8 7.2-16 16-16c8.8 0 16 7.1 16 15.9V232c0 13.3 10.7 24 24 24s24-10.7 24-24V96.1z"/></svg> Voluntary Response**
Self-selected respondents systematically differ from those who don't respond &amp;mdash; typically showing more extreme opinions. Common in online ratings and comment sections.

**<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L353.3 251.6C407.9 237 448 187.2 448 128C448 57.3 390.7 0 320 0C250.2 0 193.5 55.8 192 125.2L38.8 5.1zM264.3 304.3C170.5 309.4 96 387.2 96 482.3c0 16.4 13.3 29.7 29.7 29.7H514.3c3.9 0 7.6-.7 11-2.1l-261-205.6z"/></svg> Undercoverage**

### Poll Failure Example: The 1936 Literary Digest Poll

.pull-left[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M64 112c-8.8 0-16 7.2-16 16v22.1L220.5 291.7c20.7 17 50.4 17 71.1 0L464 150.1V128c0-8.8-7.2-16-16-16H64zM48 212.2V384c0 8.8 7.2 16 16 16H448c8.8 0 16-7.2 16-16V212.2L322 328.8c-38.4 31.5-93.7 31.5-132 0L48 212.2zM0 128C0 92.7 28.7 64 64 64H448c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128z"/></svg> The Survey**
In 1936, Literary Digest mailed **10 million ballots** to predict the presidential election &amp;mdash; the largest poll ever conducted at the time.

**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> Biased Method**
Telephone and club-member lists **over-sampled wealthy Americans** during the Depression &amp;mdash; undercoverage bias. *2016 parallel: state polls failed because non-college-educated white voters were systematically underrepresented.*

### An Illustration of Sampling Bias

.pull-left[.font85[
- **Sampling Bias Example:** The population is 60% "Yes" and 40% "No," but the biased sample shows **90% "Yes" and 10% "No."**

- **Problem:** The sample overrepresents "Yes" responses, misrepresenting the true population.

- **Impact:** Poor sampling can lead to seriously misleading study results.

- **Key Reminder:** Always check *how the sample was collected* to assess the trustworthiness of findings.
]]

### Why Good Data Collection Matters

.three-col[
.col[
<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:2.5em;width:2.19em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"/></svg>

**Garbage In, Garbage Out**

]
.col[
<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:2.5em;width:2.5em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg>

.col[
<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:2.5em;width:2.5em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M168.5 72L256 165l87.5-93h-175zM383.9 99.1L311.5 176h129L383.9 99.1zm50 124.9H256 78.1L256 420.3 433.9 224zM71.5 176h129L128.1 99.1 71.5 176zm434.3 40.1l-232 256c-4.5 5-11 7.9-17.8 7.9s-13.2-2.9-17.8-7.9l-232-256c-7.7-8.5-8.3-21.2-1.5-30.4l112-152c4.5-6.1 11.7-9.8 19.3-9.8H376c7.6 0 14.8 3.6 19.3 9.8l112 152c6.8 9.2 6.1 21.9-1.5 30.4z"/></svg>

### Overgeneralization

.pull-left[.font90[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/></svg> Definition**

Extending conclusions **beyond the population that was actually studied**.
]

.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M337.8 5.4C327-1.8 313-1.8 302.2 5.4L166.3 96H48C21.5 96 0 117.5 0 144V464c0 26.5 21.5 48 48 48H256V416c0-35.3 28.7-64 64-64s64 28.7 64 64v96H592c26.5 0 48-21.5 48-48V144c0-26.5-21.5-48-48-48H473.7L337.8 5.4zM96 192h32c8.8 0 16 7.2 16 16v64c0 8.8-7.2 16-16 16H96c-8.8 0-16-7.2-16-16V208c0-8.8 7.2-16 16-16zm400 16c0-8.8 7.2-16 16-16h32c8.8 0 16 7.2 16 16v64c0 8.8-7.2 16-16 16H512c-8.8 0-16-7.2-16-16V208zM96 320h32c8.8 0 16 7.2 16 16v64c0 8.8-7.2 16-16 16H96c-8.8 0-16-7.2-16-16V336c0-8.8 7.2-16 16-16zm400 16c0-8.8 7.2-16 16-16h32c8.8 0 16 7.2 16 16v64c0 8.8-7.2 16-16 16H512c-8.8 0-16-7.2-16-16V336zM232 176a88 88 0 1 1 176 0 88 88 0 1 1 -176 0zm88-48c-8.8 0-16 7.2-16 16v32c0 8.8 7.2 16 16 16h32c8.8 0 16-7.2 16-16s-7.2-16-16-16H336V144c0-8.8-7.2-16-16-16z"/></svg> Example**

### How to Do It Right? Data Collection Quality Checklist

.pull-left[.font80[
**Before trusting any dataset, ask:**

<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Was the sample selected by a **probability method** (SRS, stratified)? If not, who is missing?

<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> What is the **response rate**? Below 60% risks serious nonresponse bias. What do we know about who didn't respond?

<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Does **sample demography** match known population demography (age, gender, geography)? Any systematic gaps?

<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Are questions **neutrally worded**? Would the same question phrased differently yield a different answer?

<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Is the **collection method matched to the research question**? (Surveys measure attitudes; experiments establish causation; observational studies reveal associations.)

<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Is the **generalization appropriate**? Results from one city's high schoolers cannot be extended to all American teens.
]]

.pull-right[
&lt;img src="10-class_files/figure-html/img62-1.png" alt="" width="52%" style="display: block; margin: auto;" /&gt;
]

### Voluntary Participation

### Honesty and Integrity

.pull-left[.font85[
#### <svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M64 464c-8.8 0-16-7.2-16-16V64c0-8.8 7.2-16 16-16H224v80c0 17.7 14.3 32 32 32h80V448c0 8.8-7.2 16-16 16H64zM64 0C28.7 0 0 28.7 0 64V448c0 35.3 28.7 64 64 64H320c35.3 0 64-28.7 64-64V154.5c0-17-6.7-33.3-18.7-45.3L274.7 18.7C262.7 6.7 246.5 0 229.5 0H64zm56 256c-13.3 0-24 10.7-24 24s10.7 24 24 24H264c13.3 0 24-10.7 24-24s-10.7-24-24-24H120zm0 96c-13.3 0-24 10.7-24 24s10.7 24 24 24H264c13.3 0 24-10.7 24-24s-10.7-24-24-24H120z"/></svg> &amp;nbsp; Accurate Reporting
Report data honestly without fabricating or manipulating responses.

#### <svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M175 389.4c-9.8 16-15 34.3-15 53.1c-10 3.5-20.8 5.5-32 5.5c-53 0-96-43-96-96V64C14.3 64 0 49.7 0 32S14.3 0 32 0H96h64 64c17.7 0 32 14.3 32 32s-14.3 32-32 32V309.9l-49 79.6zM96 64v96h64V64H96zM352 0H480h32c17.7 0 32 14.3 32 32s-14.3 32-32 32V214.9L629.7 406.2c6.7 10.9 10.3 23.5 10.3 36.4c0 38.3-31.1 69.4-69.4 69.4H261.4c-38.3 0-69.4-31.1-69.4-69.4c0-12.8 3.6-25.4 10.3-36.4L320 214.9V64c-17.7 0-32-14.3-32-32s14.3-32 32-32h32zm32 64V224c0 5.9-1.6 11.7-4.7 16.8L330.5 320h171l-48.8-79.2c-3.1-5-4.7-10.8-4.7-16.8V64H384z"/></svg> &amp;nbsp; Proper Data Handling
Avoid **p-hacking**: don't run multiple tests until one is significant, then report only that one. *Pre-registration* (publishing your hypothesis before collecting data) prevents this.

#### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zm-312 8v64c0 13.3 10.7 24 24 24s24-10.7 24-24l0-64c0-13.3-10.7-24-24-24s-24 10.7-24 24zm80-96V280c0 13.3 10.7 24 24 24s24-10.7 24-24V120c0-13.3-10.7-24-24-24s-24 10.7-24 24zm80 64v96c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24s-24 10.7-24 24z"/></svg> &amp;nbsp; Transparency
Report confidence intervals and effect sizes, not just p-values. Statistical significance &amp;ne; practical significance &amp;mdash; both must be reported for honest interpretation.

### Reflection Prompt

.pull-left[
.content-box-yellow[
.font110[**"Would I be okay if this were done to me or someone I care about?"**]

Before collecting any data from individuals, ask yourself this question.
]

.font80[
- Professional research requires **Institutional Review Board (IRB)** approval &amp;mdash; an independent ethics committee that evaluates study design before data is collected. Data involving minors requires additional parental consent layers.

- **GDPR** (EU) and **FERPA** (US education) are legal frameworks that govern data privacy. Violating them isn't just unethical &amp;mdash; it's illegal. When in doubt: collect the minimum data needed and **anonymize by default**.
]
]

### Using a Coding Agent to Audit Data Collection

.font80[
**What a coding agent can do for study design and bias detection:**

- Load a dataset and report: sample size, missing values, dtype mismatches, and distribution of key demographic variables (age, gender, geography). Flag any column where the distribution looks implausible.

- **Compute the response rate automatically**: if a dataset should have 500 rows but only has 312 non-null in a key column, that's a 37.6% nonresponse rate &amp;mdash; a red flag.
]

--

.pull-left[
.content-box-yellow[
.font80[**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> Weak:** "Check for bias in this dataset." &amp;rarr; Agent produces a generic list without connecting to the data.]
]
]

.pull-right[

.font80[**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Strong:** "Load survey_results.csv. Compare the age and gender distribution of respondents to the known population (18-65, 51% female). Flag any demographic where our sample differs from the population by more than 5 percentage points."]
]
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.font80[**Follow-up:** "Which survey questions show the highest nonresponse rate? Could the missing answers be non-random?"]

### Simulating Sampling Distributions with a Coding Agent

.font85[
**Ask your coding agent to simulate what "margin of error" actually looks like:**

.content-box-blue[
"Using numpy, simulate drawing 1,000 random samples of size n=50 from a population of 10,000 voters (60% support a policy). For each sample, compute the proportion supporting the policy. Plot the sampling distribution as a histogram."
]

**Interpret the output:** the histogram should be roughly normal, centered at 0.60, with spread &amp;asymp; &amp;radic;(0.6&amp;times;0.4/50) &amp;asymp; &amp;plusmn;7%. *This is the margin of error.*
]

--

.font85[
**Extend to stratified sampling:**

.content-box-green[
"Now repeat with stratified sampling (50% urban, 50% rural strata, each with different true support rates). Compare the standard error to SRS &amp;mdash; stratified sampling should give a narrower distribution."
]

**Key insight:** the agent does the computation; *you* interpret what the distribution tells you about uncertainty and sampling strategy tradeoffs.
]

### Hands-On: Agent-Assisted Study Design Critique

.font85[**Activity (pairs, 20 minutes)** &amp;mdash; critique a flawed study design:]

.content-box-yellow[
.font80[**Setup:** A school wants to understand student mental health. They post a **voluntary online survey** on the school website. 180 of 800 students respond (22.5% response rate). Results: 74% report feeling "stressed or overwhelmed."]
]

.font80[
&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Identify the method:&lt;/strong&gt; What type of study is this? What sampling method was used?&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Find the biases:&lt;/strong&gt; List every potential bias (voluntary response, undercoverage, nonresponse, question wording). For each, explain how it might distort the 74% figure up or down.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Prompt your coding agent:&lt;/strong&gt; "Given a 22.5% response rate and voluntary participation, what is the worst-case range for the true percentage feeling stressed? Assume non-responders might differ by up to 20 percentage points."&lt;/div&gt;
&lt;/div&gt;
]

--

.font90[**Present:** What would it take for the school to trust this result enough to act on it?]

### Chapter 5: What You Can Do Now

.font75[
**Research design:**

- Classify any study as survey, observational (prospective/retrospective), or experiment. Explain why only experiments establish causation &amp;mdash; and what makes random assignment the key mechanism.

**Sampling:**

- Apply simple random sampling and stratified sampling in Python (numpy). Explain the sampling distribution of the mean and how it produces a margin of error.
- Identify the five bias types (convenience, voluntary response, undercoverage, nonresponse, questionnaire). Apply the data quality checklist to evaluate any dataset.

**Ethics:**

- Apply voluntary participation, informed consent, confidentiality, beneficence, and justice to data collection scenarios. Explain IRB, GDPR, and FERPA in age-appropriate terms.

**Agent-assisted analysis:**

- Use a coding agent to audit a dataset for demographic bias, compute response rates, simulate sampling distributions, and critique a study design &amp;mdash; then evaluate the agent's output critically.
]
