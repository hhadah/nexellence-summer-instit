### Welcome to Day 10!

.pull-left[.font90[
Today you **synthesize** &amp;mdash; turning a pile of results into a coherent story, and connecting it back to the literature.

By the end of the day you will be able to:

- **Synthesize** your results with existing literature into a coherent interpretation
- **Differentiate** results from discussion and conclusion
- **Strengthen** your methods and results sections
- Understand the role of **limitations** in scientific humility
]]

.font90[To **discuss** your findings is to do **five things, in order**:]

&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;1&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Restate&lt;/strong&gt; your key finding (in plain language).&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;2&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Compare&lt;/strong&gt; it to what the literature said &amp;mdash; agree? disagree? extend?&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;3&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Explain&lt;/strong&gt; &lt;em&gt;why&lt;/em&gt; you might have found what you found.&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;4&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Acknowledge&lt;/strong&gt; your limitations.&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;5&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Suggest&lt;/strong&gt; what comes next.&lt;/div&gt;&lt;/div&gt;

### Limitations: Scientific Humility

.pull-left[.font88[
Naming limitations isn't weakness &amp;mdash; it's **credibility.** It shows you understand what your study can and cannot claim.

.content-box-blue[
**Common, honest limitations:**
- Small or non-random **sample**
- **Self-reported** or noisy measures
- **Observational** data &amp;rarr; correlation, not proof of cause
- Short **time window**
]
]]
