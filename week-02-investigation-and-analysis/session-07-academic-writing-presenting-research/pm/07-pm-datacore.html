### <svg aria-hidden="true" role="img" viewBox="0 0 576 512" style="height:1em;width:1.12em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M249.6 471.5c10.8 3.8 22.4-4.1 22.4-15.5V78.6c0-4.2-1.6-8.4-5-11C247.4 52 202.4 32 144 32C93.5 32 46.3 45.3 18.1 56.1C6.8 60.5 0 71.7 0 83.8V454.1c0 11.9 12.8 20.2 24.1 16.5C55.6 460.1 105.5 448 144 448c33.9 0 79 14 105.6 23.5zm76.8 0C353 462 398.1 448 432 448c38.5 0 88.4 12.1 119.9 22.6c11.3 3.8 24.1-4.6 24.1-16.5V83.8c0-12.1-6.8-23.3-18.1-27.6C529.7 45.3 482.5 32 432 32c-58.4 0-103.4 20-123 35.6c-3.3 2.6-5 6.8-5 11V456c0 11.4 11.7 19.3 22.4 15.5z"/></svg> Why storytelling? Because nobody remembers a list

.pull-left[
.font90[
Every good research talk is a **story** with the same beats:

1. **Setting** &amp;mdash; here's the world and what we know about it *(background)*
2. **Tension** &amp;mdash; but here's what we **don't** know *(the gap)*
3. **Quest** &amp;mdash; so we asked this question *(research question)*
4. **Resolution** &amp;mdash; and here's what we found *(results)*
]
]

.pull-right[
.content-box-blue[
.font85[<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M297.2 248.9C311.6 228.3 320 203.2 320 176c0-70.7-57.3-128-128-128S64 105.3 64 176c0 27.2 8.4 52.3 22.8 72.9c3.7 5.3 8.1 11.3 12.8 17.7l0 0c12.9 17.7 28.3 38.9 39.8 59.8c10.4 19 15.7 38.8 18.3 57.5H109c-2.2-12-5.9-23.7-11.8-34.5c-9.9-18-22.2-34.9-34.5-51.8l0 0 0 0c-5.2-7.1-10.4-14.2-15.4-21.4C27.6 247.9 16 213.3 16 176C16 78.8 94.8 0 192 0s176 78.8 176 176c0 37.3-11.6 71.9-31.4 100.3c-5 7.2-10.2 14.3-15.4 21.4l0 0 0 0c-12.3 16.8-24.6 33.7-34.5 51.8c-5.9 10.8-9.6 22.5-11.8 34.5H226.4c2.6-18.7 7.9-38.6 18.3-57.5c11.5-20.9 26.9-42.1 39.8-59.8l0 0 0 0 0 0c4.7-6.4 9-12.4 12.7-17.7zM192 128c-26.5 0-48 21.5-48 48c0 8.8-7.2 16-16 16s-16-7.2-16-16c0-44.2 35.8-80 80-80c8.8 0 16 7.2 16 16s-7.2 16-16 16zm0 384c-44.2 0-80-35.8-80-80V416H272v16c0 44.2-35.8 80-80 80z"/></svg> &amp;nbsp; Your audience won't remember your fourth citation. They **will** remember the tension: *"we know A and B &amp;mdash; but nobody knows C, so we asked&amp;hellip;"*]
]
]

.font85[Today we practice the two moments where storytelling matters most: the **setup** (literature &amp;rarr; gap &amp;rarr; question) and the **payoff** (results).]

### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M3.9 54.9C10.5 40.9 24.5 32 40 32H472c15.5 0 29.5 8.9 36.1 22.9s4.6 30.5-5.2 42.5L320 320.9V448c0 12.1-6.8 23.2-17.7 28.6s-23.8 4.3-33.5-3l-64-48c-8.1-6-12.8-15.5-12.8-25.6V320.9L9 97.3C-.7 85.4-2.8 68.8 3.9 54.9z"/></svg> The funnel: a chapter becomes two slides

.pull-left[
.font90[
Your literature review is **pages** long. Your presentation gets **two slides**:

.content-box-blue[
.font85[**Slide 1 &amp;mdash; Background**&lt;br&gt;
Key **definitions** + **2&amp;ndash;3 cited findings**. What the audience must know to care about your question.]
]

.content-box-green[
.font85[**Slide 2 &amp;mdash; Gap + Research Question**&lt;br&gt;
What's **missing** from what we know &amp;mdash; and the **question** that follows from it.]
]
]
]

.pull-right[
.content-box-yellow[
.font85[<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#c08a00;overflow:visible;position:relative;"><path d="M160 64c0-17.7-14.3-32-32-32s-32 14.3-32 32v64H32c-17.7 0-32 14.3-32 32s14.3 32 32 32h96c17.7 0 32-14.3 32-32V64zM32 320c-17.7 0-32 14.3-32 32s14.3 32 32 32H96v64c0 17.7 14.3 32 32 32s32-14.3 32-32V352c0-17.7-14.3-32-32-32H32zM352 64c0-17.7-14.3-32-32-32s-32 14.3-32 32v96c0 17.7 14.3 32 32 32h96c17.7 0 32-14.3 32-32s-14.3-32-32-32H352V64zM320 320c-17.7 0-32 14.3-32 32v96c0 17.7 14.3 32 32 32s32-14.3 32-32V384h64c17.7 0 32-14.3 32-32s-14.3-32-32-32H320z"/></svg> &amp;nbsp; This is not "shrinking" your literature review &amp;mdash; it's **distilling** it. You keep only what sets up the question. Everything else stays in the written report.]
]
]

### <svg aria-hidden="true" role="img" viewBox="0 0 576 512" style="height:1em;width:1.12em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M264.5 5.2c14.9-6.9 32.1-6.9 47 0l218.6 101c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 149.8C37.4 145.8 32 137.3 32 128s5.4-17.9 13.9-21.8L264.5 5.2zM476.9 209.6l53.2 24.6c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 277.8C37.4 273.8 32 265.3 32 256s5.4-17.9 13.9-21.8l53.2-24.6 152 70.2c23.4 10.8 50.4 10.8 73.8 0l152-70.2zm-152 198.2l152-70.2 53.2 24.6c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 405.8C37.4 401.8 32 393.3 32 384s5.4-17.9 13.9-21.8l53.2-24.6 152 70.2c23.4 10.8 50.4 10.8 73.8 0z"/></svg> Anatomy of the Background slide

.pull-left[
.font88[
**1. Key definitions (1&amp;ndash;2 terms)**
- Only terms your audience **needs** &amp;mdash; not a glossary.
- One line each, in your own words.

**2. What we know (2&amp;ndash;3 cited findings)**
- Organized by **theme**, not by author.
- One finding per line &amp;mdash; **no paragraphs**.
- Each ends with a citation: **(Author, Year)**.
]
]

.pull-right[
.content-box-red[
.font85[<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#fff;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> &amp;nbsp; **The #1 mistake:** pasting sentences from your written review onto the slide. A slide is a **billboard**, not a page. If it takes more than 5 seconds to read a line, cut it.]
]
]

.font80[From this morning's climate case: *Does temperature rise affect wildfire frequency?*]

.mock-slide[
#### Background: Temperature &amp; Wildfires
.font80[
**Key terms:** &amp;nbsp;*Acres burned* = total area destroyed by wildfire per year &amp;nbsp;&amp;middot;&amp;nbsp; *Fire season* = months when large fires occur

**What we know:**
- Global average temperature has risen about 1.1&amp;deg;C since pre-industrial times (IPCC, 2021)
- Fire seasons in the western U.S. have grown longer and more severe since the 1980s (Westerling, 2016)
- Drought and forest management also shape fire risk &amp;mdash; temperature is not the only factor (Abatzoglou &amp; Williams, 2016)
]
]

.font80[<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> &amp;nbsp; Two terms defined. Three findings, one line each, each cited. A stranger can read this slide in **20 seconds** and be ready for your question.]

.pull-left[
.font88[
**1. The gap (1&amp;ndash;2 sentences)**
- What do the studies you cited **not** answer?
- Point back at your Background slide: the gap should feel **inevitable** after it.

**2. The research question (verbatim)**
- Word-for-word the question your team wrote &amp;mdash; don't paraphrase it live.
- Add your **hypothesis** if you have one.
]
]

.pull-right[
.content-box-blue[
.font85[<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M579.8 267.7c56.5-56.5 56.5-148 0-204.5c-50-50-128.8-56.5-186.3-15.4l-1.6 1.1c-14.4 10.3-17.7 30.3-7.4 44.6s30.3 17.7 44.6 7.4l1.6-1.1c32.1-22.9 76-19.3 103.8 8.6c31.5 31.5 31.5 82.5 0 114L422.3 334.8c-31.5 31.5-82.5 31.5-114 0c-27.9-27.9-31.5-71.8-8.6-103.8l1.1-1.6c10.3-14.4 6.9-34.4-7.4-44.6s-34.4-6.9-44.6 7.4l-1.1 1.6C206.5 251.2 213 330 263 380c56.5 56.5 148 56.5 204.5 0L579.8 267.7zM60.2 244.3c-56.5 56.5-56.5 148 0 204.5c50 50 128.8 56.5 186.3 15.4l1.6-1.1c14.4-10.3 17.7-30.3 7.4-44.6s-30.3-17.7-44.6-7.4l-1.6 1.1c-32.1 22.9-76 19.3-103.8-8.6C74 372 74 321 105.5 289.5L217.7 177.2c31.5-31.5 82.5-31.5 114 0c27.9 27.9 31.5 71.8 8.6 103.9l-1.1 1.6c-10.3 14.4-6.9 34.4 7.4 44.6s34.4 6.9 44.6-7.4l1.1-1.6C433.5 260.8 427 182 377 132c-56.5-56.5-148-56.5-204.5 0L60.2 244.3z"/></svg> &amp;nbsp; The magic sentence connecting the two slides:

#### The Gap &amp; Our Question
.font80[
**What's missing:** Most studies track how **long** fire seasons have become. Fewer connect temperature **directly** to how much land actually burns each year over recent decades.

**Our research question:** *Is average summer temperature associated with annual acres burned in the United States, 1990&amp;ndash;2020?*

**Our hypothesis:** Years with hotter summers will show more acres burned.
]
]

--

.font85[Say the magic sentence out loud: *"Because we don't yet know whether temperature tracks **acres burned**, we ask: is average summer temperature associated with annual acres burned?"* <svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></svg> It flows &amp;mdash; the slides are doing their job.]

### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M367.2 412.5L99.5 144.8C77.1 176.1 64 214.5 64 256c0 106 86 192 192 192c41.5 0 79.9-13.1 111.2-35.5zm45.3-45.3C434.9 335.9 448 297.5 448 256c0-106-86-192-192-192c-41.5 0-79.9 13.1-111.2 35.5L412.5 367.2zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z"/></svg> Four ways these slides go wrong

.three-col[
.col[
.content-box-red[
.font78[
**The wall of text**&lt;br&gt;
Full sentences from the written review. Audience reads instead of listens.
]
]
.content-box-red[
.font78[
**The name-drop**&lt;br&gt;
"Smith (2020) found&amp;hellip; Jones (2021) found&amp;hellip;" &amp;mdash; organized by author, no theme, no point.
]
]
]
.col[
.content-box-red[
.font78[
**The orphan question**&lt;br&gt;
A research question that doesn't follow from the gap &amp;mdash; the audience wonders *"why THIS question?"*
]
]
.content-box-red[
.font78[
**The missing citation**&lt;br&gt;
A confident claim with no (Author, Year). Instantly costs you credibility.
]
]
]
.col[
