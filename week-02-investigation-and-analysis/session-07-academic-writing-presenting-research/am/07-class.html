### Welcome to Day 7!

.pull-left[.font110[
Today is about **communicating your research** &amp;mdash; writing it up with academic rigor and presenting it with confidence.

By the end of the morning you will be able to:

- Recognize the **structure of a research paper** &amp;mdash; from introduction to references
- Write in a **formal, objective academic style**
- **Cite sources** correctly and know what needs citing
- Draft the **introduction slides** for your team presentation
]]

### The Research Story <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:0.8em;width:0.8em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#fff;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 1 48 256a208 208 0 1 1 416 0zM0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM232 120V256c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2V120c0-13.3-10.7-24-24-24s-24 10.7-24 24z"/></svg> 25 min

&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;2&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Literature Review&lt;/strong&gt; &amp;mdash; &lt;em&gt;What do we already know?&lt;/em&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;3&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Methods&lt;/strong&gt; &amp;mdash; &lt;em&gt;How did you study it?&lt;/em&gt;&lt;/div&gt;&lt;/div&gt;

]]

.pull-right[.font85[
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;5&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Discussion&lt;/strong&gt; &amp;mdash; &lt;em&gt;What does it mean?&lt;/em&gt;&lt;/div&gt;&lt;/div&gt;

### Academic Writing Characteristics

&lt;div class="card-grid"&gt;
  &lt;div class="card"&gt;
    &lt;h4&gt;<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M96 128a128 128 0 1 0 256 0A128 128 0 1 0 96 128zm94.5 200.2l18.6 31L175.8 483.1l-36-146.9c-2-8.1-9.8-13.4-17.9-11.3C51.9 342.4 0 405.8 0 481.3c0 17 13.8 30.7 30.7 30.7H162.5c0 0 0 0 .1 0H168 280h5.5c0 0 0 0 .1 0H417.3c17 0 30.7-13.8 30.7-30.7c0-75.5-51.9-138.9-121.9-156.4c-8.1-2-15.9 3.3-17.9 11.3l-36 146.9L238.9 359.2l18.6-31c6.4-10.7-1.3-24.2-13.7-24.2H224 204.3c-12.4 0-20.1 13.6-13.7 24.2z"/></svg> Formal Tone&lt;/h4&gt;

  &lt;/div&gt;
  &lt;div class="card"&gt;
    &lt;h4&gt;<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M384 32H512c17.7 0 32 14.3 32 32s-14.3 32-32 32H398.4c-5.2 25.8-22.9 47.1-46.4 57.3V448H512c17.7 0 32 14.3 32 32s-14.3 32-32 32H320 128c-17.7 0-32-14.3-32-32s14.3-32 32-32H288V153.3c-23.5-10.3-41.2-31.6-46.4-57.3H128c-17.7 0-32-14.3-32-32s14.3-32 32-32H256c14.6-19.4 37.8-32 64-32s49.4 12.6 64 32zm55.6 288H584.4L512 195.8 439.6 320zM512 416c-62.9 0-115.2-34-126-78.9c-2.6-11 1-22.3 6.7-32.1l95.2-163.2c5-8.6 14.2-13.8 24.1-13.8s19.1 5.3 24.1 13.8l95.2 163.2c5.7 9.8 9.3 21.1 6.7 32.1C627.2 382 574.9 416 512 416zM126.8 195.8L54.4 320H199.3L126.8 195.8zM.9 337.1c-2.6-11 1-22.3 6.7-32.1l95.2-163.2c5-8.6 14.2-13.8 24.1-13.8s19.1 5.3 24.1 13.8l95.2 163.2c5.7 9.8 9.3 21.1 6.7 32.1C242 382 189.7 416 126.8 416S11.7 382 .9 337.1z"/></svg> Objective Focus&lt;/h4&gt;

.font85[**Key principles:** one idea per sentence &amp;middot; active voice when possible &amp;middot; precise vocabulary &amp;middot; third person in formal writing &amp;middot; no filler phrases.]

### Literature Review Template

.pull-left[.font80[
**Begin with a short introduction:**
- What is your topic?
- Why is it important?
- Give the broad context of the problem.

**Body:**
- Share what other studies have found.
- Organize by **themes, not by author**.

**End with a summary:**
- Summarize what was found.
- Clarify how **your** project connects to past research.
- Name the **patterns** you noticed and the **gaps** that remain.
]]

### Why Citing Matters

.pull-left[.font90[
**What is citing?**

Citing your sources means **giving credit** to the original authors of the ideas, words, or data you use in your work.
]]

.pull-right[.font90[
**We cite to:**

- **Avoid plagiarism** &amp;mdash; taking credit for someone else's work
- **Show where** your information came from
- **Help others find** those sources to learn more
]]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.content-box-yellow[
.font90[**Citing is part of being a trustworthy researcher.** It shows respect for others' work &amp;mdash; and that you're serious about your own.]
]

---
### What to Cite &amp;mdash; and What Not To

.pull-left[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> You should cite:**

- Direct quotes (even short ones)
- Paraphrased ideas (someone else's idea in your own words)
- Statistics or data
- Images, charts, or graphics you didn't create
]
]

.pull-right[
.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> You don't need to cite:**

- Common knowledge (e.g., "Water freezes at 0&amp;deg;C")
- Your own original thoughts
]
]

---
### How to Cite

.font85[There are different styles (**APA, MLA, Chicago**), but the basic idea is the same: name the **author, date**, and sometimes the **page** in your text &amp;mdash; then list the full details at the end.]

.content-box-blue[.font85[
**In-text (APA):** "Teens who sleep less are more likely to report symptoms of depression" (Williams, 2021, p. 45).

**References page:** Williams, A. (2021). *The Science of Teen Sleep.* TeenHealth Publishing.
]]

--

.font85[**For online sources, never paste a bare link &amp;mdash; include full source info:**]

.pull-left[
.content-box-red[
**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> Not this**
