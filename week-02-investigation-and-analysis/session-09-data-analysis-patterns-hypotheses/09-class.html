### Why Jupyter in This Class?

.pull-left[.font85[
- Jupyter implements the **literate programming paradigm**: code, output, and narrative coexist in one document &amp;mdash; making analysis self-documenting and reproducible. Required by many research journals and data competitions.

- To add a text cell in Jupyter, switch the cell to **"Markdown" mode** and you can write descriptions in plain English (and even include math or images).

- Markdown supports LaTeX math, hyperlinks, images, and tables &amp;mdash; a single `.ipynb` file can contain a complete analysis from data loading to conclusions, shareable as a PDF or web page.
]]

### What is Pandas?

.font85[
.content-box-blue[
**pandas** is the standard Python library for tabular data &amp;mdash; built on NumPy arrays for speed. The primary data structure (DataFrame) was inspired by R's `data.frame`.
]

**Core EDA workflow:** load &amp;rarr; inspect dtypes &amp;rarr; clean &amp;rarr; transform &amp;rarr; aggregate &amp;rarr; visualize. pandas handles every step. Most real-world datasets live in DataFrames first.

**Main data structures:**

- **Series:** 1D labeled array. Each column of a DataFrame is a Series. Supports vectorized operations &amp;mdash; no loops needed.

- **DataFrame:** 2D labeled table with a row index and named columns. Think SQL table or Excel sheet &amp;mdash; with the full power of Python.
]

### Step 4: Question 1

.font90[We use the `mean` function for average and the `median` function for the median value. You can simply get the mean by `df["mpg"].mean()`, but the below code produces nicer output:]

```python
avg_mpg = df["mpg"].mean()
median_mpg = df["mpg"].median()
print(f"Average MPG = {avg_mpg:.2f}")
print(f"Median MPG = {median_mpg:.2f}")
```

.font90[*f-string formatting prints the values with 2 decimal places (`:.2f`).*]

--

&lt;img src="09-class_files/figure-html/img41-1.png" alt="" width="70%" style="display: block; margin: auto;" /&gt;

.font80[Mean MPG = 21.30, Median MPG = 20.00. **The mean exceeds the median &amp;mdash; a signature of right skew.** A few high-MPG cars pull the mean upward. The median is the better "typical" value here. *This is why we always compute both.*]

### Histogram of MPG in Python

.pull-left[
```python

         color='skyblue',
         edgecolor='black')

.font80[

- `color='skyblue', edgecolor='black'` styles the bars (similar to R).
- `plt.title`, `plt.xlabel`, `plt.ylabel`: add title and axis labels as in R.
- `plt.show()` displays the plot &amp;mdash; good practice, especially in scripts.
]

### Histogram &amp;mdash; Interpretation

.pull-left[.font75[
- This histogram shows MPG **distribution shape** &amp;mdash; each bar is a bin (value range), height is count. Shape tells you things no single statistic can: skewness, clusters, gaps, outliers.

- This is **right-skewed** &amp;mdash; the right tail is longer. Mean (21.3) &amp;gt; Median (20.0) &amp;mdash; a classic signature. A few fuel-efficient imports pull the mean upward.

- The **mode bin is 15&amp;ndash;20 MPG**. Ask: would you have predicted this shape from the mean alone? This is why visualization precedes modeling.

- **Try `bins=5` vs `bins=20`.** Fewer bins over-smooth; too many bins show noise. The choice of bins is an analytical decision, not a technical one.
]]

### R vs. Python: Syntax Comparison

.font80[

| Task | R Syntax | Python (pandas) Syntax |
|------|----------|------------------------|
| Reading data | `read.csv("file.csv")` | `pd.read_csv("file.csv")` |
| Viewing data | `head(df)` | `df.head()` |
| Summary stats | `summary(df)` | `df.describe()` |
| Accessing column | `df$col` | `df["col"]` |
| Mean of column | `mean(df$col)` | `df["col"].mean()` |
| Frequency count | `table(df$col)` | `df["col"].value_counts()` |
| Installing packages | `install.packages("pkg")` | `pip install pkg` (in terminal) |
| Call package from library | `library(pkg)` | `import pkg` |

]

### Python + Coding Agent: EDA Workflow

.font80[An agent can execute your entire EDA pipeline &amp;mdash; **but only if you give it precise, analytical instructions**:]

.pull-left[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> Weak**

"Analyze the data."

&amp;rarr; Agent produces arbitrary outputs with no analytical focus.
]
]

.pull-right[
.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Strong**

"Load car_data.csv. Run `df.shape`, `df.dtypes`, `df.describe()`, and `df.isnull().sum()`. Report any columns with null values or dtypes that look wrong. Then compute mean and median for all numerical columns and flag where they differ by more than 10%."
]
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.font75[
**The 4-step agent loop for EDA:** (1) You set the analytical question. (2) Agent writes and runs pandas code. (3) You evaluate the output &amp;mdash; does it answer the question? Are dtypes right? Is the sample size expected? (4) You iterate with follow-up questions.

**Key risk:** agents confidently produce wrong code. Always cross-check &amp;mdash; `df.shape` should match the expected row count, `df.describe()` min/max should be physically plausible.
]

### Seaborn: Statistical Visualization in Python

.font85[
**Why seaborn over matplotlib for statistical plots:** matplotlib is imperative (you specify every detail). **seaborn** is declarative &amp;mdash; built on matplotlib, it generates statistically-informed plots in one line.

**Key seaborn functions for EDA:**

```python
sns.histplot(df, x="mpg", kde=True)               # histogram + KDE overlay
sns.boxplot(df, x="foreign", y="price")           # compare distributions across groups
sns.scatterplot(df, x="weight", y="mpg", hue="foreign")  # scatter colored by category
sns.heatmap(df.corr(), annot=True)                # correlation matrix at once
```
]

### Chapter 4: What You Can Do Now

.font75[
**Python environment:**

- Set up Jupyter (Anaconda or Google Colab) and run the 5-step EDA workflow from import to visualization.

**Data analysis in Python:**

- Load CSV with `pd.read_csv()`. Audit with `df.shape`, `df.dtypes`, `df.describe()`, `df.isnull().sum()`. Flag mismatches before computing statistics.
- Compute mean, median, std, IQR, `value_counts()`, and `groupby()` aggregations. Interpret when mean and median diverge and why.
- Create matplotlib histograms, bar charts, and scatter plots. Generate seaborn statistical plots (histplot with KDE, boxplot, heatmap).

**Bilingual data science:**

- Map equivalent operations between R and Python (`summary()` &amp;harr; `describe()`, `$` &amp;harr; `df["col"]`, `tapply()` &amp;harr; `groupby()`). Know when to use each language.
- Direct a coding agent to perform full EDA in Python, evaluate its outputs critically, and iterate with precise analytical follow-up prompts.
