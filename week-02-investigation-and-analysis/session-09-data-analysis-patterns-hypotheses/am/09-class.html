### Welcome to Day 9!

.pull-left[.font90[
Today you turn your dataset into **findings** &amp;mdash; patterns, relationships, and honest conclusions.

By the end of the day you will be able to:

- Apply **descriptive and basic inferential** statistics to your research question
- Identify **patterns, relationships, and outliers** in data
- Understand what **"supporting a hypothesis"** does &amp;mdash; and does **not** &amp;mdash; mean
- Connect results back to your **literature review**
]]

### Results vs. Interpretation <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:0.8em;width:0.8em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#fff;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 1 48 256a208 208 0 1 1 416 0zM0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM232 120V256c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2V120c0-13.3-10.7-24-24-24s-24 10.7-24 24z"/></svg> 20 min

.font90[The single most important distinction in writing up research:]

.pull-left[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zm-312 8v64c0 13.3 10.7 24 24 24s24-10.7 24-24l0-64c0-13.3-10.7-24-24-24s-24 10.7-24 24zm80-96V280c0 13.3 10.7 24 24 24s24-10.7 24-24V120c0-13.3-10.7-24-24-24s-24 10.7-24 24zm80 64v96c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24s-24 10.7-24 24z"/></svg> Results &amp;mdash; *"The data showed X."***

What you **observed**. Neutral, factual, numeric. Lives in the **Results** section.
]
]

.pull-right[
.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M297.2 248.9C311.6 228.3 320 203.2 320 176c0-70.7-57.3-128-128-128S64 105.3 64 176c0 27.2 8.4 52.3 22.8 72.9c3.7 5.3 8.1 11.3 12.8 17.7l0 0c12.9 17.7 28.3 38.9 39.8 59.8c10.4 19 15.7 38.8 18.3 57.5H109c-2.2-12-5.9-23.7-11.8-34.5c-9.9-18-22.2-34.9-34.5-51.8l0 0 0 0c-5.2-7.1-10.4-14.2-15.4-21.4C27.6 247.9 16 213.3 16 176C16 78.8 94.8 0 192 0s176 78.8 176 176c0 37.3-11.6 71.9-31.4 100.3c-5 7.2-10.2 14.3-15.4 21.4l0 0 0 0c-12.3 16.8-24.6 33.7-34.5 51.8c-5.9 10.8-9.6 22.5-11.8 34.5H226.4c2.6-18.7 7.9-38.6 18.3-57.5c11.5-20.9 26.9-42.1 39.8-59.8l0 0 0 0 0 0c4.7-6.4 9-12.4 12.7-17.7zM192 128c-26.5 0-48 21.5-48 48c0 8.8-7.2 16-16 16s-16-7.2-16-16c0-44.2 35.8-80 80-80c8.8 0 16 7.2 16 16s-7.2 16-16 16zm0 384c-44.2 0-80-35.8-80-80V416H272v16c0 44.2-35.8 80-80 80z"/></svg> Interpretation &amp;mdash; *"This means Y."***

What you **think it means**. Connects to theory and your literature. Lives in the **Discussion**.
]
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.content-box-yellow[
.font90[**Keep them separate.** Report the facts first; *then* argue what they mean. Mixing the two is the most common mistake in student research writing.]
]

### Practice: Fact or Interpretation?

.content-box-blue[
For each statement, decide: is it a **result** (fact) or an **interpretation** (discussion)?
]

.font90[
1. *"62% of surveyed students reported fewer than 7 hours of sleep."*
2. *"Students are exhausted because they spend too much time on social media."*
3. *"Average daily screen time was 4.2 hours, and mean sleep was 6.4 hours."*
]

--

.font90[
1. <svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> **Result** &amp;mdash; a measured fact.

### Outliers: Values That Stand Out

.pull-left[.font85[
.content-box-blue[
**What are they?** Data points much **higher or lower** than most others.
]
.content-box-yellow[
**Why they matter:** they strongly pull the **mean**, but have little effect on the **median**.
]
.content-box-green[
**Handle with care:** investigate **why** an outlier exists before deciding whether to keep or drop it.
]
]]

&lt;img src="assets/09-outliers.png" style="width:72%; max-height:430px; object-fit:cover; border-radius:6px;"&gt;
]

### Descriptive Example: Quiz Scores

.pull-left[.font90[
**Dataset:** `{4, 7, 8, 9, 9, 10, 10, 10}`

Compute each by hand:

- Mean = ?
- Median = ?
- Mode = ?
- Range = ?
- Possible outlier = ?
]]

--

.pull-right[.font90[
.content-box-green[
- **Mean = 8.375**
- **Median = 9**
- **Mode = 10**
- **Range = 6**
- **Possible outlier = 4**
]

.font80[Half the class scored 9+; the most common score was a perfect 10; one student (the **4**) struggled far more than the rest &amp;mdash; that's the outlier pulling the mean below the median.]
]]

.pull-left[

.font90[**Things happening together does not mean one causes the other.** Proving causation usually requires a **controlled experiment**.]

### Spurious Correlations: Coincidence, Not Cause

.pull-left[.font85[
.content-box-blue[
**Ice cream &amp;amp; shark attacks** &amp;mdash; both rise in summer, but ice cream doesn't attract sharks.
]
.content-box-blue[
**Backpack weight &amp;amp; math scores** &amp;mdash; correlated through *grade level*, not because heavy bags teach math.
]
.content-box-yellow[
**Hidden variable:** often a **third factor** (hot weather, age, study habits) drives *both* variables.
]
]]

]

### How Do We Establish Causation?

.pull-left[
&lt;img src="assets/09-causation.png" style="width:88%; max-height:440px; object-fit:cover; border-radius:6px;"&gt;
]

.pull-right[.font85[
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;1&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Controlled experiments&lt;/strong&gt; &amp;mdash; randomly assign subjects to treatment vs. control, holding everything else constant.&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;2&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Critical thinking&lt;/strong&gt; &amp;mdash; is there a logical reason X could influence Y?&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;3&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Reverse causation&lt;/strong&gt; &amp;mdash; could Y actually be causing X?&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;4&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Third factors&lt;/strong&gt; &amp;mdash; could something else drive both?&lt;/div&gt;&lt;/div&gt;
]]

### When *Can* We Make Causal Claims?

.pull-left[.font85[
.content-box-blue[
**The gold standard:** a **randomized experiment**. Random assignment makes the groups comparable, so a difference in outcomes can be credited to the treatment.
]
.content-box-green[
**But observational studies still matter.** When experiments are impossible or unethical, careful design and repeated evidence can still build a strong causal case.
]
]]

.pull-right[.font85[
.content-box-yellow[
