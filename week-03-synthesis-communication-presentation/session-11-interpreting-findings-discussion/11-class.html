### What is "Dirty Data"?

.pull-left[.font90[
.content-box-yellow[
**Dirty data:** data with errors or quality problems that can mislead analysis.
]

Like a detective with bad evidence, a researcher can be misled by faulty data.

**Common issues include:**

- Incorrect or missing values
- Duplicate entries
- Inconsistent formatting
- Outliers or impossible values
]]

### Missing Data

.pull-left[.font75[
- **Missing data** = blank or null entries where info wasn't recorded.

- **Three types of missingness:** **MCAR** (Missing Completely At Random &amp;mdash; safe to ignore or impute), **MAR** (depends on observed data &amp;mdash; imputation can work), **MNAR** (missingness predicts itself &amp;mdash; the most dangerous; biases results systematically).

- Happens often in real life &amp;mdash; people skip survey questions or sensors glitch.

- Many analysis methods can't handle missing values automatically. Too much missing data can bias results.

- **MNAR example:** sicker patients drop out of a drug trial, making remaining data look healthier than reality. *Always ask: is there a pattern to what is missing?*

- **Detection in pandas:** `df.isnull().sum()` per column, `df.isnull().mean()` for rate. Visualize with `sns.heatmap(df.isnull(), cbar=False)`.
]]

# Strategies for Cleaning Data &lt;svg viewBox="0 0 640 512" style="height:1em;display:inline-block;position:fixed;top:10;right:10;" xmlns="http://www.w3.org/2000/svg"&gt;  &lt;path d="M256.47 216.77l86.73 109.18s-16.6 102.36-76.57 150.12C206.66 523.85 0 510.19 0 510.19s3.8-23.14 11-55.43l94.62-112.17c3.97-4.7-.87-11.62-6.65-9.5l-60.4 22.09c14.44-41.66 32.72-80.04 54.6-97.47 59.97-47.76 163.3-40.94 163.3-40.94zM636.53 31.03l-19.86-25c-5.49-6.9-15.52-8.05-22.41-2.56l-232.48 177.8-34.14-42.97c-5.09-6.41-15.14-5.21-18.59 2.21l-25.33 54.55 86.73 109.18 58.8-12.45c8-1.69 11.42-11.2 6.34-17.6l-34.09-42.92 232.48-177.8c6.89-5.48 8.04-15.53 2.55-22.44z"&gt;&lt;/path&gt;&lt;/svg&gt;

---
### Data Validation

.font80[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Define Acceptable Ranges&lt;/strong&gt;&lt;br&gt;
  Define a schema for each column: dtype (int64, float64, object, datetime), valid range (0&amp;le;GPA&amp;le;4.0), allowed categories (["M","F","Non-binary"]), and nullable (True/False). A data dictionary is the source of truth.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Check Categories&lt;/strong&gt;&lt;br&gt;
  Schema validation in pandas: use &lt;code&gt;pd.api.types.is_numeric_dtype()&lt;/code&gt; and &lt;code&gt;df["col"].isin(valid_set)&lt;/code&gt;. For production pipelines, libraries like Great Expectations automate schema checks across thousands of rows.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Verify Required Fields&lt;/strong&gt;&lt;br&gt;
  Flag any missing values in essential columns.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Look for Logical Consistency&lt;/strong&gt;&lt;br&gt;
  Cross-field consistency checks: if Birth_Year=2005 and Grade=11, these are consistent. Use assertions in code to catch violations before they propagate into analysis.&lt;/div&gt;
&lt;/div&gt;
]

---
### Finding Problems Systematically

.pull-left[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg> Count Missing Values**
`df.isnull().sum()` for counts; `df.isnull().mean().round(2)` for rates. Flag columns with &amp;gt;5% missing &amp;mdash; they need a strategy decision (impute, drop, or document).

**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M384 336H192c-8.8 0-16-7.2-16-16V64c0-8.8 7.2-16 16-16l140.1 0L400 115.9V320c0 8.8-7.2 16-16 16zM192 384H384c35.3 0 64-28.7 64-64V115.9c0-12.7-5.1-24.9-14.1-33.9L366.1 14.1c-9-9-21.2-14.1-33.9-14.1H192c-35.3 0-64 28.7-64 64V320c0 35.3 28.7 64 64 64zM64 128c-35.3 0-64 28.7-64 64V448c0 35.3 28.7 64 64 64H256c35.3 0 64-28.7 64-64V416H272v32c0 8.8-7.2 16-16 16H64c-8.8 0-16-7.2-16-16V192c0-8.8 7.2-16 16-16H96V128H64z"/></svg> Sort to Find Duplicates**
`df.duplicated().sum()` for count; `df[df.duplicated(keep=False)]` to see all duplicate rows. Are full-row duplicates errors, or is a duplicate Student_ID with different scores a merge issue?

**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M64 0C28.7 0 0 28.7 0 64V448c0 35.3 28.7 64 64 64H320c35.3 0 64-28.7 64-64V64c0-35.3-28.7-64-64-64H64zM96 64H288c17.7 0 32 14.3 32 32v32c0 17.7-14.3 32-32 32H96c-17.7 0-32-14.3-32-32V96c0-17.7 14.3-32 32-32zm32 160a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zM96 352a32 32 0 1 1 0-64 32 32 0 1 1 0 64zM64 416c0-17.7 14.3-32 32-32h96c17.7 0 32 14.3 32 32s-14.3 32-32 32H96c-17.7 0-32-14.3-32-32zM192 256a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm32 64a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zm64-64a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm32 64a32 32 0 1 1 -64 0 32 32 0 1 1 64 0zM288 448a32 32 0 1 1 0-64 32 32 0 1 1 0 64z"/></svg> Calculate Basic Stats**
`df.describe()` for all numerics at once. Then apply domain knowledge: Age_max=150 is impossible; Score_min=-5 is invalid; GPA_max=5.0 could be a different scale.

**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M40 48C26.7 48 16 58.7 16 72v48c0 13.3 10.7 24 24 24H88c13.3 0 24-10.7 24-24V72c0-13.3-10.7-24-24-24H40zM192 64c-17.7 0-32 14.3-32 32s14.3 32 32 32H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H192zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H192zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H192zM16 232v48c0 13.3 10.7 24 24 24H88c13.3 0 24-10.7 24-24V232c0-13.3-10.7-24-24-24H40c-13.3 0-24 10.7-24 24zM40 368c-13.3 0-24 10.7-24 24v48c0 13.3 10.7 24 24 24H88c13.3 0 24-10.7 24-24V392c0-13.3-10.7-24-24-24H40z"/></svg> List Unique Values**
`df["col"].value_counts()` shows all category frequencies. A yes/no field showing 6 unique values has inconsistencies. Always inspect categoricals before any groupby.
]]

### Handling Missing Data

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Remove rows&lt;/strong&gt; with missing values &amp;mdash; safe only when missingness is MCAR and the affected rows are few.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Impute values&lt;/strong&gt; &amp;mdash; fill with the mean, median, or mode of the column. Median is safer when the data is skewed.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Leave as missing&lt;/strong&gt; &amp;mdash; keep NA and use analysis methods that tolerate it; sometimes the honest choice.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Document the decision&lt;/strong&gt; &amp;mdash; whichever strategy you choose, record what was missing and how you handled it.&lt;/div&gt;
&lt;/div&gt;

---
### Handling Outliers

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Verify first&lt;/strong&gt; &amp;mdash; trace the value back to its source. Is it a typo, a unit error, or real?&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Fix obvious errors&lt;/strong&gt; &amp;mdash; if Age=150 should clearly be 15, correct it and log the change.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Remove or set missing&lt;/strong&gt; &amp;mdash; when the true value can't be recovered, set it to NA and document why.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Keep legitimate extremes&lt;/strong&gt; &amp;mdash; a genuine exceptional value stays in, with a note; consider reporting the median alongside the mean.&lt;/div&gt;
&lt;/div&gt;

---
### Correcting Inconsistencies

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Standardize case&lt;/strong&gt; &amp;mdash; convert text to a single case (&lt;code&gt;.str.lower()&lt;/code&gt; / &lt;code&gt;toupper()&lt;/code&gt;) so "Yes", "yes", and "YES" match.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Strip stray spaces&lt;/strong&gt; &amp;mdash; remove leading/trailing whitespace (&lt;code&gt;.str.strip()&lt;/code&gt; / &lt;code&gt;trimws()&lt;/code&gt;).&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Unify category labels&lt;/strong&gt; &amp;mdash; map variants to one standard ("M", "male" &amp;rarr; "Male"); re-check with &lt;code&gt;value_counts()&lt;/code&gt; / &lt;code&gt;table()&lt;/code&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Convert formats and units&lt;/strong&gt; &amp;mdash; one date format, one unit of measurement, numbers stored as numbers.&lt;/div&gt;
&lt;/div&gt;

### Removing Duplicates

.pull-left[.font90[
.content-box-blue[

Find records that match completely across all fields.

.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M369.8 37.4c14.7 9.8 18.7 29.7 8.9 44.4L337.1 144H400c17.7 0 32 14.3 32 32s-14.3 32-32 32H294.5l-64 96H400c17.7 0 32 14.3 32 32s-14.3 32-32 32H187.8l-65.2 97.7c-9.8 14.7-29.7 18.7-44.4 8.9s-18.7-29.7-8.9-44.4L110.9 368H48c-17.7 0-32-14.3-32-32s14.3-32 32-32H153.5l64-96H48c-17.7 0-32-14.3-32-32s14.3-32 32-32H260.2l65.2-97.7c9.8-14.7 29.7-18.7 44.4-8.9z"/></svg> Check for Partial Duplicates**

Look for records that match on key fields but differ slightly in others.

.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Decide Which to Keep**

For partial duplicates, determine which record is more complete or accurate.
]

### Test Your Cleaned Data

.pull-left[.font90[

### Create Your Messy Data!

.font90[This code calls the pandas package and creates a data frame where **Bob's score is missing** and **Ed is sooo old**!]

```python
import pandas as pd
data = {
    'Name': ['Alice', 'Bob', 'Charlie', 'Dana', 'Ed'],
    'Age': [17, 16, 15, 18, 150],
    'Grade': [11, 11, 10, 12, 11],
    'Score': [90, None, 85, 88, 95]
}
df = pd.DataFrame(data)
print("Raw data:")
print(df)
```

### Check Outliers

.font85[**Three detection methods:** (1) domain threshold (Age&amp;gt;100), (2) IQR rule: flag if value &amp;lt; Q1&amp;minus;1.5&amp;times;IQR or &amp;gt; Q3+1.5&amp;times;IQR (robust to skew), (3) z-score: |z|&amp;gt;3 (best for normal distributions). Here we use a **domain threshold**:]

```python
# Identify outliers in Age (say anything &gt; 100 is suspicious)
outliers = df[df['Age'] &gt; 100]
print("\nOutliers in Age:")
print(outliers)
```

--

&lt;img src="11-class_files/figure-html/img34-1.png" alt="" width="55%" style="display: block; margin: auto;" /&gt;

---
### Let's Clean

.font90[Fill Bob's Score with the **mean of the other scores**:]

```python
# Fill missing Score with mean of existing scores
mean_score = df['Score'].mean(skipna=True)  # skipna ignores NaN
df.fillna({'Score': mean_score}, inplace=True)
```

--

&lt;img src="11-class_files/figure-html/img35-1.png" alt="" width="55%" style="display: block; margin: auto;" /&gt;

---
### Let's Clean 2

.font90[All the scores are integers &amp;mdash; let's convert Bob's 89.5 to an integer for consistency:]

```python
df['Score'] = df['Score'].round(0).astype('Int64')
# round and make integer (pandas Int64 type allows NA if any)
print("\nAfter rounding Bob's score:")
print(df)
```

--

&lt;img src="11-class_files/figure-html/img36-1.png" alt="" width="55%" style="display: block; margin: auto;" /&gt;

---
### Let's Clean 3

.font90[This replaces all Age values higher than 100 with 15 (assuming it's a typo):]

```python
# Fix outlier Age (assume it's a typo and should be 15)
df.loc[df['Age'] &gt; 100, 'Age'] = 15

print("\nCleaned data:")
print(df)
```

### Create the Data in R

```r
# Create the data.frame
df &lt;- data.frame(
  Name  = c("Alice", "Bob", "Charlie", "Dana", "Ed"),
  Age   = c(17, 16, 15, 18, 150),
  Grade = c(11, 11, 10, 12, 11),
  Score = c(90, NA, 85, 88, 95),      # use NA for missing
  stringsAsFactors = FALSE            # keep character columns as character
)

# Print it out
cat("Raw data:\n")
print(df)
```

---
### Missing and Outlier in R

.font90[In R, the `is.na` function finds the missing values. Here is how to impute the mean for missing values and replace ages over 100 with 15:]

```r
df$Score[is.na(df$Score)] &lt;- mean(df$Score, na.rm=TRUE)
df$Age[df$Age &gt; 100] &lt;- 15
```

---
### Key Cleaning Functions / Techniques (Summary)

.font80[

| Task | Python (pandas) | R |
|------|-----------------|---|
| Find missing values | `df.isna().sum()` | `is.na(df)` / `colSums(is.na(df))` |
| Fill missing values | `df.fillna(value)` | `df$col[is.na(df$col)] &lt;- value` |
| Mean ignoring NA | `df["col"].mean(skipna=True)` | `mean(x, na.rm=TRUE)` |
| Find duplicates | `df.duplicated().sum()` | `sum(duplicated(df))` |
| Remove duplicates | `df.drop_duplicates()` | `df[!duplicated(df), ]` |
| Replace values | `df.replace(old, new)` | `gsub()` / direct assignment |
| Strip spaces | `df["col"].str.strip()` | `trimws(x)` |
| Normalize case | `df["col"].str.upper()` | `toupper(x)` |
| Unique values | `df["col"].value_counts()` | `table(x)` / `unique(x)` |

]

### Consequences of Dirty Data

.pull-left[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm306.7 69.1L162.4 380.6c-19.4 7.5-38.5-11.6-31-31l55.5-144.3c3.3-8.5 9.9-15.1 18.4-18.4l144.3-55.5c19.4-7.5 38.5 11.6 31 31L325.1 306.7c-3.2 8.5-9.9 15.1-18.4 18.4zM288 256a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> Misguided Decisions**
Real case: a software company's churn model trained on duplicate customer records predicted 40% lower churn &amp;mdash; overprovisioning servers by $2M annually before the duplication was caught.

**<svg aria-hidden="true" role="img" viewBox="0 0 576 512" style="height:1em;width:1.12em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M0 64C0 28.7 28.7 0 64 0H224V128c0 17.7 14.3 32 32 32H384v38.6C310.1 219.5 256 287.4 256 368c0 59.1 29.1 111.3 73.7 143.3c-3.2 .5-6.4 .7-9.7 .7H64c-35.3 0-64-28.7-64-64V64zm384 64H256V0L384 128zm48 96a144 144 0 1 1 0 288 144 144 0 1 1 0-288zm59.3 107.3c6.2-6.2 6.2-16.4 0-22.6s-16.4-6.2-22.6 0L432 345.4l-36.7-36.7c-6.2-6.2-16.4-6.2-22.6 0s-6.2 16.4 0 22.6L409.4 368l-36.7 36.7c-6.2 6.2-6.2 16.4 0 22.6s16.4 6.2 22.6 0L432 390.6l36.7 36.7c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6L454.6 368l36.7-36.7z"/></svg> Erroneous Research**
Reinhart-Rogoff (2013): a landmark economics paper cited by governments worldwide to justify austerity was based on a spreadsheet that excluded certain country-years from a key calculation. A grad student found the error. Policy was already enacted.

**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M119.4 44.1c23.3-3.9 46.8-1.9 68.6 5.3l49.8 77.5-75.4 75.4c-1.5 1.5-2.4 3.6-2.3 5.8s1 4.2 2.6 5.7l112 104c2.9 2.7 7.4 2.9 10.5 .3s3.8-7 1.7-10.4l-60.4-98.1 90.7-75.6c2.6-2.1 3.5-5.7 2.4-8.8L296.8 61.8c28.5-16.7 62.4-23.2 95.7-17.6C461.5 55.6 512 115.2 512 185.1v5.8c0 41.5-17.2 81.2-47.6 109.5L283.7 469.1c-7.5 7-17.4 10.9-27.7 10.9s-20.2-3.9-27.7-10.9L47.6 300.4C17.2 272.1 0 232.4 0 190.9v-5.8c0-69.9 50.5-129.5 119.4-141z"/></svg> Loss of Trust**
The credibility multiplier: one discovered error makes everyone doubt the entire analysis. Clean data builds trust; dirty data destroys it &amp;mdash; and the destruction is asymmetric.

**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 1 48 256a208 208 0 1 1 416 0zM0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM232 120V256c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2V120c0-13.3-10.7-24-24-24s-24 10.7-24 24z"/></svg> Wasted Effort**
Redoing analysis after discovering data issues wastes valuable time.

### Professional Data Cleaning Terms

.pull-left[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M249.4 25.4c12.5-12.5 32.8-12.5 45.3 0s12.5 32.8 0 45.3L269.3 96 416 96c53 0 96 43 96 96v32c0 17.7-14.3 32-32 32s-32-14.3-32-32V192c0-17.7-14.3-32-32-32l-146.7 0 25.4 25.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0l-80-80c-12.5-12.5-12.5-32.8 0-45.3l80-80zm13.3 256l80 80c12.5 12.5 12.5 32.8 0 45.3l-80 80c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 416 96 416c-17.7 0-32 14.3-32 32v32c0 17.7-14.3 32-32 32s-32-14.3-32-32V448c0-53 43-96 96-96l146.7 0-25.4-25.4c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0zM384 384a64 64 0 1 1 128 0 64 64 0 1 1 -128 0zM64 192A64 64 0 1 1 64 64a64 64 0 1 1 0 128z"/></svg> ETL**
Extract, Transform, Load &amp;mdash; the pipeline that moves data from source systems (databases, APIs) through cleaning and transformation into analytical stores. A broken ETL job is often the root cause of data quality incidents.

**<svg aria-hidden="true" role="img" viewBox="0 0 576 512" style="height:1em;width:1.12em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M566.6 54.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-192 192-34.7-34.7c-4.2-4.2-10-6.6-16-6.6c-12.5 0-22.6 10.1-22.6 22.6v29.1L364.3 320h29.1c12.5 0 22.6-10.1 22.6-22.6c0-6-2.4-11.8-6.6-16l-34.7-34.7 192-192zM341.1 353.4L222.6 234.9c-42.7-3.7-85.2 11.7-115.8 42.3l-8 8C76.5 307.5 64 337.7 64 369.2c0 6.8 7.1 11.2 13.2 8.2l51.1-25.5c5-2.5 9.5 4.1 5.4 7.9L7.3 473.4C2.7 477.6 0 483.6 0 489.9C0 502.1 9.9 512 22.1 512l173.3 0c38.8 0 75.9-15.4 103.4-42.8c30.6-30.6 45.9-73.1 42.3-115.8z"/></svg> Data Wrangling**
Informal term for the hands-on work of cleaning &amp;mdash; filtering, reshaping, joining, and transforming raw data until it's fit for analysis. In Python: pandas; in R: dplyr/tidyr.

**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zm-312 8v64c0 13.3 10.7 24 24 24s24-10.7 24-24l0-64c0-13.3-10.7-24-24-24s-24 10.7-24 24zm80-96V280c0 13.3 10.7 24 24 24s24-10.7 24-24V120c0-13.3-10.7-24-24-24s-24 10.7-24 24zm80 64v96c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24s-24 10.7-24 24z"/></svg> Data Profiling**
Systematic examination of a dataset to understand structure (schemas, dtypes), content (distributions, frequency tables), and quality (missing rates, outliers). *Always the first step before cleaning.*

### When You Write a Report

.pull-left[.font85[
**Explain the cleaning process.** Such as:

.content-box-blue[
*"After cleaning the data, we found and corrected 5 data entry errors and filled 3% missing values using domain-appropriate methods. The cleaned dataset of 500 responses was then analyzed..."*
]

**Professional standard &amp;mdash; always report:**

1. Raw dataset dimensions
2. Final cleaned dimensions
3. What was removed and why
4. How missing values were handled (method and imputed count)
5. Any assumptions made

*Omitting this is a reproducibility failure.*
]]

### Automated Outlier Detection with a Coding Agent

.font85[**Ask for all three outlier detection methods simultaneously:**]

.content-box-blue[
.font80["For each numerical column in the dataset, apply three outlier detection methods: (1) domain threshold (flag Age&amp;gt;100, GPA&amp;gt;4.0, Height_in&amp;lt;40 or &amp;gt;90), (2) IQR rule (Q1&amp;minus;1.5&amp;times;IQR, Q3+1.5&amp;times;IQR), and (3) z-score |z|&amp;gt;3. For each flagged value, print the row, the column, and which method(s) flagged it."]
]

.font80[
- The agent will produce a table of suspicious values across all methods. **Your job:** evaluate each one using domain knowledge. Is Age=150 a typo or a data entry error? Is Height_in=25 an infant or a measurement error?

- **The critical question you must answer (not the agent):** for each outlier &amp;mdash; is it a *data error* (fix it), a *legitimate extreme value* (keep it and note it), or *ambiguous* (make it missing and document the decision)?
]

--

.content-box-green[
.font85[**Pro tip:** ask the agent to plot a box plot and histogram for each flagged column. Visual confirmation prevents you from acting on a false positive from a single detection method.]
]
