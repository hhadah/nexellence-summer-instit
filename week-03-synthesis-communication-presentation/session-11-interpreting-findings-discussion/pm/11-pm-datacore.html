.pull-left[
.font90[

&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;1&lt;/div&gt;&lt;div class="chev-text"&gt;Re-run your main analysis on a &lt;strong&gt;subset&lt;/strong&gt; of the data &amp;mdash; one year, one region, one group.&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;2&lt;/div&gt;&lt;div class="chev-text"&gt;&lt;strong&gt;Does the result hold?&lt;/strong&gt; Same direction, similar size?&lt;/div&gt;&lt;/div&gt;
&lt;div class="chev-row-sm"&gt;&lt;div class="chev-sm"&gt;3&lt;/div&gt;&lt;div class="chev-text"&gt;Report what you find &amp;mdash; either way it makes you stronger.&lt;/div&gt;&lt;/div&gt;
]

print(f"experience coef (all regions) = {full.params['experience_years']:.3f}")

### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M418.4 157.9c35.3-8.3 61.6-40 61.6-77.9c0-44.2-35.8-80-80-80c-43.4 0-78.7 34.5-80 77.5L136.2 151.1C121.7 136.8 101.9 128 80 128c-44.2 0-80 35.8-80 80s35.8 80 80 80c12.2 0 23.8-2.7 34.1-7.6L259.7 407.8c-2.4 7.6-3.7 15.8-3.7 24.2c0 44.2 35.8 80 80 80s80-35.8 80-80c0-27.7-14-52.1-35.4-66.4l37.8-207.7zM156.3 232.2c2.2-6.9 3.5-14.2 3.7-21.7l183.8-73.5c3.6 3.5 7.4 6.7 11.6 9.5L317.6 354.1c-5.5 1.3-10.8 3.1-15.8 5.5L156.3 232.2z"/></svg> `px.scatter()` with hover details

.pull-left[
.font85[Point-level detail appears on **hover** via `hover_data`:]

``` python
import plotly.express as px
fig = px.scatter(
    wages, x="experience_years", y="hourly_wage",
    color="gender",       # color by group
    hover_data=["education", "region"],   # hover info
    labels={"experience_years": "Experience (yrs)",
            "hourly_wage": "Hourly wage ($)"},
    title="Experience vs. wage")
