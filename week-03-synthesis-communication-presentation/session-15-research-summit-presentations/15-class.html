.font85[

  &lt;div class="chev-step"&gt;

    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 576 512" style="height:1.6em;width:1.8em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M48 115.8C38.2 107 32 94.2 32 80c0-26.5 21.5-48 48-48c14.2 0 27 6.2 35.8 16H460.2c8.8-9.8 21.6-16 35.8-16c26.5 0 48 21.5 48 48c0 14.2-6.2 27-16 35.8V396.2c9.8 8.8 16 21.6 16 35.8c0 26.5-21.5 48-48 48c-14.2 0-27-6.2-35.8-16H115.8c-8.8 9.8-21.6 16-35.8 16c-26.5 0-48-21.5-48-48c0-14.2 6.2-27 16-35.8V115.8zM125.3 96c-4.8 13.6-15.6 24.4-29.3 29.3V386.7c13.6 4.8 24.4 15.6 29.3 29.3H450.7c4.8-13.6 15.6-24.4 29.3-29.3V125.3c-13.6-4.8-24.4-15.6-29.3-29.3H125.3zm2.7 64c0-17.7 14.3-32 32-32H288c17.7 0 32 14.3 32 32v96c0 17.7-14.3 32-32 32H160c-17.7 0-32-14.3-32-32V160zM256 320h32c35.3 0 64-28.7 64-64V224h64c17.7 0 32 14.3 32 32v96c0 17.7-14.3 32-32 32H288c-17.7 0-32-14.3-32-32V320z"/></svg>&lt;/div&gt;

### Correlation vs. Causation &amp;mdash; Important Distinction

.pull-left[.font85[
- Strong correlation (r &amp;asymp; &amp;minus;0.7 between temp and bee counts) is compelling evidence &amp;mdash; but **NOT proof of causation**.

- **Lurking variables** (pesticide use, disease, habitat loss) could explain the pattern. A controlled experiment &amp;mdash; where you manipulate *only* temperature &amp;mdash; would be needed to establish causation.

- The biological mechanism is plausible and consistent, which raises our confidence &amp;mdash; but correlation plus a mechanism still isn't the same as proof. **Always stay honest about what your data can and cannot show.**
]]

### The Most Plausible Explanation

.content-box-green[
.font110[**Extreme heat and dry conditions in early summer are stressing the bee colonies.** High heat can cause bees to stay in the hive to cool it, reducing foraging activity. Drought can reduce food availability.]
]

---
### How Heat Affects Bees

.pull-left[.font90[
**Biological Impacts:**

- Bees must **ventilate hives** when hot
- **Foraging activity decreases**
- **Water needs increase**
- **Nectar production** in flowers decreases

.content-box-blue[
During extreme heat, bees may spend more energy cooling the hive than collecting food &amp;mdash; explaining the observed population decline.
]
]]

.pull-right[
&lt;img src="15-class_files/figure-html/img19-1.png" alt="" width="90%" style="display: block; margin: auto;" /&gt;

### Communicating Your Findings

.pull-left[
.content-box-blue[
A complete data story has four parts:

1. **Introduction** &amp;mdash; the problem and why it matters
2. **Data &amp;amp; Methods** &amp;mdash; what you used and what you did
3. **Findings** &amp;mdash; the key evidence, shown visually
4. **Conclusion** &amp;mdash; the answer and what to do about it
]
]

.pull-right[
&lt;img src="15-class_files/figure-html/img24-1.png" alt="" width="50%" style="display: block; margin: auto;" /&gt;
]

### Sample Introduction

.pull-left[
.content-box-blue[
*"The Case of the Disappearing Bees: Solved! Our community garden has been puzzled by a consistent drop in bee counts during summer months. As data detectives, we investigated this mystery using bee count records and weather data to uncover the likely cause."*
]

.font90[A good introduction **captures attention** and clearly states the problem you're solving. It should also explain **why the issue matters** (bees are important pollinators for the garden).]
]

.pull-right[
&lt;img src="15-class_files/figure-html/img25-1.png" alt="" width="50%" style="display: block; margin: auto;" /&gt;
]

### The Data Detective Process

.font80[
&lt;div class="chev-flow"&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1.6em;width:1.6em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm169.8-90.7c7.9-22.3 29.1-37.3 52.8-37.3h58.3c34.9 0 63.1 28.3 63.1 63.1c0 22.6-12.1 43.5-31.7 54.8L280 264.4c-.2 13-10.9 23.6-24 23.6c-13.3 0-24-10.7-24-24V250.5c0-8.6 4.6-16.5 12.1-20.8l44.3-25.4c4.7-2.7 7.6-7.7 7.6-13.1c0-8.4-6.8-15.1-15.1-15.1H222.6c-3.4 0-6.4 2.1-7.5 5.3l-.4 1.2c-4.4 12.5-18.2 19-30.6 14.6s-19-18.2-14.6-30.6l.4-1.2zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;1. Frame It&lt;/strong&gt;&lt;br&gt;
    Define the question clearly.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1.6em;width:1.6em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M152.1 38.2c9.9 8.9 10.7 24 1.8 33.9l-72 80c-4.4 4.9-10.6 7.8-17.2 7.9s-12.9-2.4-17.6-7L7 113C-2.3 103.6-2.3 88.4 7 79s24.6-9.4 33.9 0l22.1 22.1 55.1-61.2c8.9-9.9 24-10.7 33.9-1.8zm0 160c9.9 8.9 10.7 24 1.8 33.9l-72 80c-4.4 4.9-10.6 7.8-17.2 7.9s-12.9-2.4-17.6-7L7 273c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l22.1 22.1 55.1-61.2c8.9-9.9 24-10.7 33.9-1.8zM224 96c0-17.7 14.3-32 32-32H480c17.7 0 32 14.3 32 32s-14.3 32-32 32H256c-17.7 0-32-14.3-32-32zm0 160c0-17.7 14.3-32 32-32H480c17.7 0 32 14.3 32 32s-14.3 32-32 32H256c-17.7 0-32-14.3-32-32zM160 416c0-17.7 14.3-32 32-32H480c17.7 0 32 14.3 32 32s-14.3 32-32 32H192c-17.7 0-32-14.3-32-32zM48 368a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;2. Plan It&lt;/strong&gt;&lt;br&gt;
    Outline data needs and steps.&lt;/p&gt;

### Example Summary

.content-box-blue[
.font95[*"Our community garden's bees have been mysteriously disappearing during summer months, threatening plant pollination. By analyzing six years of bee counts alongside weather data, we discovered a strong relationship between high temperatures and declining bee populations. The evidence shows that when temperatures exceed 30&amp;deg;C, bee counts drop by about 30%, but recover when conditions improve. We recommend providing shade and water sources for the hives during hot periods to help the bees thrive year-round."*]
]

.font90[This summary concisely covers **the problem, approach, findings, and recommendations** in plain language.]

### A Real Agent Conversation: Bee Mystery EDA

.pull-left[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M304 128a80 80 0 1 0 -160 0 80 80 0 1 0 160 0zM96 128a128 128 0 1 1 256 0A128 128 0 1 1 96 128zM49.3 464H398.7c-8.9-63.3-63.3-112-129-112H178.3c-65.7 0-120.1 48.7-129 112zM0 482.3C0 383.8 79.8 304 178.3 304h91.4C368.2 304 448 383.8 448 482.3c0 16.4-13.3 29.7-29.7 29.7H29.7C13.3 512 0 498.7 0 482.3z"/></svg> Student Prompt**

*"I have a merged dataset called bee_weather with columns: Month, Bee_Count, Max_Temp_C, Total_Rainfall_mm. Using R, create two plots side-by-side: (1) a line chart of Bee_Count over months, and (2) a scatterplot of Max_Temp_C vs Bee_Count with a trend line and the Pearson correlation printed on the plot."*

**Why this is a strong prompt:**

- Names the dataset and all relevant columns
- Specifies the language (R)
- Describes exactly what each chart should show
- Asks for a specific statistic (Pearson's r) on the plot
]]

.pull-right[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M320 0c17.7 0 32 14.3 32 32V96H472c39.8 0 72 32.2 72 72V440c0 39.8-32.2 72-72 72H168c-39.8 0-72-32.2-72-72V168c0-39.8 32.2-72 72-72H288V32c0-17.7 14.3-32 32-32zM208 384c-8.8 0-16 7.2-16 16s7.2 16 16 16h32c8.8 0 16-7.2 16-16s-7.2-16-16-16H208zm96 0c-8.8 0-16 7.2-16 16s7.2 16 16 16h32c8.8 0 16-7.2 16-16s-7.2-16-16-16H304zm96 0c-8.8 0-16 7.2-16 16s7.2 16 16 16h32c8.8 0 16-7.2 16-16s-7.2-16-16-16H400zM264 256a40 40 0 1 0 -80 0 40 40 0 1 0 80 0zm152 40a40 40 0 1 0 0-80 40 40 0 1 0 0 80zM48 224H64V416H48c-26.5 0-48-21.5-48-48V272c0-26.5 21.5-48 48-48zm544 0c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48H576V224h16z"/></svg> Agent's R Code**

```r
library(ggplot2); library(gridExtra)
r_val &lt;- round(cor(bee_weather$Max_Temp_C,
  bee_weather$Bee_Count), 2)
p1 &lt;- ggplot(bee_weather, aes(x=Month,
  y=Bee_Count)) + geom_line() + geom_point()
p2 &lt;- ggplot(bee_weather, aes(x=Max_Temp_C,
  y=Bee_Count)) + geom_point() +
  geom_smooth(method="lm") +
  labs(subtitle=paste("r =", r_val))
grid.arrange(p1, p2, ncol=2)
```

**Your job after running it:**

Read the r value. Does it confirm a strong negative relationship? Write one sentence interpreting it *in context of the bee mystery*.
]]
