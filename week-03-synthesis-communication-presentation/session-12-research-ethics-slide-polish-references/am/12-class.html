### Why Ethics Matters

.pull-left[.font90[
.content-box-yellow[
**Research earns trust only when it is done honestly.** One dishonest study can undo the credibility of an entire field.
]

As a researcher you make promises &amp;mdash; to your participants, your readers, and the people your findings might affect.

**Four pillars we'll return to today:**

- **Attribution** &amp;mdash; credit every source and tool
- **Honesty** &amp;mdash; report what you found, not what you hoped
- **Limitations** &amp;mdash; own what your study can't say
- **Consent** &amp;mdash; respect the people behind the data
]]

.pull-right[.font90[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> The stakes are real**

### Plagiarism &amp; Proper Attribution

.pull-left[.font85[
.content-box-yellow[
**Plagiarism** = using someone's words, ideas, data, or figures without credit &amp;mdash; whether on purpose or by accident.
]

**Give credit for:**
- Direct quotes *and* paraphrased ideas
- Data, tables, and figures you didn't create
- Methods or frameworks you borrowed
]]

.pull-right[.font85[
.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> The safe habit**

When in doubt, cite. A citation never weakens your work &amp;mdash; it shows you know the landscape and stand on solid ground.
]

### AI Ethics &amp;mdash; What Do You Have to Disclose?

.pull-left[.font85[
Using AI tools is allowed &amp;mdash; **hiding it is not.** Major journals (Nature, Science, APA) now require disclosure.

**Disclose:**
- Which AI tools you used
- What you used them *for* (coding, editing, brainstorming)
- That you **verified** the outputs yourself
]]

### Researcher Bias &amp;mdash; and How to Minimize It

.pull-left[.font90[
**Bias** is the pull toward the answer you *want* to find. Everyone has it; good researchers guard against it.

**Common forms:**
- **Confirmation bias** &amp;mdash; noticing only evidence that fits
- **Selection bias** &amp;mdash; a sample that isn't representative
- **Funding/interest bias** &amp;mdash; a stake in the outcome
]]

.pull-right[.font90[
.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 0c4.6 0 9.2 1 13.4 2.9L457.7 82.8c22 9.3 38.4 31 38.3 57.2c-.5 99.2-41.3 280.7-213.6 363.2c-16.7 8-36.1 8-52.8 0C57.3 420.7 16.5 239.2 16 140c-.1-26.2 16.3-47.9 38.3-57.2L242.7 2.9C246.8 1 251.4 0 256 0zm0 66.8V444.8C394 378 431.1 230.1 432 141.4L256 66.8l0 0z"/></svg> Guardrails**

- Pre-decide your analysis *before* seeing results
- Report findings that **don't** fit your hypothesis
- Show your full data and code
- Invite someone to challenge your interpretation
]
]]

### The Responsibility of Publishing

.pull-left[.font90[
Once your findings are public, **you no longer control how they're used.**

Ask before you publish:

- Who might **act** on this result?
- Could it be **misread** or **misused** to harm a group?
- Have I stated my **limitations** loudly enough to prevent overreach?
]]

.pull-right[.font90[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M480 32c0-12.9-7.8-24.6-19.8-29.6s-25.7-2.2-34.9 6.9L381.7 53c-48 48-113.1 75-181 75H192 160 64c-35.3 0-64 28.7-64 64v96c0 35.3 28.7 64 64 64l0 128c0 17.7 14.3 32 32 32h64c17.7 0 32-14.3 32-32V352l8.7 0c67.9 0 133 27 181 75l43.6 43.6c9.2 9.2 22.9 11.9 34.9 6.9s19.8-16.6 19.8-29.6V300.4c18.6-8.8 32-32.5 32-60.4s-13.4-51.6-32-60.4V32zm-64 76.7V240 371.3C357.2 317.8 280.5 288 200.7 288H192V192h8.7c79.8 0 156.5-29.8 215.3-83.3z"/></svg> Frame findings carefully**

A single correlation, stripped of caveats, can become a headline or a policy. Precise, honest framing is part of your ethical duty &amp;mdash; not an afterthought.

### The Slide Design Checklist

.pull-left[.font85[
Trade slides with another team and score each one:

.content-box-blue[
- One clear idea, stated in the title
- &amp;le; 6 bullets, &amp;le; 6 words each
- Chart title states the **finding**
- Axis labels legible at slide size
- &amp;le; 2 fonts; consistent throughout
- High-contrast, color-blind-safe
- Sources cited on the slide
]
]]

### Reference: The Presentation Outline

.font70[
| Slide | What it contains |
|---|---|
| **Title** | Project title, presenters, date, institution, logos |
| **Topic** | The global challenge; define it and say why it matters (cite sources) |
| **Literature Review** | What's known, arranged by theme (cite sources) |
| **Research Question** | Your question(s) and, if possible, a hypothesis |
| **Methods** | Secondary analysis; data source &amp; year; sample size &amp; traits; key variables; tools |
| **Results** | Descriptive stats per variable, then figures/tables (may be several slides) |
| **Discussion** | How you interpret what you found |
| **Conclusion** | Final takeaway and close |
| **References** | Full list, one consistent style |
]
