### Let's Sort It Out!

.pull-left[
**Here is the data:**

| Name   | Class | Exam Score |
|--------|-------|------------|
| Alice  | A     | 88         |
| Brian  | B     | 72         |
| Carlos | A     | 95         |
| Diana  | B     | 85         |
| Eva    | A     | 91         |
| Frank  | B     | 78         |
]

.pull-right[
&lt;br&gt;

.content-box-blue[
**Use R and Python to sort by Exam Scores.**
]
]

---
### Sort It with R

.pull-left[
```r
# Create the data
df &lt;- data.frame(
  Name = c("Alice", "Brian", "Carlos",
           "Diana", "Eva", "Frank"),
  Class = c("A", "B", "A", "B", "A", "B"),
  Exam_Score = c(88, 72, 95, 85, 91, 78)
)

# Option 1
df[order(df$Exam_Score, decreasing=TRUE), ]

# Option 2
library(dplyr)
df %&gt;% arrange(desc(Exam_Score))
```
]

.pull-right[
&lt;img src="13-class_files/figure-html/img11-1.png" alt="" width="80%" style="display: block; margin: auto;" /&gt;
]

---
### Sort It with Python

.pull-left[
```python
import pandas as pd
students = [
    {"Name": "Alice",  "Class": "A", "Score": 88},
    {"Name": "Brian",  "Class": "B", "Score": 72},
    {"Name": "Carlos", "Class": "A", "Score": 95},
    {"Name": "Diana",  "Class": "B", "Score": 85},
    {"Name": "Eva",    "Class": "A", "Score": 91},
    {"Name": "Frank",  "Class": "B", "Score": 78}
]
df = pd.DataFrame(students)
print("Not Sorted Data")
print(df)

# Sort by Score in descending order
sorted_df = df.sort_values(by="Score",
                           ascending=False)
print("Sorted Data")
print(sorted_df)
```
]

&lt;img src="13-class_files/figure-html/img12-1.png" alt="" width="58%" style="display: block; margin: auto;" /&gt;

### Let's Filter with R

.pull-left[
.font90[You can use either `subset` or `filter` (under the dplyr package):]

```r
# Option 1
subset(df, Class == "A")

# Option 2
df %&gt;% filter(Class == "A")
```

.font90[You can also filter based on **multiple conditions**:]

```r
# Option 1
subset(df, Class == "A" &amp; Exam_Score &gt; 90)

# Option 2
df %&gt;% filter(Class == "A", Exam_Score &gt; 90)
```
]

.pull-right[
&lt;img src="13-class_files/figure-html/img15-1.png" alt="" width="95%" style="display: block; margin: auto;" /&gt;
]

### Exploring Numerical Data: Summary Statistics

.pull-left[.font80[
**Measures of Center**

- **Mean** (average): sum divided by count &amp;mdash; *sensitive to outliers*
- **Median:** middle value when ordered &amp;mdash; *robust to outliers (use for skewed data)*
- **Mode:** most common value

**Measures of Spread**

- **Range:** maximum &amp;minus; minimum
- **Standard deviation (SD):** avg distance from mean &amp;mdash; ~68% of data falls within 1 SD
- **Interquartile range (IQR):** middle 50% spread

**Example: Exam Scores**

- Mean: 83 &amp;bull; Median: 82.5 &amp;bull; Range: 25 (max 94 &amp;minus; min 69) &amp;bull; SD: ~10 (most scores within 73&amp;ndash;93)
]]

### Exploring Numerical Data: Histogram

.pull-left[.font90[
A histogram shows the **distribution** of numeric data by dividing it into bins (ranges) and counting how many values fall in each bin.

.content-box-blue[

### Reading a Scatterplot

.font80[
- **What is a Scatterplot?** A graph where each point represents one observation with two values &amp;mdash; one on the x-axis and one on the y-axis (e.g., Hours Studied vs. Exam Score).

- **Trend / Correlation:** Upward trend = positive correlation (more study, higher score). Downward trend = negative correlation. No trend = no clear relationship.

- **Strength of Relationship:** Points tightly packed = strong relationship. Points widely scattered = weak relationship.

- **Outliers:** Look for students who don't fit the pattern &amp;mdash; like studying a lot but scoring low (or the opposite).

- **Shape of Relationship:** Linear = points form a straight line. Non-linear = relationship curves or flattens (e.g., diminishing returns on study time).
]

### The Four Steps of an EDA Case Study

.font85[
&lt;div class="chev-flow"&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1.6em;width:1.6em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;1. Overview &amp;amp; Quality Check&lt;/strong&gt;&lt;br&gt;
    Read in the data, check the head, calculate basic summary stats for numeric columns and frequencies for categorical ones. Report/adjust if you see any weird values.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1.6em;width:1.6em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M64 64c0-17.7-14.3-32-32-32S0 46.3 0 64V400c0 44.2 35.8 80 80 80H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H80c-8.8 0-16-7.2-16-16V64zm96 288H448c17.7 0 32-14.3 32-32V251.8c0-7.6-2.7-15-7.7-20.8l-65.8-76.8c-12.1-14.2-33.7-15-46.9-1.8l-21 21c-10 10-26.4 9.2-35.4-1.6l-39.2-47c-12.6-15.1-35.7-15.4-48.7-.6L135.9 215c-5.1 5.8-7.9 13.3-7.9 21.1v84c0 17.7 14.3 32 32 32z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;2. Univariate EDA&lt;/strong&gt;&lt;br&gt;
    Explore each variable on its own: histograms, boxplots, bar charts, summary statistics.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 576 512" style="height:1.6em;width:1.8em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M0 80C0 53.5 21.5 32 48 32h96c26.5 0 48 21.5 48 48V96H384V80c0-26.5 21.5-48 48-48h96c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48H432c-26.5 0-48-21.5-48-48V160H192v16c0 1.7-.1 3.4-.3 5L272 288h96c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48H272c-26.5 0-48-21.5-48-48V336c0-1.7 .1-3.4 .3-5L144 224H48c-26.5 0-48-21.5-48-48V80z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;3. Bivariate EDA&lt;/strong&gt;&lt;br&gt;
    Explore relationships between pairs of variables: scatterplots, grouped boxplots, contingency tables.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1.6em;width:1.2em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M297.2 248.9C311.6 228.3 320 203.2 320 176c0-70.7-57.3-128-128-128S64 105.3 64 176c0 27.2 8.4 52.3 22.8 72.9c3.7 5.3 8.1 11.3 12.8 17.7l0 0c12.9 17.7 28.3 38.9 39.8 59.8c10.4 19 15.7 38.8 18.3 57.5H109c-2.2-12-5.9-23.7-11.8-34.5c-9.9-18-22.2-34.9-34.5-51.8l0 0 0 0c-5.2-7.1-10.4-14.2-15.4-21.4C27.6 247.9 16 213.3 16 176C16 78.8 94.8 0 192 0s176 78.8 176 176c0 37.3-11.6 71.9-31.4 100.3c-5 7.2-10.2 14.3-15.4 21.4l0 0 0 0c-12.3 16.8-24.6 33.7-34.5 51.8c-5.9 10.8-9.6 22.5-11.8 34.5H226.4c2.6-18.7 7.9-38.6 18.3-57.5c11.5-20.9 26.9-42.1 39.8-59.8l0 0 0 0 0 0c4.7-6.4 9-12.4 12.7-17.7zM192 128c-26.5 0-48 21.5-48 48c0 8.8-7.2 16-16 16s-16-7.2-16-16c0-44.2 35.8-80 80-80c8.8 0 16 7.2 16 16s-7.2 16-16 16zm0 384c-44.2 0-80-35.8-80-80V416H272v16c0 44.2-35.8 80-80 80z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;4. Patterns &amp;amp; Anomalies&lt;/strong&gt;&lt;br&gt;
    Note trends, clusters, outliers, gaps, and anything unexpected &amp;mdash; then form your story.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;
]

### Form Your Story!

.content-box-blue[
.font85[**Example:**

*"It appears that as students progress through grades, their homework load increases. Despite spending more time, their sleep tends to decrease slightly by senior year. We found that those involved in extracurricular activities tended to maintain slightly higher GPAs on average, though the causal relationship isn't clear. Most students have moderate sleep (~7 hours), but a few are getting dangerously low amounts of sleep which is a concern. We also saw that study habits vary widely &amp;mdash; even among those with similar GPAs, homework hours ranged a lot, suggesting different work strategies or course loads."*
]
]

### The EDA Process

.font85[
&lt;div class="chev-flow"&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1.6em;width:1.6em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm169.8-90.7c7.9-22.3 29.1-37.3 52.8-37.3h58.3c34.9 0 63.1 28.3 63.1 63.1c0 22.6-12.1 43.5-31.7 54.8L280 264.4c-.2 13-10.9 23.6-24 23.6c-13.3 0-24-10.7-24-24V250.5c0-8.6 4.6-16.5 12.1-20.8l44.3-25.4c4.7-2.7 7.6-7.7 7.6-13.1c0-8.4-6.8-15.1-15.1-15.1H222.6c-3.4 0-6.4 2.1-7.5 5.3l-.4 1.2c-4.4 12.5-18.2 19-30.6 14.6s-19-18.2-14.6-30.6l.4-1.2zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;1. Ask Questions&lt;/strong&gt;&lt;br&gt;
    What do I want to know?&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1.6em;width:1.6em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;2. Explore&lt;/strong&gt;&lt;br&gt;
    Look at variables and relationships.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1.6em;width:1.2em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M297.2 248.9C311.6 228.3 320 203.2 320 176c0-70.7-57.3-128-128-128S64 105.3 64 176c0 27.2 8.4 52.3 22.8 72.9c3.7 5.3 8.1 11.3 12.8 17.7l0 0c12.9 17.7 28.3 38.9 39.8 59.8c10.4 19 15.7 38.8 18.3 57.5H109c-2.2-12-5.9-23.7-11.8-34.5c-9.9-18-22.2-34.9-34.5-51.8l0 0 0 0c-5.2-7.1-10.4-14.2-15.4-21.4C27.6 247.9 16 213.3 16 176C16 78.8 94.8 0 192 0s176 78.8 176 176c0 37.3-11.6 71.9-31.4 100.3c-5 7.2-10.2 14.3-15.4 21.4l0 0 0 0c-12.3 16.8-24.6 33.7-34.5 51.8c-5.9 10.8-9.6 22.5-11.8 34.5H226.4c2.6-18.7 7.9-38.6 18.3-57.5c11.5-20.9 26.9-42.1 39.8-59.8l0 0 0 0 0 0c4.7-6.4 9-12.4 12.7-17.7zM192 128c-26.5 0-48 21.5-48 48c0 8.8-7.2 16-16 16s-16-7.2-16-16c0-44.2 35.8-80 80-80c8.8 0 16 7.2 16 16s-7.2 16-16 16zm0 384c-44.2 0-80-35.8-80-80V416H272v16c0 44.2-35.8 80-80 80z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;3. Discover&lt;/strong&gt;&lt;br&gt;
    Find patterns and anomalies.&lt;/p&gt;

### Prompting a Coding Agent: The Art of Good Instructions

.pull-left[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> Weak Prompt (Vague)**

*"Plot my data"*

**Problems:** No file mentioned. No column names. No chart type. No goal. The agent has to guess &amp;mdash; and usually guesses wrong.
]

.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Strong Prompt (Specific)**

*"I have students.csv with columns Grade (9&amp;ndash;12), Math_Score, and Sleep_Hours. Using Python, create a boxplot comparing Math_Score distributions for each grade level. Use seaborn and label axes clearly."*
]
]

.pull-right[.font85[
**Prompt Recipe (4 Ingredients):**

1. **Data:** Name the file and key columns
2. **Language:** Specify R or Python
3. **Goal:** Say exactly what you want to see or compute
4. **Format:** Mention chart type, labels, colors if needed

.content-box-blue[
**Pro tip:** If the code fails, paste the error back and say "I got this error &amp;mdash; can you fix it?"
]

.content-box-yellow[
**Critical rule:** Always read and understand the code before running it. *Never paste blindly!*
]
]]

### Working WITH a Coding Agent (Not FOR It)

.font85[

### Correlation &amp;ne; Causation: The Detective's Most Important Warning

.content-box-yellow[
.font95[**Just because two variables move together does NOT mean one causes the other!**]
]

.pull-left[.font80[
**Classic "Spurious" Correlations:**

- 🍨 **Ice cream sales &amp;amp; shark attacks** &amp;mdash; both rise in summer, but eating ice cream doesn't attract sharks. The hidden cause is *hot weather*.

- 🎬 **Nicolas Cage films &amp;amp; pool drownings** &amp;mdash; a real statistical correlation, and completely meaningless. Pure coincidence.

- 👟 **Shoe size &amp;amp; reading ability in children** &amp;mdash; both increase with age; *age* is the real driver.
]]

.pull-right[.font80[
**How to Think About It:**

- Ask: **Could there be a lurking variable?** A hidden third variable that drives both (like "age" or "season").

- Ask: **Does the direction make sense?** Causation requires a plausible mechanism &amp;mdash; can you explain *how* A actually causes B?

- In EDA, always say **"associated with"** not "causes" unless you ran a controlled experiment.
]]
