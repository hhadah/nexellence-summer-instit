### The Presentation Feedback Checklist

.pull-left[.font85[
As you watch, score each area:

.content-box-blue[
- **Story** &amp;mdash; clear question &amp;rarr; findings &amp;rarr; takeaway?
- **Slides** &amp;mdash; one idea each, readable, captioned?
- **Delivery** &amp;mdash; pace, eye contact, smooth hand-offs?
- **Evidence** &amp;mdash; claims backed by the data shown?
- **Timing** &amp;mdash; within 10&amp;ndash;12 minutes?
]
]]

.pull-right[.font85[
.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M362.7 19.3L314.3 67.7 444.3 197.7l48.4-48.4c25-25 25-65.5 0-90.5L453.3 19.3c-25-25-65.5-25-90.5 0zm-71 71L58.6 323.5c-10.4 10.4-18 23.3-22.2 37.4L1 481.2C-1.5 489.7 .8 498.8 7 505s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L421.7 220.3 291.7 90.3z"/></svg> Take notes *during*, not after**

### How to Give Feedback That Helps

### Session 13: What You Can Do Now

**Rehearsal &amp; delivery:**

- Deliver your **entire presentation** within a strict 10&amp;ndash;12 minute window and hold a 3-minute Q&amp;A without losing your footing.

**Feedback, both directions:**

- Give feedback with the two-part frame &amp;mdash; one specific strength, one concrete fix &amp;mdash; and receive it without defensiveness.
- Turn a room of notes into your **top 3 improvements**, assign them, and implement them on a timer.
