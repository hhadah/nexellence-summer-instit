### .white[How do you know what you don't know? Using data to draw confident conclusions about the world.]

### Making Inferences: From Sample to Population

.content-box-blue[
Welcome to our exploration of **statistical inference**! We'll learn how to draw conclusions about entire populations using just sample data. This powerful approach allows us to make educated statements with **quantified uncertainty**.
]

### Population vs. Sample

.pull-left[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M57.7 193l9.4 16.4c8.3 14.5 21.9 25.2 38 29.8L163 255.7c17.2 4.9 29 20.6 29 38.5v39.9c0 11 6.2 21 16 25.9s16 14.9 16 25.9v39c0 15.6 14.9 26.9 29.9 22.6c16.1-4.6 28.6-17.5 32.7-33.8l2.8-11.2c4.2-16.9 15.2-31.4 30.3-40l8.1-4.6c15-8.5 24.2-24.5 24.2-41.7v-8.3c0-12.7-5.1-24.9-14.1-33.9l-3.9-3.9c-9-9-21.2-14.1-33.9-14.1H257c-11.1 0-22.1-2.9-31.8-8.4l-34.5-19.7c-4.3-2.5-7.6-6.5-9.2-11.2c-3.2-9.6 1.1-20 10.2-24.5l5.9-3c6.6-3.3 14.3-3.9 21.3-1.5l23.2 7.7c8.2 2.7 17.2-.4 21.9-7.5c4.7-7 4.2-16.3-1.2-22.8l-13.6-16.3c-10-12-9.9-29.5 .3-41.3l15.7-18.3c8.8-10.3 10.2-25 3.5-36.7l-2.4-4.2c-3.5-.2-6.9-.3-10.4-.3C163.1 48 84.4 108.9 57.7 193zM464 256c0-36.8-9.6-71.4-26.4-101.5L412 164.8c-15.7 6.3-23.8 23.8-18.5 39.8l16.9 50.7c3.5 10.4 12 18.3 22.6 20.9l29.1 7.3c1.2-9 1.8-18.2 1.8-27.5zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z"/></svg> Population**

The entire group we're interested in studying.

- All students in your school

]
]

.pull-right[
.content-box-green[

- 50 surveyed students
- 1000 polled voters
- 200 tested items

We denote sample quantities as **statistics** ( `\(\bar{x}\)`, `\(\hat{p}\)` ).

### Why Not Study the Entire Population?

.pull-left[.font90[

### Sample Size Matters

.pull-left[
.content-box-blue[
.font140[&lt;strong style="color:#0148A4;"&gt;30&lt;/strong&gt;] **Minimum**

Generally considered the minimum sample size for many statistical methods.
]

.content-box-green[
.font140[&lt;strong style="color:#0148A4;"&gt;100&lt;/strong&gt;] **Better**

Provides more precise estimates with narrower confidence intervals.
]

.font85[Larger samples give more precise information. The margin of error shrinks proportional to `\(1/\sqrt{n}\)` &amp;mdash; doubling precision requires **4x the sample size**. A small sample might lead to wrong conclusions due to random chance.]
]

.pull-right[
&lt;img src="14-class_files/figure-html/img10-1.png" alt="" width="72%" style="display: block; margin: auto;" /&gt;
]

### Sampling Variability

.font95[Different random samples will give different results &amp;mdash; **this is natural and expected!**]

.font80[
.three-col[
.col[
&lt;img src="assets/12a-img.png" style="width:100%; border-radius:6px;"&gt;

**Multiple Samples**

Each sample of 50 students might give a different average height: 5'6", 5'7", 5'5".
]
.col[
&lt;img src="assets/12b-img.png" style="width:100%; border-radius:6px;"&gt;

**Predictable Variation**

Sample statistics will cluster around the true population parameter in a predictable way.
]
.col[
&lt;img src="assets/12c-img.png" style="width:100%; border-radius:6px;"&gt;

**Sample Size Effect**

Larger samples show less variability and provide more consistent estimates.
]
]
]

---
### Sampling Distribution

.content-box-blue[
The **sampling distribution** is the distribution of a sample statistic (like the mean) across **all possible samples** of the same size from the population.
]

.font90[
- Imagine taking thousands of samples and computing the mean of each &amp;mdash; the histogram of those means *is* the sampling distribution.

- It tells us **how much a statistic typically varies** from sample to sample.

- Its standard deviation is called the **standard error**: `\(SE = \sigma/\sqrt{n}\)`.
]

### Central Limit Theorem

.pull-left[.font85[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M448 256A192 192 0 1 0 64 256a192 192 0 1 0 384 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm256 80a80 80 0 1 0 0-160 80 80 0 1 0 0 160zm0-224a144 144 0 1 1 0 288 144 144 0 1 1 0-288zM224 256a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg> Accurate Results**

For reasonably large samples, the sampling distribution of the sample mean is approximately **normal**.
]

.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M315.4 15.5C309.7 5.9 299.2 0 288 0s-21.7 5.9-27.4 15.5l-96 160c-5.9 9.9-6.1 22.2-.4 32.2s16.3 16.2 27.8 16.2H384c11.5 0 22.2-6.2 27.8-16.2s5.5-22.3-.4-32.2l-96-160zM288 312V456c0 22.1 17.9 40 40 40H472c22.1 0 40-17.9 40-40V312c0-22.1-17.9-40-40-40H328c-22.1 0-40 17.9-40 40zM128 512a128 128 0 1 0 0-256 128 128 0 1 0 0 256z"/></svg> True Regardless of Original Shape**

Even if the original data are skewed, the means will follow a normal distribution if n is large enough.

### Confidence Interval Formulas

.pull-left[.font90[
**For a Mean (Large Sample):**

`$$\bar{x} \pm 1.96 \cdot \frac{s}{\sqrt{n}}$$`

*Where 1.96 is the z-score for 95% confidence.*

**For a Proportion:**

`$$\hat{p} \pm 1.96 \cdot \sqrt{\frac{\hat{p}(1-\hat{p})}{n}}$$`

*Where* `\(\hat{p}\)` *is the sample proportion.*

**Different Confidence Levels:**

- 90%: use **1.645** instead of 1.96
- 99%: use **2.576** instead of 1.96
]]

### Example: Election Poll Confidence Interval

.font90[A poll of **n = 1000 voters** finds **520 (52%)** support Candidate X. What's the 95% CI for the true proportion?]

--

`$$\hat{p} \pm 1.96\sqrt{\frac{\hat{p}(1-\hat{p})}{n}} = 0.52 \pm 1.96\sqrt{\frac{0.52 \times 0.48}{1000}}$$`

--

`$$= 0.52 \pm 1.96 \times 0.0158 = 0.52 \pm 0.031$$`

--

.content-box-green[
.font95[**95% CI: [0.489, 0.551]** &amp;mdash; that is, between 48.9% and 55.1%. Since the interval **includes 50%**, we can't be confident Candidate X is really ahead &amp;mdash; *it's too close to call*.]
]

### Calculate CI with Python

```python
import scipy.stats as stats

# sample data
p_hat = 0.52  # sample proportion
n = 1000      # sample size
confidence_level = 0.95

# Compute confidence interval using scipy
ci_low, ci_upp = stats.binomtest(int(p_hat * n), n).proportion_ci(
    confidence_level=confidence_level)

print(f"SciPy Confidence Interval: ({ci_low:.3f}, {ci_upp:.3f})")
```

### Null and Alternative Hypotheses

.pull-left[.font85[
.content-box-blue[
**Null Hypothesis (H&amp;#8320;)**

Statement of "no effect," "no difference," or status quo. What we assume true unless evidence suggests otherwise.

*Examples: "coin is fair (p = 0.5)" or "teaching methods have equal effects"*
]

.content-box-green[
**Alternative Hypothesis (H&amp;#8321;)**

What we're seeking evidence for &amp;mdash; a new effect or difference.

*Examples: "coin is biased (p &amp;ne; 0.5)" or "new method changes scores"*
]

.content-box-yellow[
**Types of Alternatives**

- **Two-sided:** different in either direction (&amp;ne;)
- **One-sided:** different in a specific direction (&amp;gt; or &amp;lt;)
]
]]

.pull-right[
&lt;img src="14-class_files/figure-html/img27-1.png" alt="" width="50%" style="display: block; margin: auto;" /&gt;
]

### Coin Flipping Test: The Result

.font95[Under H&amp;#8320; (a fair coin), how likely is a result as extreme as 15 heads out of 16? We compute the two-sided p-value with a binomial test:]

```r
binom.test(15, 16, p = 0.5)
```

### Significance Level (&amp;alpha;)

.pull-left[.font85[
.content-box-blue[
**Definition**

Threshold for deciding if a p-value is "small enough" to reject H&amp;#8320;.

If p &amp;le; &amp;alpha;, reject H&amp;#8320;. If p &amp;gt; &amp;alpha;, don't reject H&amp;#8320;.
]

.content-box-blue[
**Common Levels**

- **&amp;alpha; = 0.05 (5%):** standard in many fields
- **&amp;alpha; = 0.01 (1%):** more stringent
- **&amp;alpha; = 0.10 (10%):** less stringent
]

.content-box-yellow[
**Interpretation**

&amp;alpha; = 0.05 means we accept up to a 5% chance of falsely rejecting H&amp;#8320; when it's actually true.
]
]]

.pull-right[
&lt;img src="14-class_files/figure-html/img36-1.png" alt="" width="50%" style="display: block; margin: auto;" /&gt;
]

### Type I and Type II Errors

.pull-left[.font85[

| Decision &amp;darr; / Reality &amp;rarr; | H&amp;#8320; is True | H&amp;#8320; is False |
|---------------------------------|------------------|-------------------|
| **Reject H&amp;#8320;** | Type I Error (False Positive) | Correct Decision (True Positive) |
| **Don't Reject H&amp;#8320;** | Correct Decision (True Negative) | Type II Error (False Negative) |

.content-box-blue[
No decision rule is perfect because we are dealing with **probability and uncertainty**.
]
]]

### Justice System Analogy

.pull-left[.font90[
.content-box-blue[
In a trial, the **presumption of innocence** is the null hypothesis: H&amp;#8320; = "the defendant is innocent."
]

- **Type I error:** convicting an innocent person (rejecting a true H&amp;#8320;).

- **Type II error:** acquitting a guilty person (failing to reject a false H&amp;#8320;).

- The system sets a high bar &amp;mdash; *"beyond a reasonable doubt"* &amp;mdash; just like a small &amp;alpha;, to keep Type I errors rare.

### Common Misinterpretations

.font80[
.content-box-yellow[
**"Failing to reject H&amp;#8320;" &amp;ne; "Proving H&amp;#8320;"**

A large p-value doesn't prove H&amp;#8320; is true &amp;mdash; absence of evidence is not evidence of absence. *Example: a small study failing to detect a drug effect doesn't mean the drug doesn't work.*
]

.content-box-yellow[
**Statistical &amp;ne; Practical Significance**

A tiny effect can be statistically significant with large samples but may not matter in practice. *Example: a new app increases test scores by 0.1 points &amp;mdash; significant with n=100,000, but meaningless in reality.*
]

.content-box-yellow[
**p-value &amp;ne; Probability H&amp;#8320; Is True**

The p-value is not the probability that the null hypothesis is correct.
]

.content-box-yellow[
**p = 0.06 &amp;ne; "Almost Significant"**

Significance is binary based on your pre-set &amp;alpha;; "almost significant" is not a valid conclusion.
]
]

---
### One-tailed vs. Two-tailed Tests

.pull-left[
.content-box-blue[
**Two-tailed (&amp;ne;)**

Tests for a difference in *either* direction. The &amp;alpha; is split between both tails of the distribution.
]

.content-box-green[
**One-tailed (&amp;gt; or &amp;lt;)**

Tests for a difference in *one specific* direction. All of &amp;alpha; sits in one tail &amp;mdash; more power, but you must justify the direction **before** seeing the data.
]
]

### Practice 3: Coin Flip

.pull-left[.font80[
&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Flip a Coin:&lt;/strong&gt; Flip a coin 30 times and count how many times it lands on heads. (Example: suppose you get 18 heads.)&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;State the Hypotheses:&lt;/strong&gt; H&amp;#8320;: the coin is fair (p = 0.5). H&amp;#8321;: the coin is not fair (p &amp;ne; 0.5).&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Conduct the Test:&lt;/strong&gt; Use a binomial test or simulate: count how often you get 18 or more heads or 12 or fewer (both ends are equally extreme for a two-sided test). Set &amp;alpha; = 0.05 and calculate the p-value.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Make a Decision:&lt;/strong&gt; If p &amp;lt; 0.05, reject the null (coin is likely unfair). If p &amp;ge; 0.05, do not reject (no strong evidence the coin is unfair).&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;5&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Interpret the Result.&lt;/strong&gt;&lt;/div&gt;

### Sampling and Variability

.pull-left[.font85[
.content-box-blue[
**Random Sampling**

A good sample is representative of the population, achieved by random selection. This avoids bias and makes statistical methods valid.
]

.content-box-blue[
**Sampling Variability**

Different random samples give different results &amp;mdash; this is expected. This variability can be described by a sampling distribution.
]

.content-box-blue[
**Central Limit Theorem**

For large enough samples, the sampling distribution of means is approximately normal &amp;mdash; regardless of the original population distribution.
]
]]

.pull-right[
&lt;img src="14-class_files/figure-html/img65-1.png" alt="" width="50%" style="display: block; margin: auto;" /&gt;
]

.pull-left[.font90[
#### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M406.6 374.6l96-96c12.5-12.5 12.5-32.8 0-45.3l-96-96c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224l-293.5 0 41.4-41.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-96 96c-12.5 12.5-12.5 32.8 0 45.3l96 96c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 288l293.5 0-41.4 41.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0z"/></svg> &amp;nbsp; Range of Plausible Values

### Errors in Testing

.pull-left[
.content-box-yellow[
**Type I Error (False Positive)**

- Rejecting H&amp;#8320; when H&amp;#8320; is actually true
- Probability = &amp;alpha; (controlled by setting significance level)
- *Example: concluding a teaching method works when it doesn't*
]
]

.pull-right[
.content-box-yellow[
**Type II Error (False Negative)**

- Not rejecting H&amp;#8320; when H&amp;#8321; is true
- Probability = &amp;beta; (reduced with larger samples or effect sizes)
- *Example: missing a beneficial teaching method*
]
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.content-box-blue[
.font90[**There's a trade-off:** making &amp;alpha; very low (strict) reduces Type I but can raise Type II (harder to detect real effects).]
]

```r
prop.test(520, 1000,
  p = 0.5,
  alternative = "two.sided",
  conf.level = 0.95)
```

**What to verify:**

- Does the null hypothesis match your question?
- One-sided or two-sided &amp;mdash; is the agent's choice correct?
- Does the p-value match what the agent says it means?
- Is the conclusion correctly worded (reject vs. fail to reject)?
]]

### Using a Coding Agent for Confidence Intervals

.pull-left[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M88.2 309.1c9.8-18.3 6.8-40.8-7.5-55.8C59.4 230.9 48 204 48 176c0-63.5 63.8-128 160-128s160 64.5 160 128s-63.8 128-160 128c-13.1 0-25.8-1.3-37.8-3.6c-10.4-2-21.2-.6-30.7 4.2c-4.1 2.1-8.3 4.1-12.6 6c-16 7.2-32.9 13.5-49.9 18c2.8-4.6 5.4-9.1 7.9-13.6c1.1-1.9 2.2-3.9 3.2-5.9zM0 176c0 41.8 17.2 80.1 45.9 110.3c-.9 1.7-1.9 3.5-2.8 5.1c-10.3 18.4-22.3 36.5-36.6 52.1c-6.6 7-8.3 17.2-4.6 25.9C5.8 378.3 14.4 384 24 384c43 0 86.5-13.3 122.7-29.7c4.8-2.2 9.6-4.5 14.2-6.8c15.1 3 30.9 4.5 47.1 4.5c114.9 0 208-78.8 208-176S322.9 0 208 0S0 78.8 0 176zM432 480c16.2 0 31.9-1.6 47.1-4.5c4.6 2.3 9.4 4.6 14.2 6.8C529.5 498.7 573 512 616 512c9.6 0 18.2-5.7 22-14.5c3.8-8.8 2-19-4.6-25.9c-14.2-15.6-26.2-33.7-36.6-52.1c-.9-1.7-1.9-3.4-2.8-5.1C622.8 384.1 640 345.8 640 304c0-94.4-87.9-171.5-198.2-175.8c4.1 15.2 6.2 31.2 6.2 47.8l0 .6c87.2 6.7 144 67.5 144 127.4c0 28-11.4 54.9-32.7 77.2c-14.3 15-17.3 37.6-7.5 55.8c1.1 2 2.2 4 3.2 5.9c2.5 4.5 5.2 9 7.9 13.6c-17-4.5-33.9-10.7-49.9-18c-4.3-1.9-8.5-3.9-12.6-6c-9.5-4.8-20.3-6.2-30.7-4.2c-12.1 2.4-24.7 3.6-37.8 3.6c-61.7 0-110-26.5-136.8-62.3c-16 5.4-32.8 9.4-50 11.8C279 439.8 350 480 432 480z"/></svg> Strong CI Prompts**

- "I measured heights of 30 students. Mean = 168 cm, SD = 8 cm. Calculate a 95% CI for the population mean in R using the t.test function."

- "Show me how the CI gets narrower as sample size increases. Plot CIs for n = 10, 30, 100 using Python."

- "I got the 95% CI [0.489, 0.551]. Write a one-sentence interpretation for a non-statistician audience."

- "What happens to the CI if I change from 95% to 99% confidence? Explain why."
]]

.pull-right[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> Agent Mistakes to Watch For**

- **Wrong interpretation:** "95% probability the true mean is in this interval" &amp;mdash; *this is incorrect!* The CI is a statement about the method, not this one interval.

- **Using z instead of t:** For small samples (n &amp;lt; 30), the t-distribution should be used. An agent might default to z &amp;mdash; always check.

- **Confusing SE with SD:** Standard Error = SD/&amp;radic;n. An agent might mix these up in its explanation.

.content-box-yellow[
**Rule:** Always sanity-check the numbers *and* the language. Numbers should be plausible; language should match the correct definition.
]
]]

### Critical Thinking: When to Trust an Agent's Output

.font90[Agents are powerful but not infallible. **Statistical inference requires human judgment &amp;mdash; especially in the interpretation step.**]

.pull-left[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> Trust When...**

- The code runs without errors
- The p-value and CI are in a sensible range (0&amp;ndash;1 and plausible)
- The function matches the test type (`t.test` for means, `prop.test` for proportions)
- You can explain what every line does
]]

.pull-right[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> Verify When...**

- The agent says "95% probability the true mean is in the interval" &amp;mdash; rephrase this
- The p-value seems too good (p = 0.000001) &amp;mdash; double-check the data and setup
- The agent uses "prove" or "confirms" &amp;mdash; statistics never proves; it provides evidence
- You don't understand a line of code it wrote
]]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.content-box-blue[
.font80[
**The Golden Rules:** always state H&amp;#8320; and H&amp;#8321; yourself &amp;bull; write your own interpretation in plain English &amp;bull; ask "could this be wrong?" for every result &amp;bull; agents handle computation; you provide the scientific reasoning. **The agent is your calculator &amp;mdash; not your brain.**
]
]
