### Detecting Missing Values &amp;mdash; R

.font90[In R, `is.na()` returns TRUE for missing (NA) values and FALSE otherwise. Summing the result counts the total NAs, since TRUE = 1 and FALSE = 0 in R:]

```r
# Create a sample vector of scores with some NAs
scores &lt;- c(88, 92, NA, 75, 90, NA, 85)
# Check which elements are NA
is.na(scores)
# [1] FALSE FALSE TRUE FALSE FALSE TRUE FALSE

# Count how many NAs
sum(is.na(scores))
# [1] 2
```

---
### Detecting Missing Values &amp;mdash; Python

.font90[In Python's pandas, `isnull()` (or equivalently `isna()`) returns a Series of booleans indicating missing values. We then use `.sum()` to count the True values:]

```python
import pandas as pd

# Create a pandas Series of scores with some NaN values
scores = pd.Series([88, 92, None, 75, 90, None, 85])
# Check which entries are null
scores.isnull()
# 0    False
# 1    False
# 2     True
# ...

# Count how many null values
scores.isnull().sum()
# 2
```

### Removing Missing Data

.font80[
- **Listwise deletion (complete-case analysis):** removes any row containing at least one missing value. Simple and guaranteed complete data &amp;mdash; but valid only if data is **MCAR** (Missing Completely At Random).

- **Advanced:** `dropna(thresh=k)` keeps rows with at least k non-null values &amp;mdash; useful when you can tolerate some missingness. `dropna(subset=['col'])` targets specific columns only.

- Simple and guarantees no missing values remain.

- **Downside:** if lots of data is missing, you lose a lot of cases.
]

--

.content-box-yellow[
.font85[**Critical:** if missingness is MNAR (e.g., low scorers more likely to skip), listwise deletion inflates the apparent average. Always check whether completers differ from non-completers before deleting rows.]
]

---
### Removing Missing Data in R

.font90[The `drop_na` function in the tidyr package removes any rows with NA values:]

**Option 1**

```r
install.packages("tidyr")  # If you haven't already installed it
library(tidyr)

# Suppose df is a data frame with some NAs
clean_df &lt;- drop_na(df)
# This will drop any rows of df that contain NA in any column.
```

**Option 2**

```r
clean_df &lt;- na.omit(df)
```

---
### Removing Missing Data in Python

.font90[Pandas provides the `dropna()` method for DataFrames:]

```python
# Assume df is a pandas DataFrame with some missing values
clean_df = df.dropna()
# By default, this drops any row with any NaN in it.
```

.font90[
- `df.dropna(how='all')` would drop only rows that are **completely empty**.
- `df.dropna(subset=['col1','col2'])` would drop rows missing data in **specific columns** of interest.
]

### Imputing Missing Data (Filling in the Blanks)

.font80[
**Imputation** replaces missing values with estimates &amp;mdash; but every method makes assumptions. Mean imputation reduces variance and inflates correlations. *Choose the method based on why data is missing (MCAR/MAR/MNAR).*

**Strategies from simple to advanced:**

- Use a static value (e.g., 0 or "Unknown")
- Fill with the **mean or median** (for numeric data)
- For time-series: use forward fill (last value) or backward fill (next value)
- **MCAR data:** mean/median imputation is defensible. **MAR data:** regression imputation or KNN imputation. **MNAR data:** no simple fix &amp;mdash; document and report the limitation.
]

--

.content-box-yellow[
.font85[**Mean imputation warning:** replacing 20% of a variable with its mean artificially shrinks the standard deviation and inflates correlations with other variables. Always report the imputation method and percentage imputed.]
]

**Option 1**

scores &lt;- c(88, 92, NA, 75, 90, NA, 85)

```

```

### What Counts as an Outlier? &amp;mdash; The IQR Method

.content-box-blue[
The **interquartile range (IQR)** is the distance between the first and third quartiles:

`$$\text{IQR} = Q_3 - Q_1$$`
]

.font95[A value is flagged as an outlier if it falls outside the "fences":]

`$$x &lt; Q_1 - 1.5 \times \text{IQR} \quad \text{or} \quad x &gt; Q_3 + 1.5 \times \text{IQR}$$`

--

.content-box-green[
.font90[This is the same rule that box plots use to draw their whiskers &amp;mdash; points beyond the whiskers are the outliers. The 1.5&amp;times; multiplier is convention; 3&amp;times; flags only "extreme" outliers.]
]

### Let's Practice with R

.pull-left[
```r
# Sample data: homework minutes
homework_minutes &lt;- c(120, 90, 100, 95,
                      110, 105, 115, 300)
summary(homework_minutes)
# Min. 1st Qu. Median  Mean  3rd Qu. Max.
# 90    95     105     129.4  115    300

# Calculate Q1, Q3, and IQR
Q1 &lt;- quantile(homework_minutes, 0.25)
Q3 &lt;- quantile(homework_minutes, 0.75)
IQR_val &lt;- IQR(homework_minutes)  # Q3 - Q1

# Determine the outlier thresholds
lower_thresh &lt;- Q1 - 1.5 * IQR_val  # 65
upper_thresh &lt;- Q3 + 1.5 * IQR_val  # 145

# Find values outside these thresholds
homework_minutes[homework_minutes &lt; lower_thresh |
                 homework_minutes &gt; upper_thresh]
# [1] 300
```
]

.pull-right[.font85[
- In the example, Q1 = 95 and Q3 = 115, so the **IQR is 20**.

- Outlier thresholds: below **65** or above **145** minutes (using the 1.5 &amp;times; IQR rule).

- Most values fall within 65&amp;ndash;145 minutes.

- One value, **300 minutes, is flagged as an outlier**.

- This could be a data entry error or a very unusual case.
]]

### Let's Practice with Python

```python
import numpy as np

homework_minutes = np.array([120, 90, 100, 95, 110, 105, 115, 300])
Q1 = np.percentile(homework_minutes, 25)
Q3 = np.percentile(homework_minutes, 75)
IQR_val = Q3 - Q1
lower_thresh = Q1 - 1.5 * IQR_val
upper_thresh = Q3 + 1.5 * IQR_val
outliers = homework_minutes[(homework_minutes &lt; lower_thresh) |
                            (homework_minutes &gt; upper_thresh)]
print(Q1, Q3, IQR_val, lower_thresh, upper_thresh, outliers)
# 95.0 115.0 20.0 65.0 145.0 [300]

### Handling Outliers: Four Strategies

.pull-left[.font75[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg> 1. Investigate**
Always investigate first: compare the outlier to the source data or domain knowledge. Is Age=300 physically impossible? Is Sales=$50M plausible given other context? *The answer determines the correct strategy.*

**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"/></svg> 2. Remove**
Remove only if confirmed data errors. Removing legitimate extreme values biases your analysis &amp;mdash; the very student with 300 minutes of homework may be the most interesting data point.

**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M32 96l320 0V32c0-12.9 7.8-24.6 19.8-29.6s25.7-2.2 34.9 6.9l96 96c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-96 96c-9.2 9.2-22.9 11.9-34.9 6.9s-19.8-16.6-19.8-29.6V160L32 160c-17.7 0-32-14.3-32-32s14.3-32 32-32zM480 352c17.7 0 32 14.3 32 32s-14.3 32-32 32H160v64c0 12.9-7.8 24.6-19.8 29.6s-25.7 2.2-34.9-6.9l-96-96c-6-6-9.4-14.1-9.4-22.6s3.4-16.6 9.4-22.6l96-96c9.2-9.2 22.9-11.9 34.9-6.9s19.8 16.6 19.8 29.6l0 64H480z"/></svg> 3. Replace (Winsorize)**
Replace values above the 95th percentile with the 95th percentile value instead of removing them. Preserves the observation while limiting its influence: `df["col"].clip(upper=df["col"].quantile(0.95))`

**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 0c4.6 0 9.2 1 13.4 2.9L457.7 82.8c22 9.3 38.4 31 38.3 57.2c-.5 99.2-41.3 280.7-213.6 363.2c-16.7 8-36.1 8-52.8 0C57.3 420.7 16.5 239.2 16 140c-.1-26.2 16.3-47.9 38.3-57.2L242.7 2.9C246.8 1 251.4 0 256 0zm0 66.8V444.8C394 378 431.1 230.1 432 141.4L256 66.8l0 0z"/></svg> 4. Keep but Use Robust Methods**
Sensitivity analysis: run the analysis both with and without the outlier. If conclusions change dramatically, report both results and let the reader decide.
]]

### Text Standardization with R

**Example 1**

```r
words &lt;- c(" Apple", "apple ", "APPLE")
# Trim whitespace
words &lt;- trimws(words)
# Convert to lower case
words_lower &lt;- tolower(words)
words_lower
# [1] "apple" "apple" "apple"
```

**Example 2**

```r
countries &lt;- c("USA", "U.S.A.", "United States")
countries_clean &lt;- gsub("\\.|\\s", "", countries)  # remove dots and spaces
countries_clean &lt;- ifelse(countries_clean %in% c("USA", "UnitedStates"),
                          "USA", countries_clean)
countries_clean
# [1] "USA" "USA" "USA"
```

---
### Text Standardization with Python

**Example 1**

```python
words = pd.Series([" Apple", "apple ", "APPLE"])
words = words.str.strip()       # remove leading/trailing whitespace
words_lower = words.str.lower() # convert to lowercase
print(words_lower.tolist())
# ['apple', 'apple', 'apple']
```

**Example 2**

```python
# For replacements and removing punctuation:
countries = pd.Series(["USA", "U.S.A.", "United States"])
countries_clean = countries.str.replace(r"\.", "", regex=True)   # remove dots
countries_clean = countries_clean.str.replace(" ", "", regex=True)  # remove spaces
countries_clean = countries_clean.replace({"UnitedStates": "USA"})
print(countries_clean.tolist())
# ['USA', 'USA', 'USA']
```

### Filtering and Combining Data

.pull-left[.font85[
- **Data subsetting is where analytical judgment and code meet:** filtering defines the population you're studying. Every filter is an analytical decision that should be documented &amp;mdash; "I filtered to Grade==9" changes what conclusions are valid.

- **Method chaining:** in pandas, you can chain operations: `df.dropna().query("Grade==9")[["Student","Math_Score"]]`. This produces clean, readable pipelines. In R, the pipe operator `|&gt;` (or `%&gt;%`) achieves the same.

- **Rule:** always filter *after* you've understood the full dataset. Premature filtering can hide patterns in data you haven't examined yet.
]]

### The Four Join Types

.font80[
.content-box-blue[
**LEFT JOIN:** all rows from the left table, matched rows from the right. NaN fills unmatched right-side values. *Use when the left table is your analytical ground truth and you need to enrich it.*
]

.content-box-blue[
**INNER JOIN:** only rows present in **both** tables. *Warning: silently drops unmatched rows &amp;mdash; check `df.shape` before and after to confirm no unexpected data loss.*
]

.content-box-blue[
**FULL JOIN:** all rows from both tables, NaN where no match. *Use for data reconciliation: finding records in one source but not another.*
]

.content-box-blue[
**RIGHT JOIN:** all rows from the right table, matched rows from the left. Equivalent to a left join with the tables swapped.
]
]

--

.font85[**After any join:** check `df.shape` and `df.isnull().sum()` to verify.]

---
### Data Cleaning Checklist (1/2)

.font80[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Understand Your Data Context&lt;/strong&gt;&lt;br&gt;
  Read the data dictionary first. Without domain knowledge, you can't distinguish a valid extreme value from an error. Ask: what is the unit? What is the valid range? What do missing values mean in this context?&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Check the Structure&lt;/strong&gt;&lt;br&gt;
  Check &lt;code&gt;df.shape&lt;/code&gt;, &lt;code&gt;df.dtypes&lt;/code&gt;, &lt;code&gt;df.describe()&lt;/code&gt;, &lt;code&gt;df.isnull().sum()&lt;/code&gt; for every new dataset. Before cleaning anything, form hypotheses about what you expect to find &amp;mdash; surprises are the most important signals.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Handle Missing Data&lt;/strong&gt;&lt;br&gt;
  Identify missingness type (MCAR/MAR/MNAR). Choose method: listwise deletion only for MCAR; mean/median imputation for continuous MCAR/MAR; document all decisions with before/after row counts.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Identify Outliers&lt;/strong&gt;&lt;br&gt;
  Apply at least two detection methods (IQR + domain knowledge). For each flagged value: investigate before acting. Document whether you removed, replaced, winsorized, or kept it.&lt;/div&gt;
&lt;/div&gt;
]

---
### Data Cleaning Checklist (2/2)

.font80[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;5&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Standardize Formats&lt;/strong&gt;&lt;br&gt;
  Parse all dates to a single format (ISO 8601: YYYY-MM-DD) using &lt;code&gt;pd.to_datetime()&lt;/code&gt;. Normalize text with &lt;code&gt;.str.strip().str.lower()&lt;/code&gt;. Test with &lt;code&gt;value_counts()&lt;/code&gt; after each transformation.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;6&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Filter as Needed&lt;/strong&gt;&lt;br&gt;
  Every filter is an analytical decision &amp;mdash; document it in your log. "Filtered to Grade==9" restricts generalizability. If you filter outliers, note that conclusions apply only to the filtered population.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;7&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Combine Data&lt;/strong&gt;&lt;br&gt;
  Always check row counts after merging. An unexpected row count increase suggests many-to-many matches. An unexpected decrease indicates mismatched keys. Both are data quality issues, not just code bugs.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;8&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Verify and Save Clean Data&lt;/strong&gt;&lt;br&gt;
  Run your original &lt;code&gt;df.describe()&lt;/code&gt; and &lt;code&gt;df.isnull().sum()&lt;/code&gt; against the cleaned version. Also run basic sanity checks: are there still negative ages? Any dates in the future? Does the mean match domain expectations?&lt;/div&gt;
&lt;/div&gt;
]

### Coding Agent Workflow for Data Wrangling

.font80[A coding agent can automate the full 8-step cleaning pipeline &amp;mdash; **but your analytical judgment drives every decision**:]

.pull-left[
.content-box-yellow[
.font80[**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> Weak:** "Clean this dataset." &amp;rarr; Agent applies arbitrary defaults (e.g., drops all rows with any missing value) without knowing your analytical goals.]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.font80[
**After the audit, give cleaning instructions one step at a time:**

- "Fix SignupDate: convert all values to ISO format YYYY-MM-DD using `pd.to_datetime()`. Show me the first 5 rows of SignupDate before and after."
- "Standardize Grade: replace 'Freshman' with 9. Show `value_counts()` before and after."
- "After every cleaning step, print `df.shape` so I can verify no rows were unexpectedly dropped."

---
### Verifying Agent-Cleaned Data

.font80[**The most important skill: knowing when the agent made a plausible-but-wrong decision.**]

.font75[
**Common agent mistakes in wrangling:**

1. Drops rows with ANY missing value when you only needed to handle one column.
2. Converts a ZIP code (stored as "06001") to integer 6001 &amp;mdash; destroying the leading zero.
3. Fills all missing Ages with the mean, including rows where Age was MNAR.

**Verify after every step:** compare `df.shape` before and after. Check `df.dtypes` to catch silent type conversions. Run `value_counts()` on categorical columns to confirm standardization worked.
]

--

.content-box-blue[
.font80[
**The cleaning log is your verification tool:**

- Ask: "Produce a cleaning log as a numbered list. For each step: what was changed, how many values/rows were affected, and what method was used."
- Then verify each log entry against the data: if the log says "3 duplicate rows removed," confirm with `df.shape` that you lost exactly 3 rows, not 3 different ones.
- **Final check:** rerun your original data quality audit on the cleaned dataset. Every issue from Step 1 should now be resolved.
]
]

### Hands-On: Agent-Assisted Wrangling of Class Participation Data

.font90[**Activity (pairs, 25 minutes)** &amp;mdash; using `school_participation_class1.csv` and `class2.csv`:]

.font80[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Stack and audit:&lt;/strong&gt; Prompt the agent to concatenate the two files and produce a full data quality report (shape, dtypes, missing rates, unique values per column).&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
