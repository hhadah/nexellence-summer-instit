### What Is Data?

.font85[
.three-col[
.col[
&lt;img src="assets/p03a-img.png" style="width:100%; border-radius:6px;"&gt;

**Evidence**

Information collected to examine hypotheses, address questions, or describe phenomena.
]
.col[
&lt;img src="assets/p03b-img.png" style="width:100%; border-radius:6px;"&gt;

**Foundation**

Transforms uncertainty into insight with observable reality.
]
.col[
&lt;img src="assets/p03c-img.png" style="width:100%; border-radius:6px;"&gt;

**Towards Replicable Conclusions**

Moves beyond opinion toward supported, replicable conclusions.
]
]
]

---
### Quantitative vs. Qualitative Data

&lt;div class="img-row" style="max-width: 80%; margin-left: auto; margin-right: auto;"&gt;
  &lt;div class="cell"&gt;&lt;img src="assets/p04a-img.png"&gt;&lt;/div&gt;
  &lt;div class="cell"&gt;&lt;img src="assets/p04b-img.png"&gt;&lt;/div&gt;
&lt;/div&gt;

--

.pull-left[
.content-box-blue[
.font80[
**Quantitative Data** &amp;mdash; information that can be **measured or counted**:

- Test scores
- Survey ratings
- Hours spent on homework
- Growth measurements

*Expressed in numbers.*
]
]
]

.pull-right[
.content-box-yellow[
.font80[
**Qualitative Data** &amp;mdash; descriptive, **non-numerical** information:

- Open-ended survey responses
- Observational notes
- Interview narratives
- Written explanations

*Provides context and depth.*
]
]
]

### When to Use Each Type

.pull-left[.font90[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Use Primary Data When...&lt;/strong&gt;&lt;br&gt;
  Your question is specific and unique; you need fresh data nobody has collected; you want control over how data is obtained.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Use Secondary Data When...&lt;/strong&gt;&lt;br&gt;
  Information already exists; you need to save time; you need broader context.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Best Practice&lt;/strong&gt;&lt;br&gt;
  Many strong research projects use &lt;strong&gt;both types&lt;/strong&gt; for a fuller understanding.&lt;/div&gt;
&lt;/div&gt;
]]

.pull-right[
&lt;img src="06-class_files/figure-html/img9-1.png" alt="" width="55%" style="display: block; margin: auto;" /&gt;

.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> Example:** Only surveying students who participate in sports about favorite activities.

.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> Example:** Only noticing data that supports your hypothesis.

.font85[
&lt;div class="img-row" style="max-width: 95%; margin-left: auto; margin-right: auto;"&gt;
  &lt;div class="cell"&gt;&lt;img src="assets/p19a-img.png"&gt;&lt;p&gt;&lt;strong&gt;Record Immediately&lt;/strong&gt;&lt;br&gt;.font80[Don't rely on memory &amp;mdash; write down observations right away.]&lt;/p&gt;&lt;/div&gt;

### What Is Data Ethics?

.pull-left[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/></svg> What is Data Ethics?**

Data ethics is about using data **responsibly, honestly, and fairly** &amp;mdash; and it applies to every step of the process including collecting, analyzing, sharing, or presenting it. Whether you're doing a science fair project or studying global issues, ethical data use matters.
]
]

.pull-right[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm169.8-90.7c7.9-22.3 29.1-37.3 52.8-37.3h58.3c34.9 0 63.1 28.3 63.1 63.1c0 22.6-12.1 43.5-31.7 54.8L280 264.4c-.2 13-10.9 23.6-24 23.6c-13.3 0-24-10.7-24-24V250.5c0-8.6 4.6-16.5 12.1-20.8l44.3-25.4c4.7-2.7 7.6-7.7 7.6-13.1c0-8.4-6.8-15.1-15.1-15.1H222.6c-3.4 0-6.4 2.1-7.5 5.3l-.4 1.2c-4.4 12.5-18.2 19-30.6 14.6s-19-18.2-14.6-30.6l.4-1.2zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg> Why Should We Care?**

Data can shape decisions, influence opinions, and affect real people. If used dishonestly, data can mislead, harm others, or spread false information.
]
]

### Basic Rules of Data Ethics (1&amp;ndash;3)

.font85[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Don't Cherry-Pick&lt;/strong&gt;&lt;br&gt;
  Only showing data that supports your idea and ignoring data that doesn't is dishonest. Report all results, even if they surprise or challenge your expectations.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Don't Manipulate Data to Fit Your Hypothesis&lt;/strong&gt;&lt;br&gt;
  Changing numbers or tweaking how you measure things just to get a better result is not okay. Let the data speak for itself. Don't round, group, or leave out data points to make your idea look better.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Protect People's Privacy&lt;/strong&gt;&lt;br&gt;
  If you collect data from real people, protect their identities and personal information. Ask for permission (informed consent). Keep names or sensitive details private unless permission is given.&lt;/div&gt;
&lt;/div&gt;
]

---
### Basic Rules of Data Ethics (4&amp;ndash;6)

.font85[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Be Clear and Honest&lt;/strong&gt;&lt;br&gt;
  Don't mislead with fancy graphs or confusing statistics. Avoid using tricky visuals that exaggerate results. Label graphs clearly and explain what the numbers mean.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;5&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Give Credit&lt;/strong&gt;&lt;br&gt;
  If you use data from other sources, say where it came from. Always cite your sources (websites, reports, surveys). Don't act like someone else's data is your own.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;6&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Think About Harm&lt;/strong&gt;&lt;br&gt;
  Ask: could this data hurt or stereotype anyone? Consider whether your research might unintentionally reinforce bias or harm a group of people. Avoid making generalizations based on incomplete or biased data.&lt;/div&gt;
&lt;/div&gt;
]
