### Correlation vs. Causation

.pull-left[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M406.6 374.6l96-96c12.5-12.5 12.5-32.8 0-45.3l-96-96c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224l-293.5 0 41.4-41.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-96 96c-12.5 12.5-12.5 32.8 0 45.3l96 96c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 288l293.5 0-41.4 41.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0z"/></svg> Correlation**

When two variables change together &amp;mdash; as one increases or decreases, so does the other.

*Example: ice cream sales and sunburns both increase on hot days.*

**Just because things happen together doesn't mean one causes the other!**
]
]

.pull-right[
.content-box-green[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></svg> Causation**

When one event directly results from another &amp;mdash; changing one variable produces a change in the other.

*Example: pushing the gas pedal causes a car to speed up.*

**Proving causation usually requires controlled experiments.**
]
]

### Determining Causation

.pull-left[.font90[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Conduct Controlled Experiments&lt;/strong&gt;&lt;br&gt;
  Randomly assign subjects to treatment and control groups, keeping everything else the same.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Apply Critical Thinking&lt;/strong&gt;&lt;br&gt;
  Ask if there's a logical reason one variable could influence the other.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Consider Reverse Causation&lt;/strong&gt;&lt;br&gt;
  Could B actually be causing A instead of A causing B?&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Look for Third Factors&lt;/strong&gt;&lt;br&gt;
  Could both variables be influenced by something else entirely?&lt;/div&gt;
&lt;/div&gt;
]]

### Inferential Statistics: Beyond Description

.pull-left[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm169.8-90.7c7.9-22.3 29.1-37.3 52.8-37.3h58.3c34.9 0 63.1 28.3 63.1 63.1c0 22.6-12.1 43.5-31.7 54.8L280 264.4c-.2 13-10.9 23.6-24 23.6c-13.3 0-24-10.7-24-24V250.5c0-8.6 4.6-16.5 12.1-20.8l44.3-25.4c4.7-2.7 7.6-7.7 7.6-13.1c0-8.4-6.8-15.1-15.1-15.1H222.6c-3.4 0-6.4 2.1-7.5 5.3l-.4 1.2c-4.4 12.5-18.2 19-30.6 14.6s-19-18.2-14.6-30.6l.4-1.2zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg> What Is Inferential Statistics?**

- Making conclusions that go **beyond just describing** your data.
- Helps determine if patterns are **meaningful or just random chance**.
- Uses probability to test hypotheses and make predictions.
]
]

.pull-right[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M297.2 248.9C311.6 228.3 320 203.2 320 176c0-70.7-57.3-128-128-128S64 105.3 64 176c0 27.2 8.4 52.3 22.8 72.9c3.7 5.3 8.1 11.3 12.8 17.7l0 0c12.9 17.7 28.3 38.9 39.8 59.8c10.4 19 15.7 38.8 18.3 57.5H109c-2.2-12-5.9-23.7-11.8-34.5c-9.9-18-22.2-34.9-34.5-51.8l0 0 0 0c-5.2-7.1-10.4-14.2-15.4-21.4C27.6 247.9 16 213.3 16 176C16 78.8 94.8 0 192 0s176 78.8 176 176c0 37.3-11.6 71.9-31.4 100.3c-5 7.2-10.2 14.3-15.4 21.4l0 0 0 0c-12.3 16.8-24.6 33.7-34.5 51.8c-5.9 10.8-9.6 22.5-11.8 34.5H226.4c2.6-18.7 7.9-38.6 18.3-57.5c11.5-20.9 26.9-42.1 39.8-59.8l0 0 0 0 0 0c4.7-6.4 9-12.4 12.7-17.7zM192 128c-26.5 0-48 21.5-48 48c0 8.8-7.2 16-16 16s-16-7.2-16-16c0-44.2 35.8-80 80-80c8.8 0 16 7.2 16 16s-7.2 16-16 16zm0 384c-44.2 0-80-35.8-80-80V416H272v16c0 44.2-35.8 80-80 80z"/></svg> Example Question**

### Hypotheses: Making Testable Claims

.pull-left[.font90[
.content-box-blue[
**Null Hypothesis (H&amp;#8320;)**

Claims nothing special is happening or there is no effect.

*Example: "The new studying technique has no effect on scores."*
]

.content-box-green[
**Alternative Hypothesis (H&amp;#8321;)**

What you're trying to find evidence for.

*Example: "The new studying technique improves scores."*
]

.content-box-yellow[
**Testing Process**

Collect data and analyze whether it supports the alternative or is consistent with the null.
]
]]

.pull-right[
&lt;img src="07-class_files/figure-html/img22-1.png" alt="" width="52%" style="display: block; margin: auto;" /&gt;
]

### P-Values: Measuring Probability

.pull-left[
**What Is a P-Value?**

.font90[
- A number describing how likely your data would occur by **r&lt;u&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/u&gt;** chance if the null hypothesis were true.

- Small p-value (typically below **0.&lt;u&gt;&amp;nbsp;&amp;nbsp;&lt;/u&gt;**) suggests the result is unlikely due to chance.

- Large p-value suggests the result could easily happen by chance.
]
]

.pull-right[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M512 80c0 18-14.3 34.6-38.4 48c-29.1 16.1-72.5 27.5-122.3 30.9c-3.7-1.8-7.4-3.5-11.3-5C300.6 137.4 248.2 128 192 128c-8.3 0-16.4 .2-24.5 .6l-1.1-.6C142.3 114.6 128 98 128 80c0-44.2 86-80 192-80S512 35.8 512 80zM160.7 161.1c10.2-.7 20.7-1.1 31.3-1.1c62.2 0 117.4 12.3 152.5 31.4C369.3 204.9 384 221.7 384 240c0 4-.7 7.9-2.1 11.7c-4.6 13.2-17 25.3-35 35.5c0 0 0 0 0 0c-.1 .1-.3 .1-.4 .2l0 0 0 0c-.3 .2-.6 .3-.9 .5c-35 19.4-90.8 32-153.6 32c-59.6 0-112.9-11.3-148.2-29.1c-1.9-.9-3.7-1.9-5.5-2.9C14.3 274.6 0 258 0 240c0-34.8 53.4-64.5 128-75.4c10.5-1.5 21.4-2.7 32.7-3.5zM416 240c0-21.9-10.6-39.9-24.1-53.4c28.3-4.4 54.2-11.4 76.2-20.5c16.3-6.8 31.5-15.2 43.9-25.5V176c0 19.3-16.5 37.1-43.8 50.9c-14.6 7.4-32.4 13.7-52.4 18.5c.1-1.8 .2-3.5 .2-5.3zm-32 96c0 18-14.3 34.6-38.4 48c-1.8 1-3.6 1.9-5.5 2.9C304.9 404.7 251.6 416 192 416c-62.8 0-118.6-12.6-153.6-32C14.3 370.6 0 354 0 336V300.6c12.5 10.3 27.6 18.7 43.9 25.5C83.4 342.6 135.8 352 192 352s108.6-9.4 148.1-25.9c7.8-3.2 15.3-6.9 22.4-10.9c6.1-3.4 11.8-7.2 17.2-11.2c1.5-1.1 2.9-2.3 4.3-3.4V304v5.7V336zm32 0V304 278.1c19-4.2 36.5-9.5 52.1-16c16.3-6.8 31.5-15.2 43.9-25.5V272c0 10.5-5 21-14.9 30.9c-16.3 16.3-45 29.7-81.3 38.4c.1-1.7 .2-3.5 .2-5.3zM192 448c56.2 0 108.6-9.4 148.1-25.9c16.3-6.8 31.5-15.2 43.9-25.5V432c0 44.2-86 80-192 80S0 476.2 0 432V396.6c12.5 10.3 27.6 18.7 43.9 25.5C83.4 438.6 135.8 448 192 448z"/></svg> Coin Flip Example**

- Null hypothesis: coin is fair (50% heads)
- You flip 50 times and get 40 heads
- P-value would be **very small** because this outcome is unlikely with a fair coin
- **Conclusion:** reject null hypothesis &amp;mdash; coin is probably biased
]
]

.content-box-green[
.font90[**Answers:** by **random** chance; typically below **0.05**.]

### Statistical Significance

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Set threshold (usually 0.05)&lt;/strong&gt;&lt;br&gt;
  Decide significance level before analyzing data.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Calculate p-value&lt;/strong&gt;&lt;br&gt;
  Determine probability of results under null hypothesis.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Compare to threshold&lt;/strong&gt;&lt;br&gt;
  If p &amp;lt; 0.05, result is statistically significant.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Draw conclusion&lt;/strong&gt;&lt;br&gt;
  Significant results suggest real effect, not just chance.&lt;/div&gt;
&lt;/div&gt;

### Teaching Methods Example

.content-box-blue[
**The Scenario:** two teaching methods compared with 30 students each. Method A's students scored 5 points higher on average than Method B's. **Question: is this difference meaningful or just random variation?**
]

.pull-left[
**If p-value = 0.01:**

- **B&lt;u&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/u&gt;** 0.05 threshold
- Statistically **s&lt;u&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/u&gt;** difference
- Method likely made real impact
]

.pull-right[
**If p-value = 0.3:**

- **A&lt;u&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/u&gt;** 0.05 threshold
- **N&lt;u&gt;&amp;nbsp;&amp;nbsp;&lt;/u&gt;** statistically significant
- Difference might just be **l&lt;u&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/u&gt;**
]

--

.content-box-green[
.font90[**Answers:** p = 0.01 is **below** the threshold &amp;rarr; statistically **significant**. p = 0.3 is **above** the threshold &amp;rarr; **not** significant; difference might just be **luck**.]
]

### Literature Review *(Refresher)*

.pull-left[
.content-box-blue[
A literature review is a **summary and analysis** of what has already been written on a topic.
]

**It helps you:**

.font90[
- Understand what's already known,
- See where there are gaps or debates,
- Avoid repeating others' work,
- And build a strong foundation for your own research.
]
]

&lt;img src="07-class_files/figure-html/img28-1.png" alt="" width="52%" style="display: block; margin: auto;" /&gt;
]

### How to Conduct a Lit Review *(Refresher)*

.font85[
&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Clarify Your Topic or Research Question&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Search for Reliable Sources&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Skim and Select&lt;/strong&gt; &amp;mdash; read abstracts first; choose a mix of recent, relevant, and diverse perspectives; aim for at least 5&amp;ndash;10 solid sources.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Take Notes&lt;/strong&gt; &amp;mdash; write down the main point of each source; note how it relates to your topic; use color coding or a chart to organize themes.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;5&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Group by Themes or Ideas&lt;/strong&gt; &amp;mdash; don't stop at summarizing each article one by one. Instead, group your notes by common &lt;strong&gt;&lt;u&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/u&gt;&lt;/strong&gt;, &lt;strong&gt;&lt;u&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/u&gt;&lt;/strong&gt;, or &lt;strong&gt;&lt;u&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/u&gt;&lt;/strong&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;6&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Start Writing&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;7&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Cite Everything&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;
]

--

.content-box-green[
.font90[**Step 5 answers:** group your notes by common **themes**, **disagreements**, or **trends**.]
]

### Literature Review Template

.pull-left[.font85[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M48 24C48 10.7 37.3 0 24 0S0 10.7 0 24V64 350.5 400v88c0 13.3 10.7 24 24 24s24-10.7 24-24V388l80.3-20.1c41.1-10.3 84.6-5.5 122.5 13.4c44.2 22.1 95.5 24.8 141.7 7.4l34.7-13c12.5-4.7 20.8-16.6 20.8-30V66.1c0-23-24.2-38-44.8-27.7l-9.6 4.8c-46.3 23.2-100.8 23.2-147.1 0c-35.1-17.6-75.4-22-113.5-12.5L48 52V24zm0 77.5l96.6-24.2c27-6.7 55.5-3.6 80.4 8.8c54.9 27.4 118.7 29.7 175 6.8V334.7l-24.4 9.1c-33.7 12.6-71.2 10.7-103.4-5.4c-48.2-24.1-103.3-30.1-155.6-17.1L48 338.5v-237z"/></svg> Begin with a short introduction**

What is your topic? Why is it important? Give the broad context of the problem.
]

.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M192 32h64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H384l0 352c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-352H288V448c0 17.7-14.3 32-32 32s-32-14.3-32-32V352H192c-88.4 0-160-71.6-160-160s71.6-160 160-160z"/></svg> Body**

### How to Synthesize Multiple Sources in a Lit Review

.content-box-blue[
**What does synthesis mean?**

A good lit review is **more than just summarizing** what you found. It means **combining ideas from different sources** to see how they relate to each other, not just what each one says.
]

--

.font85[
**<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M579.8 267.7c56.5-56.5 56.5-148 0-204.5c-50-50-128.8-56.5-186.3-15.4l-1.6 1.1c-14.4 10.3-17.7 30.3-7.4 44.6s30.3 17.7 44.6 7.4l1.6-1.1c32.1-22.9 76-19.3 103.8 8.6c31.5 31.5 31.5 82.5 0 114L422.3 334.8c-31.5 31.5-82.5 31.5-114 0c-27.9-27.9-31.5-71.8-8.6-103.8l1.1-1.6c10.3-14.4 6.9-34.4-7.4-44.6s-34.4-6.9-44.6 7.4l-1.1 1.6C206.5 251.2 213 330 263 380c56.5 56.5 148 56.5 204.5 0L579.8 267.7zM60.2 244.3c-56.5 56.5-56.5 148 0 204.5c50 50 128.8 56.5 186.3 15.4l1.6-1.1c14.4-10.3 17.7-30.3 7.4-44.6s-30.3-17.7-44.6-7.4l-1.6 1.1c-32.1 22.9-76 19.3-103.8-8.6C74 372 74 321 105.5 289.5L217.7 177.2c31.5-31.5 82.5-31.5 114 0c27.9 27.9 31.5 71.8 8.6 103.9l-1.1 1.6c-10.3 14.4-6.9 34.4 7.4 44.6s34.4 6.9 44.6-7.4l1.1-1.6C433.5 260.8 427 182 377 132c-56.5-56.5-148-56.5-204.5 0L60.2 244.3z"/></svg> Look for Connections** &amp;mdash; ask yourself: do the authors agree or disagree? Are they studying the same issue from different perspectives? Does one source support, expand on, or challenge another?

**<svg aria-hidden="true" role="img" viewBox="0 0 576 512" style="height:1em;width:1.12em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M264.5 5.2c14.9-6.9 32.1-6.9 47 0l218.6 101c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 149.8C37.4 145.8 32 137.3 32 128s5.4-17.9 13.9-21.8L264.5 5.2zM476.9 209.6l53.2 24.6c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 277.8C37.4 273.8 32 265.3 32 256s5.4-17.9 13.9-21.8l53.2-24.6 152 70.2c23.4 10.8 50.4 10.8 73.8 0l152-70.2zm-152 198.2l152-70.2 53.2 24.6c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 405.8C37.4 401.8 32 393.3 32 384s5.4-17.9 13.9-21.8l53.2-24.6 152 70.2c23.4 10.8 50.4 10.8 73.8 0z"/></svg> Group Ideas, Not Authors** &amp;mdash; don't organize your review by author: "Smith says..., then Jones says..." Instead, organize by theme, issue, or trend. *Example: "Many studies agree that social media affects attention span (Smith, 2021; Lee, 2020), but a few challenge this idea (Gomez, 2022)."*
]

### How to Synthesize Multiple Sources (continued)

.font85[

### What to Cite? What Not to Cite? *(Refresher)*

.pull-left[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> You should cite:**

- Direct quotes (even short ones)
- Paraphrased ideas (putting someone else's idea into your own words)
- Statistics or data
- Images, charts, or graphics you didn't create
]
]

.pull-right[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> You do not need to cite:**

- Common knowledge (e.g., "Water freezes at 0&amp;deg;C")
- Your own original thoughts

### How to Cite?

.font85[
There are different citation styles (**APA, MLA, Chicago**), but the basic idea is the same: you include the author's name, date, and sometimes the page number in your text, and then list the full details at the end of your work.

.content-box-blue[
**Example in APA Style:**

**In-text citation:** "Teens who sleep less are more likely to report symptoms of depression" (Williams, 2021, p. 45).

**Works Cited/References page:** Williams, A. (2021). *The Science of Teen Sleep.* TeenHealth Publishing.
]

.content-box-yellow[
**When citing online resources**, instead of writing just a link, include full source info:

**Not this:** https://example.com/article

**Do this:** Smith, J. (2022). Climate change and food security. *National Environmental Journal.* https://example.com/article
]
]

### Presentation Outline

.font70[
&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Title Slide:&lt;/strong&gt; Introduce yourself and the project by naming the title, presenters, date of presentation, the institutions at which the study is conducted. Add logos if you can.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Topic Slide:&lt;/strong&gt; Name your global challenge, define it (cite your source), state why this is important (cite your sources).&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Literature Review Slide:&lt;/strong&gt; What do you know about this issue based on your literature review? Have a couple statements arranged by ideas/themes. Cite your sources.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Research Question Slide:&lt;/strong&gt; Name your research question(s) and if possible hypothesis.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;5&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Methods Slide:&lt;/strong&gt; State that your work is secondary research. Introduce your data source (including the year data was collected) &amp;amp; sample (including its size and key characteristics). Name key variables. Name the tools you used to analyze data.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;6&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Results Slides:&lt;/strong&gt; First share descriptive statistics for each key variable (mean, median, mode, range). Provide numbers, graphs, tables as suitable. This can be multiple slides.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;7&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Discussion:&lt;/strong&gt; How you interpret what you have found.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;8&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Conclusion:&lt;/strong&gt; Final words and good-bye.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row-sm"&gt;
  &lt;div class="chev-sm"&gt;9&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;References:&lt;/strong&gt; List your references. Be consistent with the style.&lt;/div&gt;
&lt;/div&gt;
]

### Regression Analysis: Finding Relationships

.pull-left[
**What Is Regression?**

.font90[
- A method to **model or predict** one variable based on another.

- Finds the **"line of best fit"** through data points.

- Quantifies the relationship between variables.
]

.content-box-blue[
.font90[**Example:** predicting test scores based on study hours. The upward slope shows more study time relates to higher scores.]
]
]

.pull-right[
&lt;img src="07-class_files/figure-html/img53-1.png" alt="" width="92%" style="display: block; margin: auto;" /&gt;
]

### Linear Regression Equation

.pull-left[
.font130[$$Y = a + bX$$]

.font90[
- **Y** is the predicted value, **X** is the independent variable

- **a** is the intercept &amp;mdash; where the line crosses the y-axis (Y when X=0)

- **b** is the slope &amp;mdash; how much Y changes when X increases by one unit
]
]

.pull-right[
&lt;img src="07-class_files/figure-html/img54-1.png" alt="" width="52%" style="display: block; margin: auto;" /&gt;
]

### Regression Example: Study Hours vs. Test Scores

.pull-left[
&lt;img src="07-class_files/figure-html/img55-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
]

.pull-right[.font85[
.content-box-blue[
**Regression equation:** Score = 50 + 5&amp;times;(Hours)
]

- **Interpretation:** each additional hour studied is associated with an increase of **5 points** on the test, on average.

- **Prediction:** a student studying 8 hours would score about 50 + 5&amp;times;8 = **90 points**.

- X = study hours; Y = test score. Intercept (50) is what Y is when X is 0; slope (5) is how much Y changes when X increases by one unit.
]]

### Difference-in-Differences (DID)

.pull-left[.font90[
**How It Works**

- Compare changes over time between a treatment group and a control group.

- Calculate: **(After &amp;minus; Before for Treatment) &amp;minus; (After &amp;minus; Before for Control)**

- This removes common factors affecting both groups, isolating the treatment effect.

.content-box-green[
- Group A (with program): 70 &amp;rarr; 78 (**+8**)
- Group B (no program): 68 &amp;rarr; 70 (**+2**)
- Difference-in-differences: +8 &amp;minus; +2 = **+6 points**
]
]]

.pull-right[
&lt;img src="07-class_files/figure-html/img58-1.png" alt="" width="92%" style="display: block; margin: auto;" /&gt;
]

---
### Regression Discontinuity (RD)

.pull-left[.font90[
**How It Works**

- Takes advantage of a **sharp cutoff** for treatment assignment.

- Compares outcomes for subjects just below and just above the cutoff.

- These subjects should be very similar except for receiving treatment.

.content-box-blue[
**Example:** students scoring below 50 get special tutoring. Compare students who scored 49 vs. 51 &amp;mdash; practically the same ability, but different treatment. Any jump in outcomes at the cutoff suggests a **causal effect**.
]
]]

.pull-right[
&lt;img src="07-class_files/figure-html/img59-1.png" alt="" width="92%" style="display: block; margin: auto;" /&gt;
]

### Instrumental Variables (IV)

.pull-left[.font90[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Find an Instrument (Z)&lt;/strong&gt;&lt;br&gt;
  Something that affects X but not Y directly.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Isolate Variation&lt;/strong&gt;&lt;br&gt;
  Use only the variation in X caused by Z.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Measure Effect&lt;/strong&gt;&lt;br&gt;
  See how this "clean" variation affects Y.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Draw Conclusions&lt;/strong&gt;&lt;br&gt;
  Estimate causal impact of X on Y.&lt;/div&gt;
&lt;/div&gt;
]]

### Matching: Creating Comparable Groups

.pull-left[
.content-box-blue[
**How It Works**

- Match each treated subject with similar non-treated subjects.
- Compare outcomes between matched pairs.
- Creates balanced groups *as if* in an experiment.
]
]

.pull-right[
.content-box-green[
**Example**

For each student in a tutoring program, find another student with:

- Similar initial grades
- Similar background
- Similar motivation level

Compare outcomes between matched pairs to estimate the tutoring effect.
]
]

### Key Takeaways

.font80[
