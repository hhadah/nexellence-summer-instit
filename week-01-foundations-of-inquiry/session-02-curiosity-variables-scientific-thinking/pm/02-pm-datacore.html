### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M32 32H480c17.7 0 32 14.3 32 32V96c0 17.7-14.3 32-32 32H32C14.3 128 0 113.7 0 96V64C0 46.3 14.3 32 32 32zm0 128H480V416c0 35.3-28.7 64-64 64H96c-35.3 0-64-28.7-64-64V160zm128 80c0 8.8 7.2 16 16 16H336c8.8 0 16-7.2 16-16s-7.2-16-16-16H176c-8.8 0-16 7.2-16 16z"/></svg> Variables store information

.pull-left[
.font90[
- A **variable** in research stores information &amp;mdash; so does a **variable in Python**.

- This morning: **IV** = `hours_of_sleep`, **DV** = `test_score`.

- **PBL question:** how do we store these in Python? <svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></svg>
]

.content-box-blue[
.font90[**Big idea:** the **name** on the left holds the **value** on the right. Use it again just by typing its name.]
]
]

.pull-right[
.panelset[
.panel[.panel-name[Python]

``` python
*hours_of_sleep = 7.5   # our IV: how long a student slept
*test_score     = 88    # our DV: the outcome we measure

print(hours_of_sleep, test_score)   # use them by name
```

```
7.5 88
```
]
.panel[.panel-name[R]

``` r
*hours_of_sleep &lt;- 7.5   # our IV: how long a student slept
*test_score     &lt;- 88    # our DV: the outcome we measure

cat(hours_of_sleep, test_score)     # use them by name
```

```
7.5 88
```
]
]
]

### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M315.4 15.5C309.7 5.9 299.2 0 288 0s-21.7 5.9-27.4 15.5l-96 160c-5.9 9.9-6.1 22.2-.4 32.2s16.3 16.2 27.8 16.2H384c11.5 0 22.2-6.2 27.8-16.2s5.5-22.3-.4-32.2l-96-160zM288 312V456c0 22.1 17.9 40 40 40H472c22.1 0 40-17.9 40-40V312c0-22.1-17.9-40-40-40H328c-22.1 0-40 17.9-40 40zM128 512a128 128 0 1 0 0-256 128 128 0 1 0 0 256z"/></svg> String vs. integer vs. float

.font90[Every value has a **type**. Python tracks it for you &amp;mdash; `type()` reveals it.]

.panelset[
.panel[.panel-name[Python]

``` python
*student_name = "Maria"   # string  -&gt; text in quotes
*grade_level  = 10        # integer -&gt; a whole number
*hours_of_sleep = 7.5     # float   -&gt; a number with a decimal

print(type(student_name), type(grade_level), type(hours_of_sleep))
```

```
&lt;class 'str'&gt; &lt;class 'int'&gt; &lt;class 'float'&gt;
```
]
.panel[.panel-name[R]

``` r
*student_name &lt;- "Maria"   # character -&gt; text in quotes
*grade_level  &lt;- 10L       # integer   -&gt; a whole number (L)
*hours_of_sleep &lt;- 7.5     # numeric   -&gt; a number with decimals

c(class(student_name), class(grade_level), class(hours_of_sleep))
```

```
[1] "character" "integer"   "numeric"  
```
]
]

.font80[<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M297.2 248.9C311.6 228.3 320 203.2 320 176c0-70.7-57.3-128-128-128S64 105.3 64 176c0 27.2 8.4 52.3 22.8 72.9c3.7 5.3 8.1 11.3 12.8 17.7l0 0c12.9 17.7 28.3 38.9 39.8 59.8c10.4 19 15.7 38.8 18.3 57.5H109c-2.2-12-5.9-23.7-11.8-34.5c-9.9-18-22.2-34.9-34.5-51.8l0 0 0 0c-5.2-7.1-10.4-14.2-15.4-21.4C27.6 247.9 16 213.3 16 176C16 78.8 94.8 0 192 0s176 78.8 176 176c0 37.3-11.6 71.9-31.4 100.3c-5 7.2-10.2 14.3-15.4 21.4l0 0 0 0c-12.3 16.8-24.6 33.7-34.5 51.8c-5.9 10.8-9.6 22.5-11.8 34.5H226.4c2.6-18.7 7.9-38.6 18.3-57.5c11.5-20.9 26.9-42.1 39.8-59.8l0 0 0 0 0 0c4.7-6.4 9-12.4 12.7-17.7zM192 128c-26.5 0-48 21.5-48 48c0 8.8-7.2 16-16 16s-16-7.2-16-16c0-44.2 35.8-80 80-80c8.8 0 16 7.2 16 16s-7.2 16-16 16zm0 384c-44.2 0-80-35.8-80-80V416H272v16c0 44.2-35.8 80-80 80z"/></svg> &amp;nbsp; Type matters: you can do **math** on numbers, but not on text.]

### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M24 56c0-13.3 10.7-24 24-24H80c13.3 0 24 10.7 24 24V176h16c13.3 0 24 10.7 24 24s-10.7 24-24 24H40c-13.3 0-24-10.7-24-24s10.7-24 24-24H56V80H48C34.7 80 24 69.3 24 56zM86.7 341.2c-6.5-7.4-18.3-6.9-24 1.2L51.5 357.9c-7.7 10.8-22.7 13.3-33.5 5.6s-13.3-22.7-5.6-33.5l11.1-15.6c23.7-33.2 72.3-35.6 99.2-4.9c21.3 24.4 20.8 60.9-1.1 84.7L86.8 432H120c13.3 0 24 10.7 24 24s-10.7 24-24 24H32c-9.5 0-18.2-5.6-22-14.4s-2.1-18.9 4.3-25.9l72-78c5.3-5.8 5.4-14.6 .3-20.5zM224 64H480c17.7 0 32 14.3 32 32s-14.3 32-32 32H224c-17.7 0-32-14.3-32-32s14.3-32 32-32zm0 160H480c17.7 0 32 14.3 32 32s-14.3 32-32 32H224c-17.7 0-32-14.3-32-32s14.3-32 32-32zm0 160H480c17.7 0 32 14.3 32 32s-14.3 32-32 32H224c-17.7 0-32-14.3-32-32s14.3-32 32-32z"/></svg> Lists store many values

.font90[One variable can hold a **whole column** of values &amp;mdash; like every student's sleep.]

.panelset[
.panel[.panel-name[Python]

``` python
*sleep_hours = [7.5, 6.0, 8.0, 5.5]   # a list of values

print(len(sleep_hours))              # how many values?
```

```
4
```

``` python
print(sum(sleep_hours) / len(sleep_hours))   # the average
```

```
6.75
```
]
.panel[.panel-name[R]

``` r
*sleep_hours &lt;- c(7.5, 6.0, 8.0, 5.5)   # a vector of values

length(sleep_hours)                    # how many values?
```

```
[1] 4
```

``` r
mean(sleep_hours)                      # the average
```

```
[1] 6.75
```
]
]
