### From Opinion to Evidence:
### The Schoolday Fatigue Mystery

--

.three-col[
.col[
.content-box-blue[
**Eren's Opinion**

Students are tired because they stay up too late scrolling through social media. TikTok is ruining sleep habits.
]
]
.col[
.content-box-blue[
**Derin's Hypothesis**

Early school start times might be the real issue, not necessarily phone use.
]
]
.col[
.content-box-blue[
**Their Research Approach**

Design an anonymous survey, analyze patterns, read studies on teen sleep and blue light effects.
]
]
]

### Questioning Claims: The Mozart Effect

.font80[
&lt;div class="chev-flow"&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1.6em;width:1.4em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M0 216C0 149.7 53.7 96 120 96h8c17.7 0 32 14.3 32 32s-14.3 32-32 32h-8c-30.9 0-56 25.1-56 56v8h64c35.3 0 64 28.7 64 64v64c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V320 288 216zm256 0c0-66.3 53.7-120 120-120h8c17.7 0 32 14.3 32 32s-14.3 32-32 32h-8c-30.9 0-56 25.1-56 56v8h64c35.3 0 64 28.7 64 64v64c0 35.3-28.7 64-64 64H320c-35.3 0-64-28.7-64-64V320 288 216z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;The Claim&lt;/strong&gt;&lt;br&gt;
    "Listening to classical music while studying guarantees an A on the test."&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 320 512" style="height:1.6em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M80 160c0-35.3 28.7-64 64-64h32c35.3 0 64 28.7 64 64v3.6c0 21.8-11.1 42.1-29.4 53.8l-42.2 27.1c-25.2 16.2-40.4 44.1-40.4 74V320c0 17.7 14.3 32 32 32s32-14.3 32-32v-1.4c0-8.2 4.2-15.8 11-20.2l42.2-27.1c36.6-23.6 58.8-64.1 58.8-107.7V160c0-70.7-57.3-128-128-128H144C73.3 32 16 89.3 16 160c0 17.7 14.3 32 32 32s32-14.3 32-32zm80 320a40 40 0 1 0 0-80 40 40 0 1 0 0 80z"/></svg>&lt;/div&gt;

.pull-left[
#### What it's about:
.font90[The Earth's temperature is rising due to human activities, mainly burning fossil fuels, which leads to extreme weather, rising sea levels, and ecosystem disruptions.]
]

.pull-right[
#### Key Facts:
.font80[
- The global average temperature has already increased by **1.1&amp;deg;C (2&amp;deg;F)** since the late 1800s *(NASA, 2024)*.

- **2023 was the hottest year on record**, with ocean temperatures hitting record highs *(Copernicus Climate Change Service, 2024)*.

- By 2050, **over 1.2 billion people could be displaced** by climate-related hazards like flooding, extreme heat, and droughts *(Institute for Economics and Peace, 2020)*.
]
]

.font90[To fight climate change and reduce pollution, we need to shift from fossil fuels to cleaner energy sources like solar, wind, and hydro.]
]

.pull-right[

.font80[
- In 2023, **30% of global electricity** came from renewable sources *(IEA)*.

- Solar power is now **cheaper than coal** in many countries *(BloombergNEF, 2023)*.

- In 2023, China added **more solar capacity than the rest of the world combined**, installing over 230 gigawatts&amp;mdash;more than enough to power all of France *(International Energy Agency, 2024)*.
]

.pull-left[
#### What it's about:
.font90[Diseases that spread quickly across populations, like COVID-19, can disrupt societies, economies, and healthcare systems on a global scale.]
]

.pull-right[
#### Key Facts:
.font80[
- COVID-19 led to over **770 million confirmed cases** globally by 2024 *(WHO)*.

- Global vaccine distribution exposed **serious inequalities**: only 26% of people in low-income countries received at least one vaccine dose by late 2022 *(Our World in Data)*.

- In early 2020, China built two emergency hospitals in Wuhan **in under 10 days**, showcasing high-speed infrastructure deployment during health crises *(BBC News, 2020)*.
]
]

.pull-left[
#### What it's about:
.font90[Not everyone has equal access to basic needs like food, shelter, education, and opportunity; this gap limits both individual lives and entire communities.]
]

.pull-right[
#### Key Facts:
.font80[
- Over **700 million people**&amp;mdash;about 1 in 11 globally&amp;mdash;live on **less than $2.15 a day** *(World Bank, 2024)*.

- The **richest 1%** of the world's population owns almost **half of all global wealth** *(Oxfam, 2023)*.

- China's poverty rate fell from **88% in 1981 to less than 1% in 2020**, largely through rural development and targeted subsidies *(World Bank, 2021)*.
]
]

.pull-left[
#### What it's about:
.font90[Millions of children and teens still don't have access to quality education.]
]

.pull-right[
#### Key Facts:
.font80[
- **244 million children and youth** are out of school worldwide *(UNESCO, 2023)*.

- Girls are **more likely to be excluded** from school in low-income countries, especially during crises like war or pandemics.

- In Sub-Saharan Africa, 9 out of 10 children are unable to read a simple sentence by age 10 due to poor schooling conditions *(UNESCO, 2022)*.
]
]

.pull-left[
#### What it's about:
.font90[As more of our lives happen online, protecting our personal data from being misused by companies, hackers, or even governments is increasingly urgent.]
]

.pull-right[
#### Key Facts:
.font80[
- In 2023, **over 7 billion data records** were exposed due to breaches *(IT Governance)*.

- Teens are among **the most targeted** age groups for scams and tracking via social media and apps *(Pew Research, 2023)*.

- Yet, a global survey found that over 60% of teens do not understand how their online data is collected, shared, or used *(Harvard Kennedy School, 2023)*.

.font110[<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> **MYTH** &amp;mdash; Research shows over **97% of climate scientists** agree that human activities&amp;mdash;mainly burning fossil fuels&amp;mdash;are the primary cause of current global warming. *(NASA, 2024 &amp;ndash; climate.nasa.gov/evidence)*]

.font110[<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> **FACT** &amp;mdash; Over 56% of people worldwide live in urban settings, a number projected to reach 70% by 2050. *(United Nations, 2024 &amp;ndash; un.org/development/desa/publications)*]

.font130["Most people without access to safely managed drinking water live in sub-Saharan Africa."]

.font110[<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> **FACT** &amp;mdash; Nearly 400 million people in sub-Saharan Africa lack safely managed water, making it the most affected region. *(WHO/UNICEF Joint Monitoring Programme, 2023 &amp;ndash; washdata.org)*]

.font130["Biodiversity loss only affects wildlife and has little impact on human life."]

--

.font110[<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> **MYTH** &amp;mdash; Biodiversity loss disrupts food systems, disease regulation, and clean air/water, directly impacting human survival. *(IPBES Global Assessment Report, 2019)*]

.font130["AI makes fair decisions because it doesn't have feelings or emotions like humans."]

.font110[<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#D55E00;overflow:visible;position:relative;"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg> **MYTH** &amp;mdash; AI systems can **reproduce bias** if the data or design reflects human inequality. Lack of emotion doesn't equal fairness. *(MIT Media Lab, 2019 &amp;ndash; gender-shades.org; Nature, 2020)*]
