## Systematic Research vs. Everyday Curiosity

<div class="con">
<h2 class="sr-only">The same curiosity can be approached two ways: casual everyday observation, or a systematic research process.</h2>
<div class="contrast">
<div class="card">
<div class="cic"><i class="ti ti-eye" aria-hidden="true"></i></div>
<div><p class="ctl">Casual observation</p><p class="cds">Everyday noticing &mdash; informal, unplanned, and easy to be fooled by.</p></div>
</div>
<div class="orsep">or</div>
<div class="card">
<div class="cic"><i class="ti ti-route" aria-hidden="true"></i></div>
<div><p class="ctl">Systematic process</p><p class="cds">The same curiosity made rigorous &mdash; planned, repeatable, and built on evidence.</p></div>
</div>
</div>
<p class="note">Same curiosity, two very different ways of answering it &mdash; <b>research</b> is the systematic one.</p>
</div>

---
## The Research Cycle

<div class="rcx">
<h2 class="sr-only">The five-stage research cycle, ending with the idea that research happens all around us.</h2>
<div class="track">
<div class="line"></div>
<div class="step">
<div class="icw"><div class="ic"><i class="ti ti-help" aria-hidden="true"></i></div><div class="badge">1</div></div>
<p class="ttl">Ask a question</p>
<p class="dsc">Start with a clear, focused question worth investigating.</p>
</div>
<div class="step">
<div class="icw"><div class="ic"><i class="ti ti-books" aria-hidden="true"></i></div><div class="badge">2</div></div>
<p class="ttl">Review the literature</p>
<p class="dsc">Find out what's already known before adding to it.</p>
</div>
<div class="step">
<div class="icw"><div class="ic"><i class="ti ti-ruler-measure" aria-hidden="true"></i></div><div class="badge">3</div></div>
<p class="ttl">Design the study</p>
<p class="dsc">Plan a method that can actually answer the question.</p>
</div>
<div class="step">
<div class="icw"><div class="ic"><i class="ti ti-chart-dots" aria-hidden="true"></i></div><div class="badge">4</div></div>
<p class="ttl">Collect &amp; analyze data</p>
<p class="dsc">Gather evidence systematically and make sense of it.</p>
</div>
<div class="step">
<div class="icw"><div class="ic"><i class="ti ti-speakerphone" aria-hidden="true"></i></div><div class="badge">5</div></div>
<p class="ttl">Communicate findings</p>
<p class="dsc">Share results so others can build on or challenge them.</p>
</div>
</div>
<div class="footer">
<div class="fic"><i class="ti ti-world" aria-hidden="true"></i></div>
<div>
<p class="ftl">Research is all around us</p>
<p class="fds">Not just labs &mdash; it happens in kitchens, gyms, classrooms, and on our phones.</p>
</div>

</div>
</div>

## Sports Analytics: Do Home Teams Really Win More?

.font130[**Do home teams have a real advantage in the NBA &amp;mdash; and if so, _why_?**]

--

.three-col[
.col[
.content-box-blue[
**The Fan's Opinion**

"Of course they do! The home crowd fires up the players and rattles the visitors."
]
]
.col[
.content-box-blue[
**An Analyst's Hypothesis**

Maybe it isn't the crowd at all &amp;mdash; it could be travel fatigue, familiar rims, or favorable refereeing.
]
]
.col[
.content-box-blue[
**A Research Approach**

Pull every NBA game from basketball-reference.com, compare home vs. away win rates, then test _which_ story the evidence supports.
]
]
]

.three-col[
.col[
<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:2.5em;width:2.5em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm169.8-90.7c7.9-22.3 29.1-37.3 52.8-37.3h58.3c34.9 0 63.1 28.3 63.1 63.1c0 22.6-12.1 43.5-31.7 54.8L280 264.4c-.2 13-10.9 23.6-24 23.6c-13.3 0-24-10.7-24-24V250.5c0-8.6 4.6-16.5 12.1-20.8l44.3-25.4c4.7-2.7 7.6-7.7 7.6-13.1c0-8.4-6.8-15.1-15.1-15.1H222.6c-3.4 0-6.4 2.1-7.5 5.3l-.4 1.2c-4.4 12.5-18.2 19-30.6 14.6s-19-18.2-14.6-30.6l.4-1.2zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg>

## Case Study: How We Learned Smoking Causes Cancer

<div class="rcx">
<h2 class="sr-only">A horizontal five-stage research cycle showing how scientists established that smoking causes lung cancer, from observation to policy change.</h2>
<div class="track">
<div class="line"></div>
<div class="step">
<div class="icw"><div class="ic"><i class="ti ti-eye" aria-hidden="true"></i></div><div class="badge">1</div></div>
<p class="ttl">Observational data</p>
<p class="dsc">Doctors noticed lung cancer climbing as cigarette use spread.</p>
<span class="tag"><i class="ti ti-refresh" aria-hidden="true"></i> ask a question</span>
</div>
<div class="step">
<div class="icw"><div class="ic"><i class="ti ti-bulb" aria-hidden="true"></i></div><div class="badge">2</div></div>
<p class="ttl">Form a hypothesis</p>
<p class="dsc">Could cigarettes be causing these cancers, not just coincide with them?</p>
<span class="tag"><i class="ti ti-refresh" aria-hidden="true"></i> review the literature</span>
</div>
<div class="step">
<div class="icw"><div class="ic"><i class="ti ti-clipboard" aria-hidden="true"></i></div><div class="badge">3</div></div>
<p class="ttl">Design the study</p>
<p class="dsc">Compare smokers and non-smokers in large case-control and cohort studies.</p>
<span class="tag"><i class="ti ti-refresh" aria-hidden="true"></i> design the study</span>
</div>
<div class="step">
<div class="icw"><div class="ic"><i class="ti ti-chart-line" aria-hidden="true"></i></div><div class="badge">4</div></div>
<p class="ttl">Gather evidence</p>
<p class="dsc">Smokers were far more likely to develop cancer &mdash; and more so the heavier the habit.</p>

## Case Study: Research Behind a Taylor Swift Concert

<div class="rcx">
<h2 class="sr-only">A horizontal five-stage research cycle showing how a curiosity about a Taylor Swift concert's effect on a town becomes a study that informs city and business decisions.</h2>
<div class="track">

<div class="step">

.font90[The switch from fossil fuels to clean energy&amp;mdash;solar, wind, hydro&amp;mdash;is already showing up in your life: the EVs on your street, solar panels on rooftops, and how your future home and phone get powered.]
]

.pull-right[
#### Key Facts:
.font80[
- In 2023, **30% of global electricity** came from renewable sources *(IEA)*.

- Solar power is now **cheaper than coal** in many countries *(BloombergNEF, 2023)*.

- **Nearly 1 in 5 new cars** sold worldwide in 2023 was electric&amp;mdash;up from almost none a decade ago *(IEA, 2024)*.
]
]

.font90[You lived through one. COVID-19 closed schools, moved class to a screen, and canceled sports, concerts, and graduations&amp;mdash;showing how fast a virus can upend everyday life.]
]

.pull-right[
#### Key Facts:
.font80[
- COVID-19 led to over **770 million confirmed cases** globally by 2024 *(WHO)*.

- Global vaccine distribution exposed **serious inequalities**: only 26% of people in low-income countries received at least one vaccine dose by late 2022 *(Our World in Data)*.

- At the peak in 2020, schools closed for **about 1.6 billion students** across **190+ countries**&amp;mdash;likely including yours *(UNESCO, 2020)*.
]
]

.pull-left[
#### What it's about:
.font90[Two students with the same talent can face completely different futures based on family income&amp;mdash;shaping whether they can afford a laptop, internet, tutoring, or college.]
]

.pull-right[
#### Key Facts:
.font80[
- Over **700 million people**&amp;mdash;about 1 in 11 globally&amp;mdash;live on **less than $2.15 a day** *(World Bank, 2024)*.

- The **richest 1%** of the world's population owns almost **half of all global wealth** *(Oxfam, 2023)*.

- About **2.6 billion people are still offline**, making online schoolwork and opportunities far harder to reach *(ITU, 2023)*.
]
]

.pull-left[
#### What it's about:
.font90[Imagine not being able to finish high school. For millions of teens, school isn't a given&amp;mdash;it's blocked by cost, conflict, or simply being a girl.]
]

.pull-right[
#### Key Facts:
.font80[
- **244 million children and youth** are out of school worldwide *(UNESCO, 2023)*.

- Girls are **more likely to be excluded** from school in low-income countries, especially during crises like war or pandemics.

- About **160 million children**&amp;mdash;many of them teens&amp;mdash;are in child labor instead of school *(ILO &amp;amp; UNICEF, 2021)*.
]
]

.pull-left[
#### What it's about:
.font90[Every app you scroll&amp;mdash;TikTok, Instagram, Snapchat&amp;mdash;collects data about you: what you watch, where you go, and who you talk to. Who owns that data, and how it's used, is a growing fight.]
]

.pull-right[
#### Key Facts:
.font80[
- US teens spend an average of **4.8 hours a day** on social media&amp;mdash;nearly **6 hours** for 17-year-olds&amp;mdash;every minute feeding data to apps *(Gallup, 2023)*.

- In 2023, **over 7 billion data records** were exposed in breaches *(IT Governance, 2024)*.

- Over **60% of teens don't understand** how their online data is collected, shared, or used *(Harvard Kennedy School, 2023)*.
]
]

.pull-left[
#### What it's about:
.font90[The pressure you feel&amp;mdash;school, grades, social media, the future&amp;mdash;is part of a real and growing crisis in how young people are doing emotionally.]
]

.pull-right[
#### Key Facts:
.font80[
- Globally, about **1 in 7 teens (ages 10&amp;ndash;19)** lives with a mental health disorder *(WHO, 2024)*.

- In 2023, **about 40% of US high school students** felt persistently sad or hopeless *(CDC, 2023)*.

- Suicide is one of the **leading causes of death** for people aged 15&amp;ndash;29 worldwide *(WHO, 2024)*.
]
]

.pull-left[

.font90[From the feeds that pick your videos to chatbots that write essays, AI is reshaping how you learn, create, and&amp;mdash;eventually&amp;mdash;work. It also raises big questions about fairness and truth.]
]

.pull-right[
#### Key Facts:
.font80[
- **ChatGPT reached 100 million users in about 2 months**&amp;mdash;the fastest-growing consumer app at the time *(UBS / Reuters, 2023)*.

- **About 1 in 4 US teens** have used ChatGPT for schoolwork&amp;mdash;**double** the share a year earlier *(Pew Research, 2025)*.

- The IMF estimates **~40% of jobs worldwide** are exposed to AI, reshaping the careers you're heading into *(IMF, 2024)*.
]
]

.font90[Half of what you scroll past could be misleading. Telling real news from rumors, ads, and AI-generated fakes is becoming a basic survival skill online.]
]

.pull-right[
#### Key Facts:
.font80[
- On social media, **false news spreads about 6&amp;times; faster** than the truth *(MIT, Science, 2018)*.

- Falsehoods are **70% more likely to be shared** than true stories *(MIT, Science, 2018)*.

- The World Economic Forum ranked **misinformation the #1 short-term global risk** for 2024, driven largely by AI *(WEF, 2024)*.
]
]

.font90[You turn on a tap without thinking&amp;mdash;but billions of people can't. Access to safe water and a working toilet still shapes health, school, and daily life around the world.]
]

.pull-right[
#### Key Facts:
.font80[
- **2.2 billion people** still lack safely managed drinking water *(WHO/UNICEF, 2023)*.

- **3.5 billion people** lack safely managed sanitation, like a safe toilet *(WHO/UNICEF, 2023)*.

- In homes without water on tap, **women and girls** do most of the water-collecting&amp;mdash;time that could be spent in school *(WHO/UNICEF, 2023)*.
