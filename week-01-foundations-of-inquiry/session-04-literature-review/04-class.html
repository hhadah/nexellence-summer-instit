### Correlation vs. Causation

.pull-left[
.content-box-blue[
### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M406.6 374.6l96-96c12.5-12.5 12.5-32.8 0-45.3l-96-96c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224l-293.5 0 41.4-41.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-96 96c-12.5 12.5-12.5 32.8 0 45.3l96 96c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 288l293.5 0-41.4 41.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0z"/></svg> Correlation

Two variables change together or are related.

- Shows a pattern or relationship
- Doesn't prove one causes the other
- Found in surveys, observations, etc.
]
]

.pull-right[
.content-box-green[
### <svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></svg> Causation

One variable directly causes changes in another.

- Shows cause and effect
- Requires controlled experiments
- Harder to establish definitively
]
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.center[**Remember:** "Correlation does not equal causation" is a fundamental principle in research.]

  &lt;div class="chev-step"&gt;

### Experiment Procedure Planning

.pull-left[
&lt;img src="04-class_files/figure-html/img13-1.png" alt="" width="58%" style="display: block; margin: auto;" /&gt;
]

.pull-right[.font90[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Define Your Groups&lt;/strong&gt;&lt;br&gt;
  Decide who or what will be in experimental and control groups. Use random assignment when possible.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Define the Treatment&lt;/strong&gt;&lt;br&gt;
  Clearly describe what you'll do with the experimental group. Be specific enough for replication.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Define Control Activities&lt;/strong&gt;&lt;br&gt;

.pull-right[.font90[

  &lt;div class="chev-text"&gt;&lt;strong&gt;Distribution Method&lt;/strong&gt;&lt;br&gt;
  Decide how to give out your survey: paper, online, in-person. Each has pros and cons for reach and response rate.&lt;/div&gt;

&lt;div class="chev-row"&gt;

  &lt;div class="chev-text"&gt;&lt;strong&gt;Target Respondents&lt;/strong&gt;&lt;br&gt;
  Define who should take your survey. Aim for a representative sample, not just friends.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Question Design&lt;/strong&gt;&lt;br&gt;

&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;

### Observation Procedure Planning

.pull-left[
&lt;img src="04-class_files/figure-html/img15-1.png" alt="" width="58%" style="display: block; margin: auto;" /&gt;

.pull-right[.font90[

  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Choose Locations and Times&lt;/strong&gt;&lt;br&gt;

&lt;/div&gt;

&lt;div class="chev-row"&gt;

  &lt;div class="chev-text"&gt;&lt;strong&gt;Define Observation Focus&lt;/strong&gt;&lt;br&gt;

&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Plan to Minimize Influence&lt;/strong&gt;&lt;br&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
