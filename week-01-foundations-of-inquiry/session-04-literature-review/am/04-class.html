---
### What is a Literature Review?

.pull-left[
&lt;img src="assets/lit-template-reading.png" width="60%" style="border-radius: 6px;"&gt;
]

.pull-right[
.font90[
A **literature review** is a summary and analysis of what has *already* been written on a topic.

It helps you:
- Understand what's already known
- See where there are gaps or debates
- Avoid repeating others' work
- Build a strong foundation for your own research
]
]

---
### How to Conduct a Lit Review

.font90[
**Step 1: Clarify Your Topic or Research Question**

**Step 2: Search for Reliable Sources**

**Step 3: Skim and Select**
- Read abstracts first to decide if the source is relevant.
- Choose a mix of recent, relevant, and diverse perspectives.
- Aim for at least **5–10 solid sources** (depending on assignment length).
]

### Reliable vs. Unreliable Sources

.pull-left[
.content-box-blue[
### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 48a208 208 0 1 1 0 416 208 208 0 1 1 0-416zm0 464A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209c9.4-9.4 9.4-24.6 0-33.9s-24.6-9.4-33.9 0l-111 111-47-47c-9.4-9.4-24.6-9.4-33.9 0s-9.4 24.6 0 33.9l64 64c9.4 9.4 24.6 9.4 33.9 0L369 209z"/></svg> Reliable Sources

- Backed by verifiable evidence
- Created by experts
- Undergo review processes
- Transparent about methods
- Cite their sources
]
]

.content-box-yellow[
### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:currentColor;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> Unreliable Sources

#### <svg aria-hidden="true" role="img" viewBox="0 0 576 512" style="height:1em;width:1.12em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M264.5 5.2c14.9-6.9 32.1-6.9 47 0l218.6 101c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 149.8C37.4 145.8 32 137.3 32 128s5.4-17.9 13.9-21.8L264.5 5.2zM476.9 209.6l53.2 24.6c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 277.8C37.4 273.8 32 265.3 32 256s5.4-17.9 13.9-21.8l53.2-24.6 152 70.2c23.4 10.8 50.4 10.8 73.8 0l152-70.2zm-152 198.2l152-70.2 53.2 24.6c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 405.8C37.4 401.8 32 393.3 32 384s5.4-17.9 13.9-21.8l53.2-24.6 152 70.2c23.4 10.8 50.4 10.8 73.8 0z"/></svg> Primary / Secondary / Tertiary

- **Primary:** original work or raw data (e.g., a study, a diary, survey results)
- **Secondary:** interprets or analyzes primary work (e.g., a review article)
- **Tertiary:** compiles &amp; summarizes (e.g., encyclopedias, textbooks)
]
]

.content-box-green[

### How to Read an Abstract Efficiently

.pull-left[
.font90[
Skim the abstract and ask four questions:

1. **What was the research question?**
2. **How did they study it?**
3. **What did they find?**
4. **What did they conclude?**
]

### How to Conduct a Lit Review

.center[
  .orange[From the start]
  ]
.font90[
**Step 1: Clarify Your Topic or Research Question**

**Step 2: Search for Reliable Sources**

**Step 3: Skim and Select**
- Read abstracts first to decide if the source is relevant.
- Choose a mix of recent, relevant, and diverse perspectives.
- Aim for at least **5–10 solid sources** (depending on assignment length).
]

---
### How to Conduct a Lit Review

.font85[
**Step 4: Take Notes**
- Write down the main point of each source.
- Note how it relates to your topic, and any key quotes or data.
- Use color coding or a chart to organize themes or arguments.

**Step 5: Group by Themes or Ideas**
- Don't stop at summarizing each article one by one.
- Instead, group your notes by common themes, disagreements, or trends.
- Ask: *What do these sources have in common? How do they differ?*

**Step 6: Start Writing**

**Step 7: Cite Everything** .font80[(we will cover *how* next week)]
]

.pull-left[
&lt;img src="assets/lit-compass-research.png" width="60%" style="border-radius: 6px;"&gt;
]

.pull-right[
.font90[
**Begin with a short introduction**
- What is your topic?
- Why is it important?

**Body**
- Share what other studies have found.
- Organize by **themes, not by author**.

**Summary**
- Clarify how *your* project connects to past research.
]

// adds .remark-code-has-line-highlighted class to <pre> parent elements

(function(d) {
  const hlines = d.querySelectorAll('.remark-code-line-highlighted');
  const preParents = [];
  const findPreParent = function(line, p = 0) {
    if (p > 1) return null; // traverse up no further than grandparent
    const el = line.parentElement;
    return el.tagName === "PRE" ? el : findPreParent(el, ++p);
  };

  for (let line of hlines) {
    let pre = findPreParent(line);
    if (pre && !preParents.includes(pre)) preParents.push(pre);
  }
  preParents.forEach(p => p.classList.add("remark-code-has-line-highlighted"));

slideshow._releaseMath = function(el) {
  var i, text, code, codes = el.getElementsByTagName('code');
  for (i = 0; i < codes.length;) {
    code = codes[i];
    if (code.parentNode.tagName !== 'PRE' && code.childElementCount === 0) {
      text = code.textContent;
      if (/^\\\((.|\s)+\\\)$/.test(text) || /^\\\[(.|\s)+\\\]$/.test(text) ||

    }
    i++;
  }
};
