.pull-left[
.font90[
- A **mean** tells you the *center* &amp;mdash; but two very different datasets can share the same mean.

- We need numbers for the **center** *and* the **spread**, plus a picture of the **shape**.

- Today's pipeline: **summarise &amp;rarr; visualize &amp;rarr; describe in plain English.**
]
]

.pull-right[
.content-box-blue[
.font90[**Big idea:** a *distribution* is the full pattern of values a variable takes &amp;mdash; not just its average.]
]
]

.three-col[
.col[
.content-box-blue[
.font80[
**Mean**&lt;br&gt;
The balance point. Uses *every* value &amp;mdash; so it gets **pulled by outliers**.
]
]
]
.col[
.content-box-green[
.font80[
**Median**&lt;br&gt;
The middle value. **Robust to outliers** &amp;mdash; better when data is skewed.
]
]
]
.col[
.content-box-yellow[
.font80[
**Std. Dev.**&lt;br&gt;
Typical distance from the mean. **Small** = clustered; **large** = spread out.
]
]
]
]

.content-box-blue[
.font85[<svg aria-hidden="true" role="img" viewBox="0 0 384 512" style="height:1em;width:0.75em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M297.2 248.9C311.6 228.3 320 203.2 320 176c0-70.7-57.3-128-128-128S64 105.3 64 176c0 27.2 8.4 52.3 22.8 72.9c3.7 5.3 8.1 11.3 12.8 17.7l0 0c12.9 17.7 28.3 38.9 39.8 59.8c10.4 19 15.7 38.8 18.3 57.5H109c-2.2-12-5.9-23.7-11.8-34.5c-9.9-18-22.2-34.9-34.5-51.8l0 0 0 0c-5.2-7.1-10.4-14.2-15.4-21.4C27.6 247.9 16 213.3 16 176C16 78.8 94.8 0 192 0s176 78.8 176 176c0 37.3-11.6 71.9-31.4 100.3c-5 7.2-10.2 14.3-15.4 21.4l0 0 0 0c-12.3 16.8-24.6 33.7-34.5 51.8c-5.9 10.8-9.6 22.5-11.8 34.5H226.4c2.6-18.7 7.9-38.6 18.3-57.5c11.5-20.9 26.9-42.1 39.8-59.8l0 0 0 0 0 0c4.7-6.4 9-12.4 12.7-17.7zM192 128c-26.5 0-48 21.5-48 48c0 8.8-7.2 16-16 16s-16-7.2-16-16c0-44.2 35.8-80 80-80c8.8 0 16 7.2 16 16s-7.2 16-16 16zm0 384c-44.2 0-80-35.8-80-80V416H272v16c0 44.2-35.8 80-80 80z"/></svg> &amp;nbsp; **When is median better than mean?** Income, house prices, test scores with a few extreme values &amp;mdash; one billionaire (or one zero) drags the mean, not the median.]
]

### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M315.4 15.5C309.7 5.9 299.2 0 288 0s-21.7 5.9-27.4 15.5l-96 160c-5.9 9.9-6.1 22.2-.4 32.2s16.3 16.2 27.8 16.2H384c11.5 0 22.2-6.2 27.8-16.2s5.5-22.3-.4-32.2l-96-160zM288 312V456c0 22.1 17.9 40 40 40H472c22.1 0 40-17.9 40-40V312c0-22.1-17.9-40-40-40H328c-22.1 0-40 17.9-40 40zM128 512a128 128 0 1 0 0-256 128 128 0 1 0 0 256z"/></svg> Three shapes you will meet

.three-col[
.col[
.content-box-blue[
.font80[
**Normal**&lt;br&gt;
Symmetric bell. Mean &amp;asymp; median. Most values near the center.
]
]
]
.col[
.content-box-yellow[
.font80[
**Skewed**&lt;br&gt;
One long tail. Mean is pulled toward the tail &amp;mdash; **report the median**.
]
]
]
.col[
.content-box-green[
.font80[
**Bimodal**&lt;br&gt;
Two peaks. Often a sign of **two hidden groups** mixed together.
]
]
]
]

.font80[<svg aria-hidden="true" role="img" viewBox="0 0 640 512" style="height:1em;width:1.25em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M144 0a80 80 0 1 1 0 160A80 80 0 1 1 144 0zM512 0a80 80 0 1 1 0 160A80 80 0 1 1 512 0zM0 298.7C0 239.8 47.8 192 106.7 192h42.7c15.9 0 31 3.5 44.6 9.7c-1.3 7.2-1.9 14.7-1.9 22.3c0 38.2 16.8 72.5 43.3 96c-.2 0-.4 0-.7 0H21.3C9.6 320 0 310.4 0 298.7zM405.3 320c-.2 0-.4 0-.7 0c26.6-23.5 43.3-57.8 43.3-96c0-7.6-.7-15-1.9-22.3c13.6-6.3 28.7-9.7 44.6-9.7h42.7C592.2 192 640 239.8 640 298.7c0 11.8-9.6 21.3-21.3 21.3H405.3zM224 224a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zM128 485.3C128 411.7 187.7 352 261.3 352H378.7C452.3 352 512 411.7 512 485.3c0 14.7-11.9 26.7-26.7 26.7H154.7c-14.7 0-26.7-11.9-26.7-26.7z"/></svg> &amp;nbsp; A bimodal DV is a clue: maybe boys vs. girls, or tutored vs. solo studiers behave differently.]
