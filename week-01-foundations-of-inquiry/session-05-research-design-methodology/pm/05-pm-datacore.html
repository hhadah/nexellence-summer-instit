.pull-left[
.content-box-green[
.font80[**Use `dropna()` when:** missing rows are *few*, and dropping them won't bias your sample.]
]
]

.pull-right[
.content-box-yellow[
.font80[**Risk:** you throw away *every other value* in that row too &amp;mdash; and may shrink small datasets fast.]
]
]

```

```
median hours of sleep: 7.0
```

``` python
*filled = df["hours_of_sleep"].fillna(median_sleep) # fill -- shown, not yet committed

```
[7.5, 6.0, 8.0, 5.5, 7.0, 7.0]

.pull-left[
.content-box-green[
.font80[**Use `fillna()` when:** you can't afford to lose rows; fill with the **median** (numbers) or **mode** (categories).]
]
]

.pull-right[
.content-box-yellow[
.font80[**Risk:** you're *inventing* values. Filling a key outcome variable can hide the truth.]
]
]

.three-col[
.col[
.content-box-blue[
.font80[
**Drop the row**&lt;br&gt;
A *few* rows missing, or the **outcome (DV)** is missing &amp;mdash; you can't honestly invent a result.
]
]
]
.col[
.content-box-green[
.font80[
**Fill the value**&lt;br&gt;
*Many* rows affected and the gap is in a *secondary* column &amp;mdash; impute the median / mode.
]
]
]
.col[
.content-box-yellow[
.font80[
**Always**&lt;br&gt;
**Document it.** Say how many rows you dropped or filled, and why &amp;mdash; in your cleaning log.
]
]
]
