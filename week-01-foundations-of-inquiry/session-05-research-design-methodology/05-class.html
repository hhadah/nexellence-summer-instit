### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M448 256A192 192 0 1 0 64 256a192 192 0 1 0 384 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm256 80a80 80 0 1 0 0-160 80 80 0 1 0 0 160zm0-224a144 144 0 1 1 0 288 144 144 0 1 1 0-288zM224 256a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg> Validity

**Whether you're actually measuring what you intend to measure.**

- Does your method truly address your question?
- Are your measurements relevant?
- Can you draw appropriate conclusions?
]
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.center[.font110[Good research needs **both reliability and validity** to be trustworthy.]]

### Improving Validity

.pull-left[
&lt;img src="05-class_files/figure-html/img5-1.png" alt="" width="58%" style="display: block; margin: auto;" /&gt;
]

.pull-right[.font90[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Align Methods with Questions&lt;/strong&gt;&lt;br&gt;
  Choose research approaches that directly address what you want to know.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Use Multiple Measures&lt;/strong&gt;&lt;br&gt;
  Collect different types of data to get a more complete picture of what you're studying.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Control Variables&lt;/strong&gt;&lt;br&gt;
  Identify and minimize factors that could confuse your results.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Pilot Test&lt;/strong&gt;&lt;br&gt;
  Try out your methods on a small scale first to identify and fix problems.&lt;/div&gt;
&lt;/div&gt;
]]

### Sampling: Who or What Will You Study?

.pull-left[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm169.8-90.7c7.9-22.3 29.1-37.3 52.8-37.3h58.3c34.9 0 63.1 28.3 63.1 63.1c0 22.6-12.1 43.5-31.7 54.8L280 264.4c-.2 13-10.9 23.6-24 23.6c-13.3 0-24-10.7-24-24V250.5c0-8.6 4.6-16.5 12.1-20.8l44.3-25.4c4.7-2.7 7.6-7.7 7.6-13.1c0-8.4-6.8-15.1-15.1-15.1H222.6c-3.4 0-6.4 2.1-7.5 5.3l-.4 1.2c-4.4 12.5-18.2 19-30.6 14.6s-19-18.2-14.6-30.6l.4-1.2zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg> What is a Sample?**

A smaller subset of the population or items you're interested in.

Since studying everyone or everything is usually impossible, researchers select representatives.
]
]

.pull-right[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M336 352c97.2 0 176-78.8 176-176S433.2 0 336 0S160 78.8 160 176c0 18.7 2.9 36.8 8.3 53.7L7 391c-4.5 4.5-7 10.6-7 17v80c0 13.3 10.7 24 24 24h80c13.3 0 24-10.7 24-24V448h40c13.3 0 24-10.7 24-24V384h40c6.4 0 12.5-2.5 17-7l33.3-33.3c16.9 5.4 35 8.3 53.7 8.3zM376 96a40 40 0 1 1 0 80 40 40 0 1 1 0-80z"/></svg> Key Sampling Questions**

- How many people/items will you include?
- How will you select them?
- Will your sample represent the larger group?
- What potential biases might affect your selection?
]
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.center[Good sampling makes your results more **reliable, generalizable and valid**.]

.content-box-blue[

### Sampling Bias

.pull-left[
.content-box-yellow[
**<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg> What is Sampling Bias?**

When your sample doesn't fairly represent the population you're studying.

This can skew results and lead to incorrect conclusions.
]
]

.pull-right[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M416 0C400 0 288 32 288 176V288c0 35.3 28.7 64 64 64h32V480c0 17.7 14.3 32 32 32s32-14.3 32-32V352 240 32c0-17.7-14.3-32-32-32zM64 16C64 7.8 57.9 1 49.7 .1S34.2 4.6 32.4 12.5L2.1 148.8C.7 155.1 0 161.5 0 167.9c0 45.9 35.1 83.6 80 87.7V480c0 17.7 14.3 32 32 32s32-14.3 32-32V255.6c44.9-4.1 80-41.8 80-87.7c0-6.4-.7-12.8-2.1-19.1L191.6 12.5c-1.8-8-9.3-13.3-17.4-12.4S160 7.8 160 16V150.2c0 5.4-4.4 9.8-9.8 9.8c-5.1 0-9.3-3.9-9.8-9L127.9 14.6C127.2 6.3 120.3 0 112 0s-15.2 6.3-15.9 14.6L83.7 151c-.5 5.1-4.7 9-9.8 9c-5.4 0-9.8-4.4-9.8-9.8V16zm48.3 152l-.3 0-.3 0 .3-.7 .3 .7z"/></svg> Example**

Surveying only cooking club members about school lunch preferences would give biased results.

These students likely have different food interests than the general student body.
]
]

&lt;div style="clear: both;"&gt;&lt;/div&gt;

.center[Even with limited resources, try to **broaden your sample** to reduce obvious biases.]

### Practical Sampling Tips

.font90[
.pull-left[

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;1&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Clarify Your Topic or Research Question&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;2&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Search for Reliable Sources&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;3&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Skim and Select&lt;/strong&gt;&lt;br&gt;
  Read abstracts first to decide if the source is relevant. Choose a mix of recent, relevant, and diverse perspectives. Aim for at least 5&amp;ndash;10 solid sources (depending on assignment length).&lt;/div&gt;
&lt;/div&gt;

&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;4&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Take Notes&lt;/strong&gt;&lt;br&gt;
  Write down the main point of each source. Note how it relates to your topic, and any key quotes or data. Use color coding or a chart to organize themes or arguments.&lt;/div&gt;
&lt;/div&gt;
]

### How to Conduct a Lit Review (Steps 5&amp;ndash;7)

.font90[
&lt;div class="chev-row"&gt;
  &lt;div class="chev"&gt;5&lt;/div&gt;
  &lt;div class="chev-text"&gt;&lt;strong&gt;Group by Themes or Ideas&lt;/strong&gt;&lt;br&gt;

### What to Cite? What Not to Cite?

.pull-left[
.content-box-blue[
**<svg aria-hidden="true" role="img" viewBox="0 0 448 512" style="height:1em;width:0.88em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#009E73;overflow:visible;position:relative;"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg> You should cite:**

- Direct quotes (even short ones)
- Paraphrased ideas (putting someone else's idea into your own words)
- Statistics or data
- Images, charts, or graphics you didn't create
]
]

.pull-right[
.content-box-yellow[
