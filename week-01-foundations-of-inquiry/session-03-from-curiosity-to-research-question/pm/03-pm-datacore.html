### <svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#2e8b57;overflow:visible;position:relative;"><path d="M3.9 54.9C10.5 40.9 24.5 32 40 32H472c15.5 0 29.5 8.9 36.1 22.9s4.6 30.5-5.2 42.5L320 320.9V448c0 12.1-6.8 23.2-17.7 28.6s-23.8 4.3-33.5-3l-64-48c-8.1-6-12.8-15.5-12.8-25.6V320.9L9 97.3C-.7 85.4-2.8 68.8 3.9 54.9z"/></svg> Why filter? From the *whole* dataset to *your* question

.pull-left[
.font90[
- A dataset holds **everyone**. Your research question is about a **specific group**.

- This morning: maybe your population is **9th graders**, or **students who sleep less than 7 hours**.

- **Filtering** keeps only the rows that match &amp;mdash; so every later number describes the group you actually care about.
]
]

.pull-right[
.content-box-blue[
.font90[**Big idea:** a filter is a **yes/no test** applied to every row. Rows that pass stay; rows that fail drop out.]
]
]

.font80[<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1em;width:1em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#4a7fb5;overflow:visible;position:relative;"><path d="M64 256V160H224v96H64zm0 64H224v96H64V320zm224 96V320H448v96H288zM448 256H288V160H448v96zM64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H64z"/></svg> &amp;nbsp; We continue with `study_habits.csv` &amp;mdash; swap in **your** team file.]
