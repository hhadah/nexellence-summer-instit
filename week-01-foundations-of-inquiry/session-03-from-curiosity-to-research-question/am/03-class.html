### Refresher cont'd: The Research Process

.font110[The journey from question to insight follows these essential steps:]

.font80[
&lt;div class="chev-flow"&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1.6em;width:1.6em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm169.8-90.7c7.9-22.3 29.1-37.3 52.8-37.3h58.3c34.9 0 63.1 28.3 63.1 63.1c0 22.6-12.1 43.5-31.7 54.8L280 264.4c-.2 13-10.9 23.6-24 23.6c-13.3 0-24-10.7-24-24V250.5c0-8.6 4.6-16.5 12.1-20.8l44.3-25.4c4.7-2.7 7.6-7.7 7.6-13.1c0-8.4-6.8-15.1-15.1-15.1H222.6c-3.4 0-6.4 2.1-7.5 5.3l-.4 1.2c-4.4 12.5-18.2 19-30.6 14.6s-19-18.2-14.6-30.6l.4-1.2zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;1. Ask a Question&lt;/strong&gt;&lt;br&gt;
    Formulate a clear, specific question worth investigating.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="chev-step"&gt;
    &lt;div class="chev-right"&gt;<svg aria-hidden="true" role="img" viewBox="0 0 512 512" style="height:1.6em;width:1.6em;vertical-align:-0.125em;margin-left:auto;margin-right:auto;font-size:inherit;fill:#0148A4;overflow:visible;position:relative;"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;2. Gather Information&lt;/strong&gt;&lt;br&gt;
    Review the literature &amp; collect relevant data through appropriate methods.&lt;/p&gt;

### &lt;strong style="color:#A4123F;"&gt;B&lt;/strong&gt;alanced (Well-Scoped)

### &lt;strong style="color:#A4123F;"&gt;C&lt;/strong&gt;lear &amp; &lt;strong style="color:#A4123F;"&gt;F&lt;/strong&gt;ocused

### .font70[.red[B]RIC-FOR:] Balanced in Scope (aka Well-Scoped Questions)

.three-col[
.col[
.content-box-yellow[
**Too Broad**

"What is the history of the United States?"

Spans hundreds of years and countless topics.
]
]
.col[
.content-box-yellow[
**Too Narrow**

"What was the price of bread in our town on January 1, 1950?"

More of a trivia fact than a research project.
]
]
.col[
.content-box-green[
**Just Right**

"How have food prices in our town changed from 1950 to today, and why?"

Focused yet allows for meaningful analysis.
]
]
]

### .font70[BRI.red[C-F]OR:] Clear and Focused Questions

&lt;br&gt;

.pull-left[
.content-box-yellow[
**Too Broad**

"What causes climate change?"

This spans science, policy, history, and economics&amp;mdash;a lifetime of work!
]
]

.pull-right[
.content-box-green[
**Well-Focused**

"How do car emissions contribute to climate change in my city?"

Narrows to one cause, one effect, and one location.
]
]

---
### .font70[BRIC-F.red[O]R:] Open-Ended Questions

.pull-left[.font90[
.content-box-yellow[
**Closed-Ended**

"Do video games affect mood?"

Can be answered with just "yes" or "no"&amp;mdash;limited exploration.

- Easy to quantify and analyze
- Good for specific, categorizable information such as "Do you have a library card?"
- Useful for gathering straightforward facts or opinions you can count
]
]]

.pull-right[.font90[
.content-box-green[
**Open-Ended**

"How might playing video games affect the mood of middle school students?"

Invites exploration of different effects, game types, and conditions.

- Require detailed, free-form responses
- Provide rich, nuanced information
- Harder to analyze quickly
]
]]

---
### .font70[BRIC-FO.red[R]:] Researchable Questions

.pull-left[.font90[
.content-box-yellow[
**Not Easily Researchable**

"Is there life on other planets?"

Fascinating but beyond a student's ability to gather original data.
]

.content-box-green[
**Researchable Version**

"What do high school students believe about life on other planets?"

Can be investigated through surveys and interviews.
]

.content-box-blue[
**Key Consideration**

Can you gather information to answer this using available tools?
]
]]
